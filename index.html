<!-- What a shared link looks like.
     ------------------------------------------------------------
     The app itself has no text on the screen and that is not going to change,
     but a link posted to a parent's group chat is not the screen: with none of
     this, soother.app pastes as a bare grey URL and nobody clicks it. Meta tags
     are read by machines, not by the child, so they cost the design nothing.

     The picture is the app itself, photographed at 1200 by 630 with the two
     corner controls hidden - the interface is not the product. Kept as a JPEG,
     which for something this smooth is seventy kilobytes against a megabyte as
     a PNG, and the transparency a PNG would preserve is no use to a crawler. -->

     a manifest to launch without browser chrome; iOS ignores it and uses the
     apple- tags below. It is the one thing that cannot live inside this file,
     so it sits beside it - and if it is missing, nothing breaks: the link 404s
     quietly and index.html on its own is still the whole app. -->

<!-- The icon: the app's own progress arc round a touch of light.
     ------------------------------------------------------------
     Not decoration picked to look nice - it is literally the shape the app
     draws when you are making a planet or wearing one away, which is the one
     graphic here a returning user has already learnt. The gap in the ring is
     what makes it memorable: a plain dot-in-a-circle is every second app on the
     web, and an arc caught mid-travel is not. Transparent, as it was.

     SVG first, so it is sharp at every size a browser might ask for and stays
     smooth however far it is scaled; the PNGs are for the places that cannot
     take an SVG - iOS home screens, and Safari before 16.

     The raster is 152 rather than 180 on purpose. A smooth gradient with an
     alpha channel is close to incompressible as a PNG, so 180 cost thirty-nine
     kilobytes against twenty-nine for 152 - and 152 is a size iOS asks for
     anyway and scales cleanly from. Ten kilobytes is not much, but it is ten
     kilobytes of icon in a file that has to be one file. -->

<title>Soother</title>
<style>
  html {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0a14; overflow: hidden; overscroll-behavior: none;
  }
  body {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    touch-action: none; -ms-touch-action: none;
    user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    cursor: none;
  }
  canvas {
    /* FIXED, and sized in vh rather than dvh.
       ------------------------------------------------------------
       vh under viewport-fit=cover is the whole screen; the dynamic viewport
       height stops short of the iPhone home-indicator inset, so dvh would
       leave a strip along the bottom. Fixed rather than absolute so it is laid
       out against the screen itself, not against a body box that may be
       shorter.

       These three declarations are the ONLY thing that decides how big the
       canvas is on the page. The script sets the drawing buffer and must never
       write width or height back onto this element: doing that turned the
       measurement into a loop and froze the canvas at whatever size it booted
       at, which is the bar along the bottom this was first blamed for. See
       viewBox() in the script. */
    display: block; position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: rgba(0,0,0,0);
    outline: none; border: none; cursor: none;
  }
</style>
</head>
<body>
<canvas id="v"></canvas>
<script>
(function () {
  'use strict';

  /* ============================================================
     THE IDEA
     ------------------------------------------------------------
     You are looking into an ecosystem. Nothing you do draws a
     shape; everything you do disturbs the creatures, and what
     makes it interesting is how they answer.

     Every disturbance is an IMPULSE with two dials rolled fresh
     each time:
        reach      how far it carries, from nothing to everything
        uniformity whether everyone answers alike or each their own
     Those two dials are the whole combinatorial space. An impulse
     travels outward as a wavefront rather than applying at once,
     so you watch the answer sweep across the world, and creatures
     that react can pass a weaker impulse onward - a cascade that
     always, eventually, runs out of energy.
     ============================================================ */

  /* ---------- utilities ---------- */
  var TAU = Math.PI * 2;
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var lerp = function (a, b, t) { return a + (b - a) * t; };
  var smooth = function (base, dt) { return 1 - Math.pow(1 - base, dt * 60); };
  function approach(cur, target, tau, dt) {
    return cur + (target - cur) * (1 - Math.exp(-dt / Math.max(0.0001, tau)));
  }
  function norm360(d) { d = d % 360; return d < 0 ? d + 360 : d; }
  // shortest signed angle, for steering toward a heading

    ' else if(t<3.) h=mixhsl(c2,c3,smoothstep(0.,1.,t-2.));',
    ' else h=mixhsl(c3,c4,smoothstep(0.,1.,t-3.));',
    ' return hsl2(h);}',
    // a tangential push around one stroke, falling off with distance
    'vec2 swirl(vec2 q,vec4 S){',
    // strength is signed: which way the hand curled
    ' if(abs(S.z)<=0.0004) return vec2(0.);',
    ' vec2 d=q-S.xy; float r2=dot(d,d);',
    ' float w=S.z*exp(-r2/(S.w*S.w));',
    ' return vec2(-d.y,d.x)*w*1.1;}',
    'void main(){',
    ' vec2 uv=gl_FragCoord.xy/uRes;',
    ' vec2 sc=vec2(uv.x*uRes.x/uRes.y,uv.y);',
    // the field is stirred where hands have passed, and settles back
    ' vec2 sv=swirl(sc,uS0)+swirl(sc,uS1)+swirl(sc,uS2)+swirl(sc,uS3);',
    ' sc+=sv;',
    ' vec2 p=sc*uZoom;',
    // domain warping: run the noise through itself twice so it folds
    ' vec2 q=vec2(fbm(p+vec2(0.,uT*.06)),fbm(p+vec2(5.2,1.3)-uT*.05));',
    ' vec2 r=vec2(fbm(p+uWarp*q+vec2(1.7,9.2)+uT*.04),',
    '             fbm(p+uWarp*q+vec2(8.3,2.8)-uT*.045));',
    ' float f=fbm(p+uWarp*r);',
    // fbm clusters near its mean, so without spreading it only ever
    // reaches the middle of the ramp and everything comes out one hue.
    // The warp field also shifts the ramp position, which is what gives
    // whole regions of a different colour family.
    ' f=clamp((f-.34)*3.2+.5+(q.x-.5)*.62,0.,1.);',
    ' vec3 col=ramp(f);',
    // held well down: the creatures are additive light and have to be
    // the thing you look at, so the field is a lit room, not a lamp
    ' col*=.50*uField;',
    // The stirring is also light in its own right, which is the whole of
    // what shows when the field has gone dark: a swipe across an empty
    // night still leaves a coloured swoosh behind it.
    ' float sw=clamp(length(sv)*6.,0.,1.);',
    ' col+=ramp(.42+sw*.44)*sw*sw*(.09+(1.-uField)*.60);',
    // a soft lift where the field folds most, so it reads as light in liquid
    ' float sheen=clamp(length(r)*.5,0.,1.);',
    ' col+=sheen*sheen*.06;',
    ' gl_FragColor=vec4(col,1.);',
    '}'
  ].join('\n');


  /* ============================================================
     THE LIQUID
     ------------------------------------------------------------
     The backdrop is a real fluid: a velocity field advected through
     itself and made incompressible by a pressure solve, with colour
     carried along in it. That last part is what separates liquid from
     smoke - without the pressure step the colour slides about, and
     with it the colour curls, folds and marbles the way ink does in
     water.

     Everything about it is set slow. Dobryakov's demo, which is where
     this idea came from, is vivid and energetic because it is a toy
     about splashing; this is a thing to stare at. So: gentle forces,
     very little dissipation so a swirl lasts most of a minute, and no
     vorticity confinement at all - that trick exists to put energy
     back into a fluid, and here we do not want it back.

     It never empties. Four emitters wander the field on their own
     slow paths, laying down colour from the drifting palette, and the
     colour decays toward a base tint rather than toward black - so
     with nobody touching it for ten minutes it goes on folding a full
     field of colour into itself instead of fading out.

     Where a hand goes, velocity and colour are injected: that is the
     same addStir() the strokes already call, read here as a force.

     A device that cannot render to a half-float texture keeps the old
     painted field instead - see initGL. That is most things made
     before about 2013, and the painting is not a bad place to be.
     ============================================================ */
  var FL = {
    on: false, sim: null, dye: null, tmp: null, prs: null, div: null,
    prog: {}, quad: null, simW: 0, simH: 0, dyeW: 0, dyeH: 0,
    emit: [], clock: 0
  };
  var FL_ITER = 12;            // pressure iterations; 20 is textbook, 12 is plenty this slow
  var FL_SIM = 112;            // simulation grid, short side
  var FL_DYE = 384;            // colour grid, short side - finer, so folds stay thin

  var F_VERT = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.,1.);}';

  var F_SRC = {
    // carry a field along the flow, and let it decay a little as it goes
    advect:
      'precision highp float;varying vec2 uv;' +
      'uniform sampler2D uSrc,uVel;uniform vec2 uTexel;uniform float uDt,uDiss;' +
      'void main(){' +
      ' vec2 v=texture2D(uVel,uv).xy;' +
      // step backwards along the flow and take what was there
      ' vec2 back=uv-v*uDt*uTexel;' +
      ' gl_FragColor=texture2D(uSrc,back)*uDiss;}',

    diverge:
      'precision highp float;varying vec2 uv;uniform sampler2D uVel;uniform vec2 uTexel;' +
      'void main(){' +
      ' float l=texture2D(uVel,uv-vec2(uTexel.x,0.)).x;' +
      ' float r=texture2D(uVel,uv+vec2(uTexel.x,0.)).x;' +
      ' float b=texture2D(uVel,uv-vec2(0.,uTexel.y)).y;' +
      ' float t=texture2D(uVel,uv+vec2(0.,uTexel.y)).y;' +
      ' gl_FragColor=vec4(0.5*(r-l+t-b),0.,0.,1.);}',

    jacobi:
      'precision highp float;varying vec2 uv;uniform sampler2D uPrs,uDiv;uniform vec2 uTexel;' +
      'void main(){' +
      ' float l=texture2D(uPrs,uv-vec2(uTexel.x,0.)).x;' +
      ' float r=texture2D(uPrs,uv+vec2(uTexel.x,0.)).x;' +
      ' float b=texture2D(uPrs,uv-vec2(0.,uTexel.y)).x;' +
      ' float t=texture2D(uPrs,uv+vec2(0.,uTexel.y)).x;' +
      ' float d=texture2D(uDiv,uv).x;' +
      ' gl_FragColor=vec4((l+r+b+t-d)*0.25,0.,0.,1.);}',

    // take the pressure gradient out of the velocity: this is the step that
    // makes it behave like a liquid rather than like drifting smoke
    subtract:
      'precision highp float;varying vec2 uv;uniform sampler2D uPrs,uVel;uniform vec2 uTexel;' +
      'void main(){' +
      ' float l=texture2D(uPrs,uv-vec2(uTexel.x,0.)).x;' +
      ' float r=texture2D(uPrs,uv+vec2(uTexel.x,0.)).x;' +
      ' float b=texture2D(uPrs,uv-vec2(0.,uTexel.y)).x;' +
      ' float t=texture2D(uPrs,uv+vec2(0.,uTexel.y)).x;' +
      ' vec2 v=texture2D(uVel,uv).xy-vec2(r-l,t-b);' +
      ' gl_FragColor=vec4(v,0.,1.);}',

    // a soft round push, used both for hands and for the wandering emitters
    splat:
      'precision highp float;varying vec2 uv;uniform sampler2D uSrc;' +
      'uniform vec2 uPoint,uAmount;uniform vec3 uColor;uniform float uRad,uIsDye,uAspect;' +
      'void main(){' +
      ' vec2 d=uv-uPoint; d.x*=uAspect;' +
      ' float f=exp(-dot(d,d)/uRad);' +
      ' vec4 b=texture2D(uSrc,uv);' +
      ' if(uIsDye>0.5) gl_FragColor=vec4(b.rgb+uColor*f,1.);' +
      ' else gl_FragColor=vec4(b.xy+uAmount*f,0.,1.);}',

    // and what you actually see
    show:
      'precision highp float;varying vec2 uv;uniform sampler2D uDye;' +
      'uniform float uField;uniform vec2 uTexel;' +
      'void main(){' +
      ' vec3 c=texture2D(uDye,uv).rgb;' +
      /* Two rules keep the ink from being mistaken for a creature.

         First it must stay COLOURED. Ink that piles up goes white, and white
         with a bright core is precisely what a creature looks like - so the
         common part of the three channels is pulled down, which leaves hue
         behind however much has accumulated. Nothing in the water can be
         white; only the creatures are allowed that.

         Second it must have a CEILING. A soft knee rather than a clamp, so
         the densest plumes roll off and compress instead of flattening into
         a bright patch with an edge. It tops out at about half the brightness
         a creature core reaches, which is the gap that tells them apart.

         The sharpening pass that used to be here was making it worse: it drew
         a bright rim around each plume, and a rim is exactly what reads as an
         object rather than as haze. */
      ' float d=max(c.r,max(c.g,c.b));' +
      ' if(d<0.002){gl_FragColor=vec4(0.,0.,0.,1.);return;}' +
      // the colour on its own, with the brightness divided out of it
      ' vec3 hue=c/d;' +
      ' float mn=min(hue.r,min(hue.g,hue.b));' +
      ' vec3 pure=(hue-mn)/max(1e-4,1.0-mn);' +
      /* Density is spent on SATURATION, not on brightness. Piling more ink
         into one place used to make it brighter, and bright plus dense is
         white - which is exactly what a creature core looks like, so the two
         became impossible to tell apart. Now more ink means a deeper, purer
         colour, and the brightness flattens out almost immediately against a
         ceiling of about half what a creature reaches. It can never be white,
         however much of it collects. */
      ' float sat=clamp(d*1.7,0.0,1.0);' +
      ' vec3 col=mix(hue,pure,sat);' +
      ' float lum=(1.0-exp(-d*2.4))*0.52;' +
      ' gl_FragColor=vec4(col*lum*uField,1.);}'
  };

  function flProg(gl, src) {
    function sh(type, t) {
      var o = gl.createShader(type);
      gl.shaderSource(o, t); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) return null;
      return o;
    }
    var v = sh(gl.VERTEX_SHADER, F_VERT), f = sh(gl.FRAGMENT_SHADER, src);
    if (!v || !f) return null;
    var pr = gl.createProgram();
    gl.attachShader(pr, v); gl.attachShader(pr, f); gl.linkProgram(pr);
    if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return null;
    var u = {}, n = gl.getProgramParameter(pr, gl.ACTIVE_UNIFORMS);
    for (var i = 0; i < n; i++) {
      var nm = gl.getActiveUniform(pr, i).name;
      u[nm] = gl.getUniformLocation(pr, nm);
    }
    return { p: pr, u: u };
  }

  /* One render target. Returns null rather than throwing if this device
     cannot actually RENDER to the format - being able to create such a
     texture is not the same thing, and that is where this usually breaks. */
  function flTarget(gl, w, h, type, filter) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, type, null);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) return null;
    gl.viewport(0, 0, w, h);
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex: tex, fb: fb, w: w, h: h, tx: 1 / w, ty: 1 / h };
  }
  function flPair(gl, w, h, type, filter) {
    var a = flTarget(gl, w, h, type, filter);
    var b = a ? flTarget(gl, w, h, type, filter) : null;
    if (!a || !b) return null;
    return { r: a, w: b, swap: function () { var t = this.r; this.r = this.w; this.w = t; } };
  }

  function initFluid(gl) {
    /* Half float first, then full float. WebGL 1 needs the extension for the
       texture to exist at all, and a SEPARATE check that a framebuffer using
       it is complete - plenty of devices offer the first and fail the second.
       Linear filtering also needs its own extension; without it advection
       still works, just blockier, so we take NEAREST rather than give up. */
    var hf = gl.getExtension('OES_texture_half_float');
    var hfl = gl.getExtension('OES_texture_half_float_linear');
    var ff = gl.getExtension('OES_texture_float');
    var ffl = gl.getExtension('OES_texture_float_linear');
    var tries = [];
    if (hf) tries.push({ type: hf.HALF_FLOAT_OES, lin: !!hfl });
    if (ff) tries.push({ type: gl.FLOAT, lin: !!ffl });
    if (!tries.length) return false;

    var aspect = GL.cv.width / Math.max(1, GL.cv.height);
    FL.simW = Math.round(FL_SIM * (aspect > 1 ? aspect : 1));
    FL.simH = Math.round(FL_SIM * (aspect > 1 ? 1 : 1 / aspect));
    FL.dyeW = Math.round(FL_DYE * (aspect > 1 ? aspect : 1));
    FL.dyeH = Math.round(FL_DYE * (aspect > 1 ? 1 : 1 / aspect));

    for (var i = 0; i < tries.length; i++) {
      var ty = tries[i].type;
      var filt = tries[i].lin ? gl.LINEAR : gl.NEAREST;
      FL.sim = flPair(gl, FL.simW, FL.simH, ty, filt);
      FL.dye = flPair(gl, FL.dyeW, FL.dyeH, ty, filt);
      FL.prs = flPair(gl, FL.simW, FL.simH, ty, gl.NEAREST);
      FL.div = flTarget(gl, FL.simW, FL.simH, ty, gl.NEAREST);
      if (FL.sim && FL.dye && FL.prs && FL.div) break;
      FL.sim = FL.dye = FL.prs = FL.div = null;
    }
    if (!FL.sim) return false;

    for (var k in F_SRC) {
      FL.prog[k] = flProg(gl, F_SRC[k]);
      if (!FL.prog[k]) return false;
    }

    // four wanderers, each on its own unhurried figure
    for (var e = 0; e < 4; e++) {
      FL.emit.push({ ax: rnd(0.12, 0.42), ay: rnd(0.12, 0.42),
                     fx: rnd(0.013, 0.037), fy: rnd(0.011, 0.033),
                     px: Math.random() * TAU, py: Math.random() * TAU,
                     due: Math.random() * 3, stop: e % 5 });
    }
    FL.on = true;
    return true;
  }

  function flBind(gl, prog) { gl.useProgram(prog.p); return prog.u; }
  function flDraw(gl, target) {
    if (target) {
      gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb);
      gl.viewport(0, 0, target.w, target.h);
    } else {
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, GL.cv.width, GL.cv.height);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function flTex(gl, tex, unit) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    return unit;
  }

  /* Push velocity, colour, or both, into a soft round patch. Point is in
     0..1 across the field with y already flipped to match the texture. */
  function flSplat(gl, x, y, dx, dy, col, rad) {
    var u, asp = FL.simW / Math.max(1, FL.simH);
    if (dx || dy) {
      u = flBind(gl, FL.prog.splat);
      gl.uniform1i(u.uSrc, flTex(gl, FL.sim.r.tex, 0));
      gl.uniform2f(u.uPoint, x, y);
      gl.uniform2f(u.uAmount, dx, dy);
      gl.uniform3f(u.uColor, 0, 0, 0);
      gl.uniform1f(u.uRad, rad);
      gl.uniform1f(u.uIsDye, 0);
      gl.uniform1f(u.uAspect, asp);
      flDraw(gl, FL.sim.w); FL.sim.swap();
    }
    if (col) {
      u = flBind(gl, FL.prog.splat);
      gl.uniform1i(u.uSrc, flTex(gl, FL.dye.r.tex, 0));
      gl.uniform2f(u.uPoint, x, y);
      gl.uniform2f(u.uAmount, 0, 0);
      gl.uniform3f(u.uColor, col[0], col[1], col[2]);
      gl.uniform1f(u.uRad, rad);
      gl.uniform1f(u.uIsDye, 1);
      gl.uniform1f(u.uAspect, asp);
      flDraw(gl, FL.dye.w); FL.dye.swap();
    }
  }

  function stepFluid(gl, dt) {
    var u, i;
    FL.clock += dt;

    /* Every so often one of the wanderers lets go of a plume: a push of
       velocity and a blot of colour that then curls away on its own. Between
       times they do nothing at all, so what you watch is mostly the water
       still moving from the last one - which is the calm part. */
    for (i = 0; i < FL.emit.length; i++) {
      var e = FL.emit[i];
      e.due -= dt;
      if (e.due > 0) continue;
      e.due = 3.5 + Math.random() * 5.5;
      var ex = 0.5 + Math.sin(FL.clock * e.fx * TAU + e.px) * e.ax;
      var ey = 0.5 + Math.cos(FL.clock * e.fy * TAU + e.py) * e.ay;
      var c = palRGBof(e.stop);
      var a2 = Math.random() * TAU, force = 260 + Math.random() * 320;
      flSplat(gl, ex, ey, Math.cos(a2) * force, Math.sin(a2) * force,
              [c[0] * 0.85, c[1] * 0.85, c[2] * 0.85], 0.0055);
    }

    // ---- and a hand, wherever one has been
    for (i = 0; i < stir.length; i++) {
      var st = stir[i];
      if (!st.s) continue;
      var sx = st.x * (Math.max(1, H) / Math.max(1, W));
      var sy = st.y;
      var sw = st.s * 340 * dt;
      var hc = palRGBof(1 + ((i + (FL.clock * 0.2) | 0) % 4));
      // a swirl rather than a shove, and it leaves colour where it went
      flSplat(gl, sx, sy, -sw, sw * 0.6,
              [hc[0] * dt * 1.5, hc[1] * dt * 1.5, hc[2] * dt * 1.5],
              st.r * st.r * 0.55);
    }

    // ---- advect the velocity through itself
    u = flBind(gl, FL.prog.advect);
    gl.uniform1i(u.uSrc, flTex(gl, FL.sim.r.tex, 0));
    gl.uniform1i(u.uVel, flTex(gl, FL.sim.r.tex, 0));
    gl.uniform2f(u.uTexel, FL.sim.r.tx, FL.sim.r.ty);
    gl.uniform1f(u.uDt, dt);
    gl.uniform1f(u.uDiss, 0.9975);      // a swirl lasts the best part of a minute
    flDraw(gl, FL.sim.w); FL.sim.swap();

    // ---- make it incompressible
    u = flBind(gl, FL.prog.diverge);
    gl.uniform1i(u.uVel, flTex(gl, FL.sim.r.tex, 0));
    gl.uniform2f(u.uTexel, FL.sim.r.tx, FL.sim.r.ty);
    flDraw(gl, FL.div);

    // pressure keeps its previous solution as a starting guess, which is
    // why twelve iterations is enough when it only changes a little a frame
    for (i = 0; i < FL_ITER; i++) {
      u = flBind(gl, FL.prog.jacobi);
      gl.uniform1i(u.uPrs, flTex(gl, FL.prs.r.tex, 0));
      gl.uniform1i(u.uDiv, flTex(gl, FL.div.tex, 1));
      gl.uniform2f(u.uTexel, FL.sim.r.tx, FL.sim.r.ty);
      flDraw(gl, FL.prs.w); FL.prs.swap();
    }
    u = flBind(gl, FL.prog.subtract);
    gl.uniform1i(u.uPrs, flTex(gl, FL.prs.r.tex, 0));
    gl.uniform1i(u.uVel, flTex(gl, FL.sim.r.tex, 1));
    gl.uniform2f(u.uTexel, FL.sim.r.tx, FL.sim.r.ty);
    flDraw(gl, FL.sim.w); FL.sim.swap();

    // ---- carry the ink along, thinning as it goes
    u = flBind(gl, FL.prog.advect);
    gl.uniform1i(u.uSrc, flTex(gl, FL.dye.r.tex, 0));
    gl.uniform1i(u.uVel, flTex(gl, FL.sim.r.tex, 1));
    gl.uniform2f(u.uTexel, FL.dye.r.tx, FL.dye.r.ty);
    gl.uniform1f(u.uDt, dt);
    // a plume is half gone in about twenty seconds, so there is always
    // something in the water without it ever silting up
    gl.uniform1f(u.uDiss, 0.99942);
    flDraw(gl, FL.dye.w); FL.dye.swap();

    // ---- and show it
    u = flBind(gl, FL.prog.show);
    gl.uniform1i(u.uDye, flTex(gl, FL.dye.r.tex, 0));
    gl.uniform2f(u.uTexel, FL.dye.r.tx, FL.dye.r.ty);
    gl.uniform1f(u.uField, bgField);
    flDraw(gl, null);
  }

  function initGL() {
    try {
      GL.cv = document.createElement('canvas');
      var gl = GL.cv.getContext('webgl', { antialias: false, depth: false, alpha: false })
            || GL.cv.getContext('experimental-webgl');
      if (!gl) return;
      function sh(type, src) {
        var o = gl.createShader(type);
        gl.shaderSource(o, src); gl.compileShader(o);
        if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) return null;
        return o;
      }
      var vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
      if (!vs || !fs) return;
      var pr = gl.createProgram();
      gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) return;
      gl.useProgram(pr);
      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(pr, 'p');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      GL.u.res = gl.getUniformLocation(pr, 'uRes');
      GL.u.t = gl.getUniformLocation(pr, 'uT');
      GL.u.warp = gl.getUniformLocation(pr, 'uWarp');
      GL.u.zoom = gl.getUniformLocation(pr, 'uZoom');
      GL.u.c = [0,1,2,3,4].map(function (i) { return gl.getUniformLocation(pr, 'c' + i); });
      GL.u.s = [0,1,2,3].map(function (i) { return gl.getUniformLocation(pr, 'uS' + i); });
      GL.u.field = gl.getUniformLocation(pr, 'uField');
      GL.gl = gl; GL.prog = pr; GL.ok = true;
      /* And now the liquid. If this device cannot render to a float texture
         it keeps the painted field above instead, which is a perfectly good
         place to be - it is what everything before about 2013 will see. */
      try { initFluid(gl); } catch (e2) { FL.on = false; }
    } catch (e) { GL.ok = false; }
  }

  var warp = 3.0, warpT = 3.0, zoom = 2.1, zoomT = 2.1, bgClock = 0;

  /* How much painting there is. Sometimes there is none at all and the
     world is a dark room with light in it, which turns out to be one of
     the nicest things it does - so it is one of the places the backdrop
     can wander to, arrived at over about ten seconds so that you never
     catch it changing. The painting is much the likeliest, and a full
     void is rare enough to feel like weather. */
  var bgField = 1, bgFieldT = 1, fieldHold = 0;
  /* Three things were pulling this towards the dark at once. Two of nine
     entries were a full void and a third was 0.30 - which, against the 0.50
     the field is multiplied by anyway, is 15% brightness and reads as black
     too - so a third of all values were effectively night. The painting is
     the default state now, and the dim tier sits where the painting is still
     visibly there rather than merely implied. */
  var BG_FIELDS = [1, 1, 1, 1, 1, 0.88, 0.84, 0.72, 0.68, 0.52, 0, 0];
  /* And it has its own clock. It used to re-roll only when the palette
     changed, and only on half of those, so the average stay in any one state
     was over a minute and a half - far too long for the dark to be a mood
     rather than a setting. Darkness is now weather: it passes in a quarter
     of a minute, while a painted field is happy to stay a good while. */
  function driftField() {
    bgFieldT = pick(BG_FIELDS);
    fieldHold = now() + (bgFieldT < 0.35 ? rnd(11, 24) : rnd(40, 95));
  }

  /* ---- swirls left in the liquid ---------------------------
     A hand dragged through the field displaces it, and the water
     settles back afterwards. Four at a time feed straight into the
     shader's domain warp, so a stroke is not drawn on top of the
     background - it disturbs it.

     Everything here is eased, and that is the point. An earlier
     version snapped a swirl's centre and strength to new values the
     moment a slot was reused, which made the background jump; and
     the displacement was three times too strong, which made every
     jump violent. Now each swirl has a target that it chases: while
     a finger keeps feeding it the target follows the finger, and
     when the feeding stops the target unwinds and the swirl closes
     over. A slot may only be handed to a new owner while it is too
     faint to see, so a centre never visibly teleports. */
  var stir = [];
  for (var sti = 0; sti < 4; sti++) {
    stir.push({ own: null, x: 0.5, y: 0.5, r: 0.18, s: 0,
                tx: 0.5, ty: 0.5, tr: 0.18, ts: 0, dk: 1.4, fed: false });
  }
  var stirSeq = 0;

  function addStir(x, y, strength, radius, owner, decay) {
    if (owner === undefined || owner === null) owner = 'i' + (stirSeq++);
    var slot = null, i;
    for (i = 0; i < stir.length; i++) if (stir[i].own === owner) { slot = stir[i]; break; }
    if (!slot) {
      // the faintest one, and only if it is faint enough to move unseen
      var quiet = stir[0];
      for (i = 1; i < stir.length; i++) {
        if (Math.abs(stir[i].s) < Math.abs(quiet.s)) quiet = stir[i];
      }
      if (Math.abs(quiet.s) > Math.abs(strength) * 0.8) return;   // all busier than this
      slot = quiet;
      slot.own = owner;
      slot.x = slot.tx; slot.y = slot.ty;      // wherever it had got to
    }
    var nx = x / Math.max(1, H);               // aspect corrected, as in the shader
    var ny = 1 - y / Math.max(1, H);
    if (Math.abs(slot.s) < 0.004) { slot.x = nx; slot.y = ny; slot.r = radius; }
    slot.tx = nx; slot.ty = ny; slot.tr = radius;
    slot.ts = clamp(strength, -0.14, 0.14);
    slot.dk = decay || 1.4;
    slot.fed = true;
  }

  function stepStir(dt) {
    for (var i = 0; i < stir.length; i++) {
      var st = stir[i];
      if (st.fed) st.fed = false;
      else {
        // nothing is feeding it any more, so it unwinds of its own accord
        var d = st.dk * dt;
        st.ts = st.ts > 0 ? Math.max(0, st.ts - d) : Math.min(0, st.ts + d);
      }
      var e = smooth(0.20, dt);
      st.x = lerp(st.x, st.tx, e); st.y = lerp(st.y, st.ty, e);
      st.r = lerp(st.r, st.tr, e);
      st.s = approach(st.s, st.ts, 0.28, dt);
      if (st.ts === 0 && Math.abs(st.s) < 0.0022) { st.s = 0; st.own = null; }
    }
  }

  function drawBackground(t, dt) {
    driftPalette(dt);
    stepStir(dt);
    // the field itself comes and goes, over ten unhurried seconds
    if (t > fieldHold) driftField();
    bgField = approach(bgField, bgFieldT, 9.0, dt);
    warp = approach(warp, warpT, 9, dt);
    zoom = approach(zoom, zoomT, 11, dt);
    if (Math.random() < dt * 0.02) { warpT = rnd(1.8, 4.6); zoomT = rnd(1.5, 3.0); }
    if (!GL.ok) return;
    var gl = GL.gl;
    if (FL.on) {
      // clamped: a long stall must not let the liquid take one enormous step
      stepFluid(gl, Math.min(dt, 1 / 30));
      return;
    }
    gl.viewport(0, 0, GL.cv.width, GL.cv.height);
    gl.uniform2f(GL.u.res, GL.cv.width, GL.cv.height);
    // its own clock, so the field can dream more slowly while asleep
    bgClock += dt * (1 - (world.sleep || 0) * 0.62);
    gl.uniform1f(GL.u.t, bgClock);
    gl.uniform1f(GL.u.warp, warp);
    gl.uniform1f(GL.u.zoom, zoom);
    for (var j = 0; j < 5; j++) {
      var c = palHSL[j] || [0, 0, 0];
      gl.uniform3f(GL.u.c[j], c[0], c[1], c[2]);
    }
    gl.uniform1f(GL.u.field, bgField);
    for (var k2 = 0; k2 < 4; k2++) {
      var st = stir[k2];
      gl.uniform4f(GL.u.s[k2], st.x, st.y, st.s, st.r);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ============================================================
     LAYERS
     ------------------------------------------------------------
     Three strata. A disturbance reaches one, another, or several,
     chosen at random - and which stratum was struck changes both
     who answers and how long they take about it.
     ============================================================ */
  var LAYERS = [
    { par: 0.42, size: 1.55, alpha: 0.5, spd: 0.55, lag: 0.55 },  // deep
    { par: 0.75, size: 1.0,  alpha: 0.9, spd: 1.0,  lag: 0.22 },  // middle
    { par: 1.12, size: 0.62, alpha: 1.0, spd: 1.7,  lag: 0.06 }   // sky
  ];
  var LAYER_SETS = [[0], [1], [2], [1, 2], [0, 1], [0, 1, 2], [0, 2]];
  // LAYERS[i].size flattened: the pair loop below reads it thousands of
  // times a frame and a flat array beats a property chain
  var LSIZE = [1.55, 1.0, 0.62];

  /* ============================================================
     SPECIES
     ------------------------------------------------------------
     Shape is drawn, not implied: rounds, ribbons, jellies,
     urchins, rings, clusters, shards, wisps. Everything abstract,
     nothing depicting anything.
     ============================================================ */
  /* Every form is built from layered soft light. Nothing is outlined:
     a hard vector stroke sitting next to additive glow has no falloff
     and always reads as clip-art. `w` weights how common each is. */
  /* ra / rb: how far this form is actually DRAWN, along its heading and across
     it, as a multiple of its size. Taken from the draw code below, not guessed
     - the streaming forms reach two to four times further than the compact
     ones, and the hit test has to know that or half of them cannot be touched. */
  var SPECIES = [
    { form: 'sun',     i: 0, sz: [18, 36], wob: 0.16, calm: 0.35, voice: 'pluck',   tail: 3,  w: 4, ra: 2.3, rb: 2.3 },
    { form: 'lava',    i: 1, sz: [24, 48], wob: 0.35, calm: 0.78, voice: 'bowl',    tail: 5,  w: 4, ra: 1.9, rb: 1.9 },
    { form: 'droplet', i: 2, sz: [17, 34], wob: 0.30, calm: 0.6,  voice: 'drop',    tail: 8,  w: 3, ra: 2.8, rb: 1.5 },
    { form: 'ribbon',  i: 3, sz: [11, 21], wob: 0.50, calm: 0.5,  voice: 'breath',  tail: 16, w: 3, ra: 4.3, rb: 2.0 },
    { form: 'wisp',    i: 4, sz: [14, 28], wob: 0.60, calm: 0.8,  voice: 'breath',  tail: 13, w: 3, ra: 4.7, rb: 1.9 },
    { form: 'jelly',   i: 5, sz: [20, 36], wob: 0.32, calm: 0.6,  voice: 'drop',    tail: 9,  w: 2, ra: 2.7, rb: 2.7 },
    { form: 'blob',    i: 6, sz: [20, 39], wob: 0.22, calm: 0.7,  voice: 'bowl',    tail: 4,  w: 2, ra: 1.8, rb: 1.8 },
    { form: 'cluster', i: 7, sz: [13, 24], wob: 0.40, calm: 0.3,  voice: 'marimba', tail: 5,  w: 1, ra: 2.1, rb: 2.1 }
  ];
  /* ---- who likes whom -----------------------------------------
     A weak, permanent leaning between kinds, symmetric, read as a
     square table indexed by the species numbers above. Positive is
     drawn towards, negative is kept away from. It is deliberately far
     too weak to see happening - over ten seconds it is worth about
     sixty pixels of drift - so the room slowly develops structure
     without anything appearing to be pulled.

     The relationships were chosen to be legible once you notice them:
     clusters swarm around suns, wisps and ribbons stream together,
     droplets school with their own, blobs settle towards lava, wisps
     keep well away from it, and clusters will not share with another
     cluster - which is what spreads them out across the screen.

     It costs nothing: the personal-space loop below already walks
     every pair exactly once and has the distance in hand. */
  var AFF = [
  /*         sun  lava  drop  ribb  wisp jelly  blob  clus */
  /* sun  */  0.0,  0.1,  0.3,  0.2,  0.2,  0.1,  0.1,  0.7,
  /* lava */  0.1,  0.2, -0.2, -0.1, -0.4,  0.2,  0.5,  0.0,
  /* drop */  0.3, -0.2,  0.6,  0.1,  0.2, -0.1, -0.1,  0.2,
  /* ribb */  0.2, -0.1,  0.1,  0.4,  0.6,  0.0, -0.1,  0.1,
  /* wisp */  0.2, -0.4,  0.2,  0.6,  0.5,  0.1, -0.2,  0.1,
  /* jelly*/  0.1,  0.2, -0.1,  0.0,  0.1,  0.5,  0.2, -0.1,
  /* blob */  0.1,  0.5, -0.1, -0.1, -0.2,  0.2,  0.3,  0.0,
  /* clus */  0.7,  0.0,  0.2,  0.1,  0.1, -0.1,  0.0, -0.3
  ];
  var AFF_R = 300;               // beyond this they take no notice

  /* ============================================================
     WEIGHT
     ------------------------------------------------------------
     A law rather than an effect: everything has a mass, mass is size,
     and a big enough thing pulls smaller ones towards it. Nothing is
     special-cased - a creature that has been fed at enough blooms
     simply becomes heavy enough to hold others, and things start
     going round it.

     The sideways component is what makes that watchable. A pure pull
     drags everything into a heap; adding a push at right angles to it
     puts them into orbit instead, so what you see is a small system
     that holds together and turns.

     And when something small does fall all the way in, it is taken
     in: the big one grows by what it swallowed and its colour moves
     towards the colour of what fell. Which is how, over a few
     minutes, a thing that eats blue things becomes blue.
     ============================================================ */
  /* ---- how much weight the world is allowed --------------------
     The first version of this ran away badly. Anything crossing the
     threshold stopped keeping its distance, started pulling others in,
     swallowed them, grew, and pulled harder - so within a minute half
     the population was enormous, piled in the middle, and their cores
     were overlapping into white. Three rules hold it in check:

       only ONE world at a time, and nothing else may cross the line
       while it exists

       two heavy things still keep well apart, so worlds never merge
       into a heap - only heavy-and-light are allowed close

       a world slowly gives its weight back, so it is a phase something
       goes through rather than a state it reaches and keeps
     ------------------------------------------------------------ */
  /* Being a world is EARNED, not merely being large. Keying it off raw size
     was wrong twice over: lava is born at up to 48 and blobs at 39, so a
     good fraction of the population arrived already counting as worlds - and
     it meant "big species" and "has been fed" were the same thing, when the
     whole point is that you make a world by feeding one. So it is a flag,
     set only when something has grown well past the size it was born at. */
  var HEAVY_MAX = 62;            // the largest a world may get
  /* And the sizes that are actually enforced, in the frame loop, where no
     growth path can slip past them. A world is born at 38 and may work its way
     up a little; a ball is born at 27. */
  /* A planet is ONE SIZE. Not a range that creeps, not a thing that grows into
     the room and not a thing that visibly wastes away: you make one, and that
     is how big a planet is. The small spread at birth is only so that three of
     them on screen are not stamped from the same die.

     Small on purpose. At the old size a planet was a sixth of the height of a
     phone held upright, which is less an object in the room than a hole in it.
     This is about two thirds of that, which is big enough to have a surface you
     can read and small enough that two or three of them still leave a room. */
  /* A planet is a FRACTION OF THE VIEW, not a number of pixels.
     ------------------------------------------------------------
     Two reports that look contradictory - "very small, make it bigger" and
     then "FAR too big" at a size only twenty percent larger - and both were
     right, for two reasons worth writing down.

     The first is that the surface became visible in between. A hundred and
     eleven pixels of soft glow reads as a small light; a hundred and forty of
     solid disc with a hard limb reads as an object taking over the room. The
     same number means different things depending on whether the thing is
     opaque, so tuning the number against the old rendering was worthless.

     The second is that a pixel count is the wrong unit. Measured off the
     report: a browser window with its chrome is about 560 tall, where 145
     pixels is a quarter of the height - while the same planet in a 720-tall
     full-screen test is a fifth of it, and on a phone held upright it would be
     a sixth. One number cannot be right for all three, so this is a share of
     the diagonal instead, bounded at both ends so a watch and a wall both get
     something sensible. */
  function worldBornSize() {
    /* Half again. Small enough not to announce itself, which is the point: it
       should be a thing you notice and go over to, not a thing the screen is
       about. About a twentieth of the diagonal. */
    var dia = clamp(DIAG * 0.036, 40, 60);
    return (dia * 0.5) / 2.1 * rnd(0.94, 1.06);   // back into c.size units
  }

  /* ============================================================
     A WORLD HAS ONE RADIUS
     ------------------------------------------------------------
     It had two, and they disagreed badly enough to cause both of the things
     that were wrong with planets.

     What was DRAWN was size x layer x reaction-scale x mood x 1.8. What the
     PHYSICS used was size x layer. At the size cap that is a hundred and forty
     pixels on screen against sixty-eight in the simulation - so:

       capping c.size did nothing visible, because the four multipliers after
         it were free to quadruple the result. One of them is the reaction
         scale, which is why a planet ballooned further every time the room got
         busy - it was swelling with every reaction that fired near it;

       and everything the physics called "the surface" was deep inside the
         visible disc. Things bouncing off a planet were being held a third of
         the way in, which is precisely why they looked stuck to it like a
         magnet rather than going round it.

     So there is now one number. Drawing uses it, gravity uses it, orbits are
     multiples of it, and it is capped where it is computed. It deliberately
     ignores the reaction scale and the mood swell: a planet is the heaviest
     thing here and it has no business puffing up because something startled
     it.
     ============================================================ */
  var WORLD_R_MAX = 32;   // the hard ceiling on the drawn edge, whatever the view
  /* The spacing between orbits, and therefore the ONLY thing that decides how
     big a moon may be: two of them have to fit between neighbouring rings
     without touching. Tying the size cap to the planet instead - which is what
     the first two attempts did, at 0.85 and then 1.5 of its radius - got it
     wrong in both directions, because the planet's size has nothing to do with
     how much room there is between one orbit and the next. */
  var ORB_GAP = 56;

  /* No layer term either. The three depth layers scale creatures by 0.62, 1.0
     and 1.55, which is right for a crowd of drifting things - but a planet is a
     specific object a child made on purpose, and taking the layer into account
     meant one came out at eighty pixels across and the next at a hundred and
     ninety for reasons nobody can see. Measured both. A planet is a planet. */
  function worldR(c) {
    /* From born0, NOT from size. Pinning size every frame was still not enough:
       something writes it again after the pin and before the next one, and a
       planet was measured stepping 119, 123, 128, 111 while it just sat there.
       Chasing that write would fix this one case and leave the next one open.

       born0 is written once, at birth, and never again - so reading the radius
       from it means no stray write to size can be seen at all, by drawing or by
       physics. This is the same move that fixed the growth and the magnet: put
       the guarantee in the one place everything has to go through. */
    return Math.min(WORLD_R_MAX, (c.born0 || c.size) * 2.1);
  }
  var WORLD_GROW = 1.7;          // and how much bigger than birth it must be
  var heavyCount = 0;            // worlds right now, recounted every frame

  /* The other way one used to appear - feed a single creature enough and it
     became a planet on its own - is also gone. With a spawner there is exactly
     one way in and one way out, which is the whole point of this change: two
     creation paths meant two sets of rules about size, type and placement, and
     they disagreed twice this week. */
  function maybeWorld(c) {
    return;
    if (c.world || c.elder || heavyCount >= MAX_WORLDS) return;
    if (c.size > c.born0 * WORLD_GROW && c.size > 36) {
      c.world = true;
      /* The SECOND way a planet can come about: feed one creature enough and it
         turns into one on its own. It kept whatever size it had grown to, which
         is how a planet could still turn up bigger than any planet you can make
         deliberately - measured at a hundred and twenty-eight pixels across
         against a hundred and eighteen for a made one. A planet is a planet
         however it got here, so it takes the same one size. */
      c.size = worldBornSize();
      c.born0 = c.size;
      c.wear = 0;
      c.age = 0; c.span = rnd(95, 170);
      if (!c.land) makeLand(c, 4, 1.5);
    }
  }

  var SPECIES_BAG = [];
  (function () {
    for (var i = 0; i < SPECIES.length; i++) {
      for (var k = 0; k < SPECIES[i].w; k++) SPECIES_BAG.push(SPECIES[i]);
    }
  })();

  /* ============================================================
     REACTIONS
     ------------------------------------------------------------
     What a creature can do when something reaches it. Each sets a
     short-lived state; the drawing and the motion read it. The
     variety the player feels comes less from the count than from
     which creatures get them, in what order, and how far it runs.
     ============================================================ */
  var REACTIONS = [
    'giggle', 'bloom', 'scamper', 'rush', 'curl', 'spin', 'shed', 'flip',
    'ripple', 'freeze', 'stretch', 'huddle', 'shy', 'pulse', 'sing',
    'tumble', 'yawn', 'sparkle', 'bob', 'peek'
  ];

  var creatures = [], pulses = [], sparks = [], sparkHead = 0;
  var shoves = [];
  var SPARKN = 400;
  var world = {
    hue: 200, energy: 0, calm: 1,
    lastPulse: -1e9, poked: 0, hints: 2, hintCool: 20, pop: 0,
    sleep: 0, idle: 0, wake: 0
  };

  function stock() {
    var target = Math.round(clamp((W * H) / 24000, 26, 74));
    /* A dozen spare bodies kept at no vitality at all, so that anything
       wanting to make a new creature - splitting, shedding - actually can.
       The pool used to be exactly the live population, which meant every
       body was always in use and freeCreature() returned null almost
       always: those outcomes fired and silently did nothing. */
    var pool = target + 12;
    while (creatures.length < pool) creatures.push(makeCreature());
    if (creatures.length > pool) creatures.length = pool;
    while (sparks.length < SPARKN) {
      sparks.push({ x: 0, y: 0, vx: 0, vy: 0, r: 2, hue: 0, life: 0, max: 1 });
    }
  }

  function makeCreature(x, y) {
    var sp = SPECIES_BAG[(Math.random() * SPECIES_BAG.length) | 0];
    var L = (Math.random() * 3) | 0;
    /* Now and then one of them is an elder: much larger, much slower,
       far longer lived, breathing on its own rhythm. They are rare
       enough to be a find, and touching one is a bigger deal than
       touching anything else. */
    var elder = Math.random() < 0.07;
    var c = {
      sp: sp, L: L,
      x: x === undefined ? Math.random() * W : x,
      y: y === undefined ? Math.random() * H : y,
      vx: rnd(-20, 20), vy: rnd(-20, 20),
      size: rnd(sp.sz[0], sp.sz[1]) * (elder ? 2.25 : 1),
      elder: elder,
      // a wide personal hue: tying everyone to the world hue made the
      // whole population one colour, and they vanished into the paint
      hueOff: rnd(-175, 175), phase: Math.random() * TAU,
      rot: Math.random() * TAU, spin: rnd(-0.5, 0.5),
      mood: 0,            // 0..1 excitement
      bias: Math.random() * TAU, biasTurn: rnd(-0.25, 0.25),
      held: null, grab: null, gt: 0, hopT: 0, hold: null, holdSize: 0,
      socT: 0, socCool: 0, stance: null, with: null, orbA: 0, lastGather: -99,
      spot: null,                 // a place it is currently interested in
      orbE: 0, freeT: 0, inOrb: null,   // working up the nerve to leave orbit
      orbP: null, orbSkip: null,  // and whether it is circling a wind-up
      orbR: 0, orbA: 0, orbS: 0, orbTo: 0,   // and its path round a world
      hush: 0,                    // sent away, and how long until it is back
      cloud: null,                // its weather, turning faster than the ground
      gcv: null, gctx: null, gtick: 0,   // the little canvas its surface is painted on
      aloof: Math.random() < 0.68,        // most never take an interest in planets
      ember: false, fuse: 0,      // the one that will clear the whole room
      world: false, born0: 0,     // and whether it has been fed into a world
      wear: 0, wearAt: 0,         // and the energy put into ending it
      ptype: 0, rings: 0,         // what sort of world, if it is one
      land: null, spinBase: 0,    // its surface, and how fast it turns
      armor: 0,                   // just born: cannot be worn away yet
      want: null, wantT: 0, wantCool: rnd(0, 30),   // somewhere it is headed
      feed: null, feedT: 0,       // and whether it is at one, taking something
      band: null,                 // and who it is knocking about with
      chase: null,                // or a hand it has decided to tag along with
      antic: 0, locked: false, pairWith: null, pairYes: false, pairPlan: null, sizeGoal: 0,
      social: rnd(0.12, 1.5),   // how sociable this one happens to be
      // how much of itself it puts into answering: mostly a little
      answer: 0.06 + Math.pow(Math.random(), 2.1) * 0.94,
      homeX: 0, homeY: 0, bounceT: 0,
      react: null, rt: 0, rdur: 0, rmag: 0,
      grabId: 0, pairKey: -1,      // which carry a pairing decision belongs to
      affin: null, lastPoke: '',    // what it tends to answer, and what it last said
      squash: 0, glowAdd: 0, scale: 1,
      vit: 0, age: 0, span: elder ? rnd(260, 480) : rnd(120, 320),
      tail: [], head: 0,
      cool: 0,            // refractory, so one creature cannot chain-fire
      bumped: 0           // has it already knocked on this visit to a planet
    };
    c.born0 = c.size;
    var n = sp.tail;
    for (var i = 0; i < n; i++) c.tail.push({ x: c.x, y: c.y });
    return c;
  }

  function emitSpark(x, y, vx, vy, hue, pw) {
    var s = sparks[sparkHead];
    sparkHead = (sparkHead + 1) % sparks.length;
    var a = Math.random() * TAU, m = 20 + Math.random() * 200 * pw;
    s.x = x; s.y = y;
    s.vx = vx * 0.3 + Math.cos(a) * m;
    s.vy = vy * 0.3 + Math.sin(a) * m;
    s.r = 1.4 + Math.random() * 3.4;
    s.hue = hue + rnd(-28, 28);
    s.max = 0.7 + Math.random() * 1.6;
    s.life = s.max;
  }

  /* ============================================================
     IMPULSES: the propagation model
     ------------------------------------------------------------
     reach and uniformity are rolled fresh for every disturbance,
     independently. That single pair of dials is what makes one
     touch a private joke between two creatures and the next one a
     wave that crosses the whole world with everybody answering in
     the same voice.
     ============================================================ */
  /* Ripples are of a kind, and the kind is legible. Each carries its
     own colour, its own travelling speed, its own instrument and its
     own idea of what the creatures it reaches should do - so a wave
     of delight looks and sounds nothing like a wave of alarm. */
  var RIPPLES = [
    { k: 'calm',     hue: 188, sat: 0.55, speed: [170, 320], reach: [0.14, 0.38], cap: [3, 9],

  /* ============================================================
     WHAT TWO FINGERS MEAN
     ------------------------------------------------------------
     Everyone already knows this gesture, so it should mean the

     together, presses them into one another. Two fingers on the SAME
     creature, pulled apart, tears it into pieces.

     It is judged on the ratio rather than on absolute distance, so it

         holding is the normal state and cand is only the fallback for a finger
         that landed near one without taking it. */

  /* ============================================================
     THE EMBER
     ------------------------------------------------------------
     Every few minutes one of them is different: slower, deep red, and
     it pulses. Hold on to it and it starts to wind up - you can hear
     it and see it - and if you keep holding, it goes, and takes the
     whole room with it. Then everything comes back.

     Two things make this safe to put in front of a child who is here
     to calm down. It cannot happen by accident: it needs a deliberate
     two second hold on one specific rare thing, and letting go at any
     point simply stops it. And the event itself is a SWELL rather than
     a flash - the light grows over most of a second and fades over
     three, and there is no frame anywhere in it that is much brighter
     than the one before. Everything then fades back in one at a time
     over the following ten seconds, so the room refills rather than

  function updateEmber(dt, t) {
    if (t < emberNext) return;

    }

       actively hunting for, so having it reeled in and pinned against a planet is
       wrong twice over - it is hard to find in there, and it is what made the
       knocking so noticeable in the first place. Aloof means never captured and
       never drawn in; it will still bounce if it happens to arrive, because a
       planet is solid for everything. */

  function drawEmber(c, x, y, sz, al, t) {
    /* An ember is the one thing that has to be findable across a room, and the
       one thing that must not shout. Those pull opposite ways, and the first two
       attempts both solved it with BRIGHTNESS - a wide breathing halo, then a
       dimmer wide breathing halo - which is the wrong axis entirely.

       Measured what was actually on screen: a white core at luminance 224 and a
       soft wash still lit at seventy-six pixels, about twice the body. Not a
       breathing ring at all; a small sun. Two reasons, and the second is the
       real one.

       The blobs stacked. Two of them on top of the creature's own glow, and in
       an additive buffer that is three layers of light on the same pixels.

       And it was drawn into the TRAIL, which is never cleared. Alpha there is
       dose times dwell, and an ember barely drifts - so a ring that lingers at
       the far end of its travel, which this one deliberately did, burns a bright
       annulus into the buffer at exactly the radius that is meant to be the
       subtle part. The breathing became invisible because the accumulation of it
       was brighter than the motion of it.

       So the signal is now a change of KIND, not of amount: one crisp thin ring
       on the SCREEN canvas, where nothing accumulates and a one-pixel stroke
       stays a one-pixel stroke. A hard clean edge among a room of soft glows is
       unmistakable at a glance and almost invisible when you are not looking for
       it - which is the whole brief. The colour stays red, because that is the
       other thing nothing else here does. */

       the ring at its outermost, which is both the loudest place for it to be

    var swing = Math.sin(ph * Math.PI);

       everything else does - it just should not be the brightest thing in the

    /* Warm enough to be visibly not of the palette. Cutting the glow fixed the
       loudness and took the identity with it - measured as a small blue creature
       with a faint circle round it, which is not an ember, it is a creature with
       a ring. The heat is the point; it just does not need to be bright. */
    blob(tctx, x, y, sz * (0.66 + f * 0.4), hue, (0.11 + f * 0.22) * al);

  /* A shape, not a brightness.
     ------------------------------------------------------------

     trap as before pointed the other way: at rest it became a creature with a
     faint circle round it, and every creature here is a circle, so the only
     thing distinguishing it was that there happened to be a ring.

     different silhouette, and shape survives being small, dim, half-hidden and

         and seventy across. The mark should be the same size whoever is wearing

      var er = Math.min(e.sz, 30);
      /* TWO thin rings, doing two different jobs.
         A fixed one hugging the body, which is the identity - an ember is the
         only thing here with a hard rim, so it is recognisable even in a still
         frame, at rest, from the far side of a room. And a travelling one just
         outside it, which is the unique motion. Both are single strokes on the
         screen canvas, so together they cost less light than one soft sprite did
         and neither of them can build up. */

      ctx.stroke();

      if (e.f > 0.02) {

  }

           a sad little dot - and it read as damage rather than as effort.

           goes all at once, which is a far better moment than watching

    for (var ga = 0; ga < creatures.length; ga++) {
      var oc2 = creatures[ga];
      if (oc2 !== c && oc2.inOrb === big) used.push(Math.atan2(oc2.y - big.y, oc2.x - big.x));
    }
    if (used.length) {
      used.sort(function (p1, p2) { return p1 - p2; });
      var bestA = c.orbA, bestGap = -1;
      for (var gb = 0; gb < used.length; gb++) {
        var a1 = used[gb], a2 = (gb + 1 < used.length ? used[gb + 1] : used[0] + TAU);
        if (a2 - a1 > bestGap) { bestGap = a2 - a1; bestA = a1 + (a2 - a1) * 0.5; }
      }
      if (bestGap > 0.9) c.orbA = bestA;
    }
    startReaction(c, pick(['flutter', 'sparkle', 'bob']), 0.45, world.hue + c.hueOff, t, null);
  }

  function runOrbit(c, dt, t) {
    var big = c.inOrb;
    if (!big || !big.world || big.vit < 0.2 || c.held || c.hush > 0) { c.inOrb = null; return; }
    var bs = worldR(big);
    /* Outgrown its orbit. A moon is checked for size when it is CAUGHT, but a
       creature keeps living afterwards - it gets poked, it gets fed, half a
       dozen reactions multiply its size - so one can swell past the point where
       it still fits between the rings. It leaves rather than being squeezed,
       which is both the tidier picture and the honest one: it is too big to be
       a moon now.

       Loosely, though. At a fifth above the capture limit this threw moons out
       almost as fast as they arrived - a creature only had to grow a quarter to
       be evicted, and the reactions do that in seconds - and the mean orbiter
       count fell to under one, which is a planet with nothing going round it.
       That is a worse outcome than the occasional shallow overlap this was
       meant to prevent. Only the genuinely oversized leave. */
    if (c.size * LSIZE[c.L] > ORB_GAP * 0.85) {
      c.inOrb = null; c.freeT = 3.5;
      return;
    }
    c.orbTo = clamp(c.orbTo, bs + 40, bs + 48 + ORB_GAP * 2 + 8);
    // ease the radius in, so a capture is a fall rather than a snap
    c.orbR += (c.orbTo - c.orbR) * Math.min(1, dt * 0.9);
    c.orbA += c.orbS * dt;
    var tx = big.x + Math.cos(c.orbA) * c.orbR;
    var ty = big.y + Math.sin(c.orbA) * c.orbR;
    /* Steered, not placed. A spring towards the path keeps the circle legible
       while still letting a ripple or a hand disturb the whole system. */
    var k = 5.2;
    c.vx += (tx - c.x) * k * dt;
    c.vy += (ty - c.y) * k * dt;
    c.vx *= Math.pow(0.90, dt * 60);
    c.vy *= Math.pow(0.90, dt * 60);
    // and it faces the way it is going, which reads as being carried round
    c.spin += (c.orbS * 1.4 - c.spin) * dt * 2;

    // close enough, slow enough, small enough - and it goes in
    /* Being swallowed is now rare on purpose. It used to be the ordinary end of
       an orbit, which meant a planet steadily ate its own system and the screen
       thinned out around it; and since every mouthful knocks the planet about,
       it also made a planet behave like the ball. A long orbit that stays an
       orbit is the better picture, and the occasional one going in is the
       event. */
    /* Keyed on the body actually TOUCHING the planet, not on orbR.
       orbR is bookkeeping - it starts at the distance of capture, far out, and
       eases towards a target that is clamped to 1.3 radii, so once nothing is
       allowed inside the disc any more it can never reach a threshold set below
       that. Measured: nought eligible frames in six hundred, which is to say a
       planet had quietly stopped being able to take anything in at all, and the
       colour shift is its whole reward.

       Contact is the better test anyway. A settled orbit sits outside and stays
       there; joining happens when something is actually driven onto the surface
       - by a hand, a ripple, a soap drop, another creature - which is an event
       somebody caused rather than a number reaching a value. */
    var gd = Math.hypot(c.x - big.x, c.y - big.y);
    if (gd < bs + c.size * LSIZE[c.L] * 0.62 && c.size < big.size * 0.72 && !big.held) {
      if (Math.random() < dt * 0.9) swallow(big, c, t);
    }
  }

  var FREE_KINDS = { startle: 1, mischief: 1, joy: 1 };

  function stirOrbit(c, kindName, amount) {
    if (!c.inOrb || c.freeT > 0) return;
    if (!FREE_KINDS[kindName]) return;
    c.orbE += amount;
  }

  function updateEscape(c, dt, t) {
    if (c.freeT > 0) { c.freeT -= dt; c.inOrb = null; return; }
    if (!c.inOrb) { c.orbE = Math.max(0, c.orbE - dt * 0.10); return; }
    /* And now and then one simply decides. Rarely: at one in eighty a second
       an orbit lasted about a minute and a half and the systems kept falling
       apart on their own, which left no room for a ripple to be the reason
       anything happened. */
    if (Math.random() < dt * 0.0035) c.orbE = 1;
    if (c.orbE < 1) { c.orbE = Math.max(0, c.orbE - dt * 0.045); return; }
    var big = c.inOrb;
    var dx = c.x - big.x, dy = c.y - big.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    c.vx += (dx / d) * 420; c.vy += (dy / d) * 420;
    c.orbE = 0; c.freeT = 7 + Math.random() * 5; c.inOrb = null;
    startReaction(c, 'flutter', 0.9, world.hue + c.hueOff + 40, t, null);
    c.glowAdd = Math.max(c.glowAdd, 0.8);
    for (var i = 0; i < 14; i++) {
      emitSpark(c.x, c.y, (dx / d) * 200, (dy / d) * 200,
                world.hue + c.hueOff + rnd(-40, 40), 0.7);
    }
    if (A.ok && A.started) {
      var b = clamp(Math.round((1 - c.y / Math.max(1, H)) * (NOTES.length - 1)), 0, NOTES.length - 3);
      ambient(function () { chime(noteI(b + 4) * octAt(c.y), 0.022, panOf(c.x), 1, 1.8); });
    }
  }

  /* Taken in. The big one grows by roughly what it swallowed and its colour
     moves towards it, so what a thing has eaten is written on it. */
  /* ============================================================
     THE SURFACE OF A WORLD
     ------------------------------------------------------------
     Soft shading alone made a ball, not a planet. What says planet is
     FEATURES that hold still on the surface while the surface turns -
     landmasses crossing the disc, thinning as they reach the edge,
     going round the back and coming again.

     So each world carries a small list of features at fixed longitude
     and latitude, and every frame they are projected onto the disc:

        lon  turns with the world, so the whole surface moves together
        lat  fixed, so a feature keeps its distance from the equator
        cos(lon)  decides whether it is on this side at all, how much
                  it is squashed towards the limb, and how bright

     That last part is what sells the rotation. A feature that simply
     slid across would read as a texture sliding over a circle; one
     that narrows and dims as it approaches the edge reads as a
     surface curving away, and then you believe the ball is turning.

     It also means the colours a world swallows become real geography:
     a swallowed creature adds a landmass where it came down, so a
     world ends up patterned by its own history.
     ============================================================ */
  /* A continent is three or four overlapping lobes, not a disc. One blob per
     landmass gave every planet a rash of perfect circles; a few lobes at small
     offsets give an irregular edge for almost nothing, and because they share
     one longitude they hold together as a single thing when the world turns. */
  function makeLandMass(lon, lat, hue, k) {
    /* Six or seven lobes of very different sizes, strung along a random
       direction rather than scattered in a blob. Even-sized lobes in a cluster
       read as a bunch of circles, which is exactly what the first version
       looked like; a chain of big-and-small ones reads as a coastline. */
    /* Fewer lobes and bigger ones. At four continents of seven lobes each,
       thirty-odd shapes were landing on a disc a hundred and thirty pixels
       across - about eight pixels a lobe once the sphere squashes them towards
       the limb. Thirty eight-pixel blobs is a texture, not a coastline. Half as
       many at nearly double the size is the same continent with edges you can
       actually see, which is what makes it look like a place. */
    /* What makes a chain of ellipses read as a landmass rather than as a
       handful of circles is OVERLAP. Four big well-spaced lobes are four
       circles, which is what the last attempt produced; six that each sit
       inside their neighbour's edge fuse into one shape with a lumpy coast, and
       the lumps are the coastline. So the run is short relative to the lobe
       size on purpose - they are meant to pile up, not to be laid out. */
    var lobes = [], n = 5 + ((Math.random() * 3) | 0);
    var dir = Math.random() * TAU, run = 0.09 + Math.random() * 0.15;
    for (var i = 0; i < n; i++) {
      var u = (i / (n - 1) - 0.5) * 2;                 // -1 to 1 along the chain
      lobes.push({
        dl: Math.cos(dir) * u * run + rnd(-0.06, 0.06),
        dt: Math.sin(dir) * u * run * 1.5 + rnd(-0.06, 0.06),
        // strongly varied: an even-sized chain is a caterpillar
        s: (0.21 + Math.random() * 0.28) * (1 - Math.abs(u) * 0.28)
      });
    }
    return { lon: lon, lat: lat, hue: hue, k: k,
             size: 0.3, wob: Math.random() * TAU, lobes: lobes };
  }

  function makeLand(c, n, spread) {
    c.land = [];
    for (var i = 0; i < n; i++) {
      c.land.push(makeLandMass(Math.random() * TAU,
                               (Math.random() - 0.5) * (spread || 1.5),
                               rnd(-40, 40), 1));
    }
  }

  /* One feature, projected and drawn. Split out because the body, the clouds
     and the bands all want the same projection with different numbers. */
  function drawFeature(x, y, pr, rot, lx, ly, f, hue, alpha, squash, t) {
    var L = f.lon + rot;
    var cl = Math.cos(L);
    if (cl < -0.12) return;                       // round the back
    var edge = clamp((cl + 0.12) / 0.5, 0, 1);    // fades in over the limb
    var clat = Math.cos(f.lat);
    var fx = x + Math.sin(L) * clat * pr;
    var fy = y + Math.sin(f.lat) * pr * (squash === undefined ? 1 : squash);
    // narrows towards the limb, which is what makes the turn readable
    // and the lit side is brighter, so it has a day and a night
    var face = clamp((Math.sin(L) * clat * lx + Math.sin(f.lat) * ly) * 0.5 + 0.72, 0, 1.3);
    var wob = 1 + Math.sin(t * 0.5 + f.wob) * 0.07;
    var narrow = 0.34 + 0.66 * Math.max(0, cl);   // thins towards the limb
    var a2 = alpha * edge * f.k * face;
    if (!f.lobes) {
      blob(tctx, fx, fy, f.size * pr * narrow * wob, hue + f.hue, a2);
      return;
    }
    for (var i = 0; i < f.lobes.length; i++) {
      var lb = f.lobes[i];
      var L2 = L + lb.dl, cl2 = Math.cos(L2);
      if (cl2 < -0.05) continue;
      var lt = f.lat + lb.dt, clat2 = Math.cos(lt);
      blob(tctx,
           x + Math.sin(L2) * clat2 * pr,
           y + Math.sin(lt) * pr * (squash === undefined ? 1 : squash),
           lb.s * pr * (0.34 + 0.66 * Math.max(0, cl2)) * wob,
           hue + f.hue + i * 7, a2 * 0.85);
    }
  }


  /* ============================================================
     PAINTING A WORLD
     ------------------------------------------------------------
     Everything else in here is drawn as glow into one accumulating buffer in
     lighter mode, which is what gives the whole thing its look - but it is
     also why the first three attempts at a planet failed. In lighter mode a
     continent can only ADD to the sea underneath it, so land was either
     invisible or the whole disc went white. There is no way to paint a dark
     ocean, a solid coastline or a crisp limb with an operator that can only
     brighten.

     So a world is painted somewhere else, on its own small canvas, with
     ordinary source-over compositing where things genuinely cover what is
     behind them. There it can have a real surface: an opaque sea, land that
     hides the sea, cloud over the land, a night side, and a hard edge. Then
     the finished sphere is stamped into the scene as one image.

     It ends up being the only solid object in the app, which is right - it is
     a world, and everything else is light.
     ============================================================ */
  var GLOBE_R = 112;                 // painted once at this size, scaled on use

  function hsl(h, sat, li) {
    return 'hsl(' + (((h % 360) + 360) % 360).toFixed(0) + ',' +
           sat.toFixed(0) + '%,' + li.toFixed(0) + '%)';
  }

  /* Project a longitude/latitude onto the painted disc. Returns null when the
     point is round the far side. The squash towards the limb is what makes the
     rotation readable: a feature that merely slid across would look like a
     texture sliding over a circle. */
  function proj(lon, lat, R) {
    var cl = Math.cos(lon);
    if (cl < -0.06) return null;
    var clat = Math.cos(lat);
    return { x: R + Math.sin(lon) * clat * R,
             y: R + Math.sin(lat) * R,
             n: Math.max(0, cl),
             edge: clamp((cl + 0.06) / 0.4, 0, 1) };
  }

  function paintGlobe(c, t, hue) {
    /* Painted at exactly the size it will be drawn, in device pixels.
       ------------------------------------------------------------
       It used to be painted once at a fixed 112 and scaled on use, which was
       fine while a planet was a hundred and eighty pixels across and is not
       fine now one is a hundred and thirty. Every edge on the surface - the
       coastlines, the band boundaries, the terminator - was being resampled
       down by nearly half on its way to the screen, and resampling is exactly
       what turns detail into haze. It read as a soft ball rather than as a
       planet, and no amount of adding MORE detail would have fixed it, because
       the detail was not the thing that was missing: the crispness was.

       A planet's radius is fixed at birth now, so this can simply be sized to
       match and never resized again. It is also cheaper - a smaller canvas is
       fewer pixels to fill, and this is the most expensive thing in the app. */
    /* At TWICE the drawn size, and let the browser bring it down. Painting at
       exactly the drawn size was right when the disc was a hundred and forty
       pixels across; at fifty, a one-to-one canvas means every coastline and
       every band edge is a hard jagged step, because there are no spare pixels
       to put the edge between. Rendering large and shrinking is the oldest
       trick for that - it is just supersampling, and the shrink is where the
       smoothing happens. Four times the fill of a small canvas is still a
       quarter of what the old fixed 112 cost. */
    var R = Math.max(48, Math.round(worldR(c) * DPR * 2));
    /* Repainted every other frame. The surface turns once in twenty seconds,
       so half the frame rate on it is not perceptible, and this is the most
       expensive thing in the app - a few hundred fills per world. Three worlds
       at thirty repaints a second instead of sixty buys back most of it. */
    c.gtick = (c.gtick || 0) + 1;
    if (c.gcv && (c.gtick & 1) === 0) return c.gcv;
    /* Owns its own data. A creature can become a world by more than one route -
       forged by hand, or grown by swallowing enough - and relying on each
       caller to have seeded the surface first meant one of them did not. */
    if (!c.land) makeLand(c, c.ptype === 3 ? 11 : (c.ptype === 1 ? 2 : 4),
                          c.ptype === 3 ? 0.55 : 1.5);
    if (!c.cloud) {
      c.cloud = [];
      // three, not five. Twenty-five faint streaks on a small disc is fog.
      for (var qc = 0; qc < 3; qc++) {
        c.cloud.push({ lon: Math.random() * TAU, lat: (Math.random() - 0.5) * 1.7,
                       size: 0.38 + Math.random() * 0.3, hue: 0,
                       wob: Math.random() * TAU, k: 1 });
      }
    }
    if (!c.spinBase) {
      c.spinBase = (Math.random() < 0.5 ? -1 : 1) * TAU / rnd(19, 27);
      c.spin = c.spinBase;
    }
    if (!c.gcv || c.gR !== R) {
      c.gcv = c.gcv || document.createElement('canvas');
      c.gcv.width = R * 2; c.gcv.height = R * 2;
      c.gctx = c.gcv.getContext('2d');
      c.gR = R;
    }
    var g = c.gctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.clearRect(0, 0, R * 2, R * 2);

    var lit = t * 0.05 + c.phase;
    var lx = Math.cos(lit), ly = Math.sin(lit);
    var rot = c.rot;
    var i, q, pt;

    g.save();
    g.beginPath();
    g.arc(R, R, R - 1, 0, TAU);
    g.clip();                          // everything below gets a hard edge

    // ---- the sea, deeper away from the light -------------------------------
    /* Painted DARK on purpose. This canvas is stamped into a buffer that then
       gets a bloom pass over it, so anything that looks right here comes out a
       stop or two brighter on screen. The first version was balanced by eye in
       isolation and arrived as a pale green ball with no contrast left in it. */
    var sea = g.createRadialGradient(R + lx * R * 0.4, R + ly * R * 0.4, R * 0.1,
                                     R, R, R * 1.25);
    /* Lifted back up now the planet is drawn above the trail instead of under
       it. Painting this dark was the right answer while the whole glow of the
       room was being added on top; with that gone it just looked like a hole. */
    sea.addColorStop(0, hsl(hue + 10, 76, 34));
    sea.addColorStop(0.55, hsl(hue, 82, 22));
    sea.addColorStop(1, hsl(hue - 14, 74, 10));
    g.fillStyle = sea;
    g.fillRect(0, 0, R * 2, R * 2);

    if (c.ptype === 1 || c.ptype === 2) {
      /* A gas giant. Latitude bands, each drifting at its own rate, which is
         the thing that makes Jupiter look like Jupiter rather than a striped
         ball. Drawn as horizontal strips whose ends are hidden by the clip. */
      /* Bands as flattened ellipses on their own latitude, not as rectangles.
         A rectangle clipped to the circle has square ends and reads as a
         printed stripe; an ellipse whose width is cos(lat) tapers exactly the
         way a band on a sphere does, and that is what makes it look wrapped
         round something rather than painted across it. */
      for (i = -4; i <= 4; i++) {
        var blat = i * 0.23;
        var by = R + Math.sin(blat) * R;
        var bw = Math.cos(blat) * R;
        var bh = Math.abs(Math.sin(blat + 0.14) - Math.sin(blat)) * R + R * 0.03;
        var odd = (i & 1) !== 0;
        g.fillStyle = odd ? hsl(hue + 24, 58, 46) : hsl(hue - 16, 64, 28);
        g.globalAlpha = 0.92;
        g.beginPath();
        g.ellipse(R, by, bw, bh, 0, 0, TAU);
        g.fill();
      }
      g.globalAlpha = 1;
      // the swirl inside each band, so the bands are not flat ribbons
      for (i = -4; i <= 4; i++) {
        var slat = i * 0.23;
        for (q = 0; q < 9; q++) {
          var slon = (q / 9) * TAU + rot * (1 + i * 0.12) + i;
          pt = proj(slon, slat, R);
          if (!pt) continue;
          g.globalAlpha = 0.25 * pt.edge;
          g.fillStyle = (i & 1) ? hsl(hue + 40, 60, 54) : hsl(hue - 26, 55, 20);
          g.beginPath();
          g.ellipse(pt.x, pt.y, R * 0.2 * pt.n, R * 0.055, 0, 0, TAU);
          g.fill();
        }
      }
      g.globalAlpha = 1;
      // one long-lived storm to give the eye somewhere to land
      pt = proj(0.6 + rot * 0.9, -0.34, R);
      if (pt) {
        g.globalAlpha = 0.7 * pt.edge;
        g.fillStyle = hsl(hue + 66, 70, 52);
        g.beginPath();
        g.ellipse(pt.x, pt.y, R * 0.19 * pt.n, R * 0.1, 0, 0, TAU);
        g.fill();
        g.globalAlpha = 1;
      }
    } else {
      // ---- land: opaque, and it covers the sea ----------------------------
      for (i = 0; i < c.land.length; i++) {
        var f = c.land[i];
        f.k = Math.min(1, f.k + 0.02);
        /* A third of the way round the wheel from the sea, and a good deal
           lighter. Both matter: on hue alone the two came out as mud on mud at
           some palette positions, and on lightness alone the land looked like
           a lit patch of sea rather than a different substance. */
        var lh = hue + 128 + f.hue * 0.5;
        if (!f.lobes) f.lobes = makeLandMass(0, 0, 0, 1).lobes;
        for (q = 0; q < f.lobes.length; q++) {
          var lb = f.lobes[q];
          pt = proj(f.lon + rot + lb.dl, f.lat + lb.dt, R);
          if (!pt) continue;
          /* Fully opaque. Translucent land cannot cover the sea, and land that
             does not cover the sea is not land - it is a tint. The only thing
             that softens it is pt.edge, so a continent slides over the limb
             instead of being clipped off at it. */
          g.globalAlpha = f.k * pt.edge;
          g.fillStyle = hsl(lh, 62, 50);   // it has fifty pixels to be a continent in
          g.beginPath();
          g.ellipse(pt.x, pt.y, lb.s * R * pt.n, lb.s * R, 0, 0, TAU);
          g.fill();
        }
      }
      /* Highlands: a second, smaller pass inside the land, brighter, so a
         continent has some interior instead of being one flat shape. */
      for (i = 0; i < c.land.length; i++) {
        var f2 = c.land[i];
        var lh2 = hue + 134 + f2.hue * 0.5;
        /* Only the biggest lobe of each mass, and well inside it. One bright
           patch per continent reads as terrain; one per lobe drew a second set
           of circles directly on top of the first, which is most of why the
           land looked like stacked coins. */
        var big2 = null;
        for (q = 0; q < f2.lobes.length; q++)
