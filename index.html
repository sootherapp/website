     the same rule into something continuous that you can slide along, and the
     pitch snaps to the same anhemitonic pentatonic as everything else, so it
     steps between good notes rather than gliding through bad ones. It cannot
     be played out of tune.

     A third finger crossing the line plucks it. So does a creature drifting
     through it, which is the part worth having: the string is an OBJECT lying
     in the world, not a control drawn over the top of it, and if you hold one
     still for long enough the room comes and plays it for you.

     Two fingers on open space were doing nothing before this. The pinch
     gesture needs a creature under each finger, so there is no collision -
     hands on creatures pinch, hands on water make a string.
     ============================================================ */
  /* ============================================================
     PLACED, OR PASSING THROUGH
     ------------------------------------------------------------
     Everything below hangs off one distinction, and it is a physical one
     rather than a mode: a finger that is PUT DOWN AND LEFT is an anchor, and a
     finger that is travelling is not.

     There used to be a global mode instead - two fingers meant a bridge,
     three meant an ensemble, settled at the start of the gesture and locked so
     it could not change under you. It worked, but it made the wrong thing
     atomic. In a museum, hands arrive and leave one at a time and they are not
     the same person's hands. A mode decided by the first two fingers cannot
     describe a table where one child is holding three notes and another is
     dragging a hand across them.

     Per finger, it needs no locking at all, because a finger cannot be in two
     states at once: hold still and you are part of the instrument, sweep and
     you are playing it. That is also exactly the difference a child performs
     without being told.
     ============================================================ */
  var ANCHOR_DWELL = 0.15;    // still for this long
  var ANCHOR_SLOP = 34;       // and it has not wandered more than this
  /* ...and then it is an anchor until it leaves the glass. There is no speed
     at which it stops being one.

     There used to be: over about 470 pixels a second a finger was taken to
     have set off, dropped out of the web and could not rejoin. It reads
     sensibly and it is wrong, and it is wrong in exactly the way this file has
     been wrong twice before - whether something may START and whether it may
     CONTINUE are different questions, and answering the second with the test
     for the first is what tore the two-finger bridge apart when a creature
     drifted under a hand. Measured here: four fingers placed, then carried
     about at a gentle two hundred pixels a second, and the web was down to one
     anchor and no threads inside four seconds, with every finger still on the
     glass.

     A finger that never settled is a sweep for its whole life and can strum. A
     finger that did settle is holding the instrument, and moving your hands is
     how you play it, not how you drop it. */

  var ANCH = [], SWIPERS = [], PTR_LIST = [];

  /* Each finger carries its own colour for as long as it is down, and the
     colours are spread far apart round the wheel so that in a museum three
     children can each see which of the lights is theirs. */
  var HUE_SEQ = 0;
  function fingerHue(p) {
    if (p.mhue === undefined || p.mhue === null) {
      HUE_SEQ = (HUE_SEQ + 97) % 360;
      p.mhue = world.hue + 30 + HUE_SEQ;
    }
    return p.mhue;
  }

  function updateAnchors(list, dt, t) {
    ANCH.length = 0; SWIPERS.length = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p.down) { p.anchor = false; p.anchorDead = false; continue; }
      if (!p.anchor && !p.anchorDead) {
        if (p.path > ANCHOR_SLOP) p.anchorDead = true;          // it never stopped
        else if (t - p.downAt >= ANCHOR_DWELL) p.anchor = true; // it did
      }
      if (p.anchor) { fingerHue(p); ANCH.push(p); }
      else if (p.down) SWIPERS.push(p);
    }
  }

  /* ============================================================
     THE WEB
     ------------------------------------------------------------
     Every anchor is joined to its neighbours by a thread, and the threads sing
     one note between them: how far apart your hands are is the pitch, wide and
     low, close and high, snapped to the same pentatonic as everything else so
     it cannot be played wrong.

     Two anchors is one thread and nothing else. Three or more and the beat
     starts (see THE BEAT below) and the threads become the frame it plays in.

     Threads are THIN by default and they thicken when you strum them - drag a
     finger across and every thread it crosses flares and settles back within
     half a second. That is the only feedback a strum needs, and it is why a
     creature drifting through does not do it: a creature crossing sounds the
     note, because the web is an object lying in the world, but the flare
     belongs to the person who did it.

     One oscillator for the whole web however many hands are on it. Five
     threads meaning five sustained voices is five times the load on a tablet
     that already drops notes, and it would beat against itself rather than
     ring. */
  var WEB = {
    on: false, k: 0, amp: 0.10, phase: 0, deg: 5, f: 220, mode: 1, hue: 0,
    threads: [], beads: [], thick: {}, v: null, pluckCool: 0, beadNext: 0, sig: ''
  };

  var BEAD_KINDS = ['runner', 'dawdler', 'wobbler', 'splitter'];

  function webFree() {
    if (!WEB.v) return;
    var v = WEB.v; WEB.v = null;
    try {
      var nt = A.ctx.currentTime;
      v.g.gain.cancelScheduledValues(nt);
      v.g.gain.setValueAtTime(Math.max(0.0001, v.g.gain.value), nt);
      v.g.gain.setTargetAtTime(0.0001, nt, 0.12);
      v.o.stop(nt + 0.9);
      v.o.onended = function () {
        try { v.o.disconnect(); v.lp.disconnect(); v.g.disconnect();
              if (v.pn) v.pn.disconnect(); } catch (e) {}
      };
    } catch (e) {}
  }

  function webEnd() {
    WEB.on = false;
    WEB.threads.length = 0;
    WEB.beads.length = 0;
    WEB.sig = '';
    for (var i = 0; i < creatures.length; i++) creatures[i].wSide = null;
    webFree();
  }

  function webPluck(x, y, hue, hard) {
    WEB.amp = Math.min(1, WEB.amp + (hard ? 0.55 : 0.28));
    burstRing(x, y, hue + rnd(-20, 20), hard ? 8 : 4, hard ? 340 : 200, 0.45);
    if (WEB.pluckCool > 0 || !A.ok || !A.started) return;
    WEB.pluckCool = 0.07;
    var f = WEB.f, pan = panOf(x);
    if (hard) mine(function () { pluck(f * 2, 0.042, pan); });
    else ambient(function () { pluck(f * 2, 0.020, pan); });
  }

  /* The threads are the ring round the outside of the hands, in the order they
     sit round their own centre. A ring rather than every pair: four anchors
     joined every-which-way is six lines through the middle and reads as a
     scribble, where the ring reads as one shape everybody is standing on. It
     also means each hand has exactly two threads whoever else joins. */
  function rebuildThreads() {
    var n = ANCH.length, i;
    var sig = '';
    for (i = 0; i < n; i++) sig += ANCH[i].id + ',';
    if (sig === WEB.sig) return false;
    WEB.sig = sig;
    WEB.threads.length = 0;
    WEB.beads.length = 0;
    for (i = 0; i < creatures.length; i++) creatures[i].wSide = null;
    if (n < 2) return true;
    if (n === 2) {
      WEB.threads.push({ a: ANCH[0], b: ANCH[1] });
      return true;
    }
    var cx = 0, cy = 0;
    for (i = 0; i < n; i++) { cx += ANCH[i].x; cy += ANCH[i].y; }
    cx /= n; cy /= n;
    var ring = ANCH.slice(0);
    ring.sort(function (p1, p2) {
      return Math.atan2(p1.y - cy, p1.x - cx) - Math.atan2(p2.y - cy, p2.x - cx);
    });
    for (i = 0; i < n; i++) WEB.threads.push({ a: ring[i], b: ring[(i + 1) % n] });
    return true;
  }

  function threadKey(th) {
    return th.a.id < th.b.id ? th.a.id + '_' + th.b.id : th.b.id + '_' + th.a.id;
  }

  /* Did something cross this thread since last frame? One sign test on the
     side of the line, plus where along it, which is all a crossing is. */
  function crossedThread(th, x, y, prev, band) {
    var ex = th.b.x - th.a.x, ey = th.b.y - th.a.y;
    var dd = ex * ex + ey * ey;
    if (dd < 1) return 0;
    var cr = (x - th.a.x) * ey - (y - th.a.y) * ex;
    var uu = ((x - th.a.x) * ex + (y - th.a.y) * ey) / dd;
    var side = cr > 0 ? 1 : -1;
    if (uu < 0.04 || uu > 0.96 || Math.abs(cr) / Math.sqrt(dd) > band) return 0;
    if (prev && prev !== side) return side;
    return prev ? 0 : side;      // first sight: remember which side, do not fire
  }

  function updateWeb(list, dt, t) {
    WEB.pluckCool -= dt;
    var i, j, th, key;

    rebuildThreads();
    var live = ANCH.length >= 2 && WEB.threads.length > 0;
    WEB.on = live;
    WEB.k = live ? Math.min(1, WEB.k + dt * 3.4) : Math.max(0, WEB.k - dt * 2.6);

    // the flare a strum leaves, decaying fast enough to read as a flick
    for (key in WEB.thick) {
      if (!WEB.thick.hasOwnProperty(key)) continue;
      WEB.thick[key] *= Math.pow(0.012, dt);
      if (WEB.thick[key] < 0.01) delete WEB.thick[key];
    }

    if (!live) {
      if (WEB.k <= 0.001) { if (WEB.v) webFree(); WEB.beads.length = 0; }
      return;
    }

    /* Pitch from the average span of the web, so opening your hands out lowers
       it exactly as it did when there were only two of them. */
    var total = 0;
    for (i = 0; i < WEB.threads.length; i++) {
      th = WEB.threads[i];
      total += Math.hypot(th.b.x - th.a.x, th.b.y - th.a.y);
    }
    var mean = total / WEB.threads.length;
    var cx = 0, cy = 0;
    for (i = 0; i < ANCH.length; i++) { cx += ANCH[i].x; cy += ANCH[i].y; }
    cx /= ANCH.length; cy /= ANCH.length;

    var u = clamp((mean - 78) / Math.max(160, DIAG * 0.72), 0, 1);
    WEB.deg = clamp(Math.round((1 - u) * 9), 0, NOTES.length - 1);
    WEB.f = noteI(WEB.deg) * octAt(cy);
    WEB.mode = 1 + (WEB.deg > 6 ? 2 : (WEB.deg > 3 ? 1 : 0));
    WEB.hue = world.hue + 30 + WEB.deg * 12;

    // a strum: a travelling finger through a thread, and it leaves a mark
    for (i = 0; i < SWIPERS.length; i++) {
      var sp = SWIPERS[i];
      if (!sp.wSide) sp.wSide = {};
      for (j = 0; j < WEB.threads.length; j++) {
        th = WEB.threads[j]; key = threadKey(th);
        var hit = crossedThread(th, sp.x, sp.y, sp.wSide[key], 90);
        if (hit && sp.wSide[key]) {
          var ex2 = th.b.x - th.a.x, ey2 = th.b.y - th.a.y;
          var dd2 = ex2 * ex2 + ey2 * ey2;
          var uu2 = ((sp.x - th.a.x) * ex2 + (sp.y - th.a.y) * ey2) / dd2;
          WEB.thick[key] = 1;
          webPluck(th.a.x + ex2 * uu2, th.a.y + ey2 * uu2, fingerHue(sp), true);
          beadBurst(j, uu2, fingerHue(sp));
        }
        if (hit) sp.wSide[key] = hit;
      }
    }
    // and whatever drifts through on its own, which sounds but does not flare
    for (i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.vit < 0.3) { c.wSide = null; continue; }
      if (!c.wSide) c.wSide = {};
      for (j = 0; j < WEB.threads.length; j++) {
        th = WEB.threads[j]; key = threadKey(th);
        var chit = crossedThread(th, c.x, c.y, c.wSide[key], 26);
        if (chit && c.wSide[key]) {
          webPluck(c.x, c.y, world.hue + c.hueOff, false);
          c.glowAdd = Math.max(c.glowAdd, 0.5);
        }
        if (chit) c.wSide[key] = chit;
      }
    }

    WEB.amp = Math.max(0.10, WEB.amp * Math.pow(0.976, dt * 60));
    WEB.phase += dt * (5 + WEB.deg * 1.3);
    updateBeads(dt);

    // and the web drags the water with it as it is carried about
    var msp = 0;
    for (i = 0; i < ANCH.length; i++) msp += Math.hypot(ANCH[i].vx, ANCH[i].vy);
    msp /= ANCH.length;
    if (msp > 90) addStir(cx, cy, 0.05 * clamp(msp / 800, 0.2, 1) * WEB.k, 0.28, 'web');

    if (!A.ok || !A.started) return;
    var ac = A.ctx, nt = ac.currentTime;
    if (!WEB.v) {
      try {
        var o = ac.createOscillator(); o.type = 'triangle';
        var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.2;
        var g = ac.createGain(); g.gain.value = 0.0001;
        var pn = ac.createStereoPanner ? ac.createStereoPanner() : null;
        o.connect(lp); lp.connect(g);
        if (pn) { g.connect(pn); pn.connect(A.bus); } else { g.connect(A.bus); }
        o.start(nt);
        WEB.v = { o: o, lp: lp, g: g, pn: pn };
      } catch (e) { WEB.v = null; return; }
    }
    WEB.v.o.frequency.setTargetAtTime(WEB.f, nt, 0.045);
    WEB.v.lp.frequency.setTargetAtTime(420 + WEB.f * 2.6 + WEB.amp * 900, nt, 0.09);
    WEB.v.g.gain.setTargetAtTime(WEB.k * (0.026 + WEB.amp * 0.030), nt, 0.10);
    if (WEB.v.pn) WEB.v.pn.pan.setTargetAtTime(panOf(cx) * 0.6, nt, 0.12);
  }

  /* ---- the beads ----
     Lights running along the threads, and each one is a different colour and
     has a mind of its own. They are the thing to watch when it is not your
     note's turn: a runner just goes, a dawdler stalls in the middle and then
     bolts, a wobbler weaves as it travels, and a splitter reaches the middle
     and becomes two going opposite ways. */
  var BEAD_HUES = [0, 32, 58, 96, 150, 190, 214, 268, 300, 330];

  function addBead(ti, u, dir, hue, kind) {
    if (WEB.beads.length > 22) return;
    WEB.beads.push({
      ti: ti, u: u, sp: dir * (0.40 + WEB.deg * 0.05) * rnd(0.8, 1.3),
      hue: hue === undefined ? world.hue + pick(BEAD_HUES) : hue,
      kind: kind || pick(BEAD_KINDS),
      r: rnd(4.5, 8), age: 0, wob: rnd(0, TAU), stall: 0, split: false
    });
  }

  function beadBurst(ti, u, hue) {
    addBead(ti, u, 1, hue, 'runner');
    addBead(ti, u, -1, hue, 'runner');
  }

  function updateBeads(dt) {
    WEB.beadNext -= dt;
    if (WEB.beadNext <= 0 && WEB.threads.length) {
      WEB.beadNext = rnd(0.30, 0.85) / Math.max(1, WEB.threads.length * 0.5);
      var ti = (Math.random() * WEB.threads.length) | 0;
      var fromA = Math.random() < 0.5;
      addBead(ti, fromA ? 0 : 1, fromA ? 1 : -1);
    }
    for (var i = WEB.beads.length - 1; i >= 0; i--) {
      var bd = WEB.beads[i];
      bd.age += dt;
      if (bd.ti >= WEB.threads.length) { WEB.beads.splice(i, 1); continue; }
      if (bd.kind === 'dawdler') {
        var near = Math.abs(bd.u - 0.5) < 0.06;
        if (near && bd.stall < 0.45) { bd.stall += dt; continue; }   // holding its breath
        bd.u += bd.sp * dt * (bd.stall > 0 ? 2.6 : 1);               // then bolting
      } else if (bd.kind === 'splitter') {
        if (!bd.split && ((bd.sp > 0 && bd.u >= 0.5) || (bd.sp < 0 && bd.u <= 0.5))) {
          bd.split = true;
          addBead(bd.ti, 0.5, bd.sp > 0 ? -1 : 1, bd.hue + 40, 'runner');
        }
        bd.u += bd.sp * dt;
      } else {
        if (bd.kind === 'wobbler') bd.wob += dt * 9;
        bd.u += bd.sp * dt;
      }
      if (bd.u < -0.06 || bd.u > 1.06) WEB.beads.splice(i, 1);
    }
  }

  /* Drawn on the SCREEN canvas, every frame, from nothing. A held web barely
     moves, and the trail buffer is never cleared - only veiled - so anything
     drawn repeatedly at a spot that does not move burns a hole there. That is
     the fourth time that buffer has caught something out in this file. */
  function drawWeb(awake) {
    if (WEB.k <= 0.004 || !WEB.threads.length) return;
    var lit = (0.45 + awake * 0.55) * WEB.k;
    var i, j, u2, off;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    for (i = 0; i < WEB.threads.length; i++) {
      var th = WEB.threads[i];
      var key = threadKey(th);
      var flare = WEB.thick[key] || 0;
      var ex = th.b.x - th.a.x, ey = th.b.y - th.a.y;
      var d = Math.hypot(ex, ey) || 1;
      var nx = -ey / d, ny = ex / d;
      var swing = (WEB.amp * 0.5 + flare * 0.9) * Math.min(d * 0.14, 54) *
                  Math.sin(WEB.phase * 6.0 + i);
      var hue = norm360(WEB.hue + i * 9).toFixed(0);
      /* Thin unless struck. The default is a wire you can see past; a strum
         takes it to four times that within a frame and it settles back on its
         own, which is the whole of the feedback. */
      var WIDE = [7 + flare * 22, 2.4 + flare * 7, 1.1 + flare * 2.6];
      var ALPH = [(0.05 + flare * 0.18), (0.11 + flare * 0.34), (0.42 + flare * 0.55)];
      var LIGHT = ['52%', '64%', '82%'];
      /* The broad halo is only painted on a thread that has just been struck.
         Five threads at three wide additive strokes each measured 1.6ms a
         frame, and on the thin default that widest pass is barely visible
         anyway - it is there to make a strum bloom, so it is drawn when there
         is a strum to bloom. */
      var first = (flare > 0.02 || WEB.threads.length <= 2) ? 0 : 1;
      for (var pass = first; pass < 3; pass++) {
        ctx.beginPath();
        for (j = 0; j <= 24; j++) {
          u2 = j / 24;
          off = Math.sin(Math.PI * u2 * WEB.mode) * swing;
          var px2 = (th.a.x + ex * u2 + nx * off) * DPR;
          var py2 = (th.a.y + ey * u2 + ny * off) * DPR;
          if (j) ctx.lineTo(px2, py2); else ctx.moveTo(px2, py2);
        }
        ctx.lineWidth = WIDE[pass] * DPR;
        ctx.strokeStyle = 'hsla(' + hue + ',94%,' + LIGHT[pass] + ',' +
                          (ALPH[pass] * lit).toFixed(3) + ')';
        ctx.stroke();
      }
    }

    // the beads, riding whichever thread they belong to
    for (i = 0; i < WEB.beads.length; i++) {
      var bd = WEB.beads[i];
      var th2 = WEB.threads[bd.ti];
      if (!th2) continue;
      var ex2 = th2.b.x - th2.a.x, ey2 = th2.b.y - th2.a.y;
      var d2 = Math.hypot(ex2, ey2) || 1;
      var nx2 = -ey2 / d2, ny2 = ex2 / d2;
      var bu = clamp(bd.u, 0, 1);
      var sw2 = (WEB.amp * 0.5) * Math.min(d2 * 0.14, 54) *
                Math.sin(Math.PI * bu * WEB.mode) * Math.sin(WEB.phase * 6.0 + bd.ti);
      var wob = bd.kind === 'wobbler' ? Math.sin(bd.wob) * 13 : 0;
      var bx = th2.a.x + ex2 * bu + nx2 * (sw2 + wob);
      var by = th2.a.y + ey2 * bu + ny2 * (sw2 + wob);
      var bh = norm360(bd.hue).toFixed(0);
      var swell = bd.kind === 'dawdler' && bd.stall > 0 && bd.stall < 0.45
                ? 1 + bd.stall * 2.4 : 1;
      ctx.beginPath();
      ctx.arc(bx * DPR, by * DPR, bd.r * 2.6 * swell * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + bh + ',96%,58%,' + (0.16 * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(bx * DPR, by * DPR, bd.r * swell * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + bh + ',98%,80%,' + (0.85 * lit).toFixed(3) + ')';
      ctx.fill();
      blob(tctx, bx, by, 2.4, bd.hue + 20, 0.06 * lit);
    }

    // and a knot of light where each hand is holding on
    for (i = 0; i < ANCH.length; i++) {
      var e2 = ANCH[i];
      var eh = norm360(fingerHue(e2)).toFixed(0);
      ctx.beginPath();
      ctx.arc(e2.x * DPR, e2.y * DPR, (13 + WEB.amp * 9) * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + eh + ',94%,58%,' + (0.15 * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e2.x * DPR, e2.y * DPR, (5 + WEB.amp * 5) * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + eh + ',96%,80%,' + (0.62 * lit).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     THE ENSEMBLE
     ------------------------------------------------------------
     Three fingers or more and the screen starts playing a beat out of the
     places you are touching. Every finger is a note - the same note that spot
     has always been - and a rhythm wanders round them: sometimes quick,
     sometimes slow, sometimes striking one twice before it moves on, sometimes
     leaving a gap. It never repeats and it never stops while you are there.

     It is built for three children at a museum table. Each finger keeps its
     own colour, so you can see which light is yours, and you get two things to
     wait for rather than one: your note coming round again, and the LEAP - a
     ribbon of light that jumps out of one finger, arcs over the field and
     lands on another, sounding it when it arrives. Which one goes and where it
     lands is never the same twice, so the interesting part is not performing
     anything, it is watching to see who is next.

     Nobody is playing better than anybody else. Every note is in the same
     pentatonic, the beat is the app's, and holding still is a perfectly good
     way to take part - your note keeps coming round whether you move or not.
     ============================================================ */
  var ENS = {
    on: false, k: 0, step: 0.22, next: 0,
    motif: null, pos: 0, reps: 0, noteCool: 0, arcs: [], hits: []
  };
  var BAR = 8;
  var ARC_MAX = 5;

  /* WHAT THE NOTES ARE.
     ------------------------------------------------------------
     Each finger keeps the note of the place it is on - that rule is older than
     this and it is not up for negotiation, because it is how a child works out
     that where they put their hand is what they hear. But four fingers dropped
     anywhere on the glass can easily land on four neighbouring degrees in one
     octave, and a pentatonic cluster inside a fifth is a smudge however
     consonant it is.

     So the degree is left exactly where the finger put it and only the OCTAVE
     is tidied: run through them from low to high and any note sitting on top
     of the one below is lifted an octave clear. Nobody's note changes which
     note it is, and the set comes out as a spread chord instead of a pile. */
  function voiceAnchors(downs) {
    var v = [], i;
    for (i = 0; i < downs.length; i++) {
      v.push({ p: downs[i], f: noteI(noteIdxAt(downs[i].x)) * octAt(downs[i].y) });
    }
    v.sort(function (m, n) { return m.f - n.f; });
    /* Lifted clear, but never into a squeak. The ceiling was 2400 and three
       fingers landing close together climbed all the way to it; a note that
       high stops sounding like a voice in the chord and starts sounding like
       a fault. Above the ceiling a doubled note is simply allowed to stand,
       which in a pentatonic is a unison and perfectly pleasant. */
    for (i = 1; i < v.length; i++) {
      while (v[i].f < v[i - 1].f * 1.06 && v[i].f * 2 < 1600) v[i].f *= 2;
    }
    for (i = 0; i < v.length; i++) v[i].p.beatF = v[i].f;
    return v;         // ascending, so v[0] is the bass
  }

  /* A BAR, not a sprinkle.
     ------------------------------------------------------------
     The first version put a note down whenever a drifting probability said so,
     which is a scatter: there is no beat one, so there is nothing to feel
     coming, and nothing ever comes back. Music that sounds composed and is
     still never the same twice needs three things, and none of them are extra
     randomness.

     A BAR, so there is a downbeat to lean on. Eight steps, and the first of
     them nearly always sounds.

     A MOTIF, so it repeats. A figure is chosen once and played several times
     over, mutating a step or two each time round, before a new one is chosen.
     That single change is most of the difference between a tune and a shuffle,
     and it costs one array.

     A BASS. The downbeat belongs to the lowest note on the table, every bar,
     so however many hands arrive there is always something holding the floor. */
  function newMotif(n) {
    var m = [], s2, i;
    /* Fuller with more hands on it. At a fixed density five children shared
       out the same four notes a bar that three did, and measured over ten
       seconds one of the five was never played at all - which in a room where
       each finger belongs to a different child is the one unforgivable
       outcome. */
    var density = clamp(0.30 + n * 0.07, 0.30, 0.72);
    for (s2 = 0; s2 < BAR; s2++) {
      var strong = (s2 === 0), half = (s2 === 4);
      var hit = strong ? true : (half ? Math.random() < 0.80 : Math.random() < density);
      m.push(hit ? { i: 0, acc: strong ? 1 : (half ? 0.85 : (s2 & 1 ? 0.55 : 0.72)),
                     bass: strong } : null);
    }
    /* And the notes are DEALT rather than drawn. Picking each step's finger at
       random independently means a bar can land on the same hand three times
       and skip two others; dealing from a shuffled pack means everybody is
       played once before anybody is played twice. Same unpredictability, no
       starving. */
    var pack = [];
    for (i = 0; i < n; i++) pack.push(i);
    for (i = pack.length - 1; i > 0; i--) {
      var j = (Math.random() * (i + 1)) | 0, sw = pack[i]; pack[i] = pack[j]; pack[j] = sw;
    }
    var deal = 0;
    for (s2 = 0; s2 < BAR; s2++) {
      if (!m[s2] || m[s2].bass) continue;
      m[s2].i = pack[deal % pack.length];
      deal++;
      if (deal % pack.length === 0) {
        for (i = pack.length - 1; i > 0; i--) {
          var j2 = (Math.random() * (i + 1)) | 0, s3 = pack[i]; pack[i] = pack[j2]; pack[j2] = s3;
        }
      }
    }
    return m;
  }

  function mutateMotif(m, n, downs, t) {
    var k = 1 + ((Math.random() * 2) | 0);
    while (k--) {
      var s2 = 1 + ((Math.random() * (BAR - 1)) | 0);      // never the downbeat
      if (m[s2] && Math.random() < 0.40) { m[s2] = null; continue; }
      // a new note goes to whoever has been waiting longest for one
      var pickI = 0, oldest = -1;
      for (var i = 0; i < n; i++) {
        var age = t - ((downs[i] && downs[i].hitAt) || 0) + Math.random() * 0.6;
        if (age > oldest) { oldest = age; pickI = i; }
      }
      m[s2] = { i: pickI, acc: s2 === 4 ? 0.85 : (s2 & 1 ? 0.55 : 0.72), bass: false };
    }
  }

  function ensNote(p, t, vel) {
    var hue = fingerHue(p);
    p.hitAt = t; p.hitK = 1;
    /* NOT into the trail buffer. This is the third time that buffer has caught
       something out and it is always the same shape of mistake: it is never
       cleared, only veiled, so anything drawn repeatedly at a spot that does
       not move burns a hole there. A finger resting on the glass is the most
       stationary thing in the app, and a bloom painted at it on every hit
       turned each child's note into a white scar within seconds - the planet
       halo and the ember ring, again.

       So the bloom is drawn on the screen canvas, fresh every frame, out of
       ENS.hits below.

       The sparks may go into the trail because they travel - but only just.
       Measured over fifteen seconds of four fingers held still, nine slow
       sparks a hit took the trail buffer from 24 to 51, because "it moves" is
       not enough when thirty of them a second all set out from the same four
       places. Fewer, faster and shorter-lived, so each one is out of the
       neighbourhood before the next arrives. */
    burstRing(p.x, p.y, hue, 4, 520, 0.45);
    // one stir slot per finger, not one per note, so holding still for a
    // minute does not pour a minute of energy into the water at one spot
    addStir(p.x, p.y, 0.035 * (Math.random() < 0.5 ? -1 : 1), 0.20, 'ens' + p.id);
    ENS.hits.push({ x: p.x, y: p.y, hue: hue, t: 0, life: 0.85 });
    if (ENS.hits.length > 14) ENS.hits.shift();
    if (ENS.noteCool > 0 || !A.ok || !A.started) return;
    ENS.noteCool = 0.10;
    var f = p.beatF || (noteI(noteIdxAt(p.x)) * octAt(p.y));
    var pan = panOf(p.x);
    /* Longer and rounder underneath, shorter and brighter on top, which is
       what stops a chord of held notes turning into a drone: the bass rings
       through the bar and the upper voices get out of its way. */
    var low = f < 200;
    var dur = low ? 3.4 : 1.6 + Math.random() * 0.9;
    var lvl = (low ? 0.036 : 0.026) * vel;
    mine(function () { chime(f, lvl, pan, low ? 0.55 : 1.05, dur); });
  }

  function ensLeap(from, to, t) {
    if (ENS.arcs.length >= ARC_MAX) return;
    var d = Math.hypot(to.x - from.x, to.y - from.y);
    ENS.arcs.push({
      from: from, to: to,
      x0: from.x, y0: from.y, x1: to.x, y1: to.y,
      lift: Math.min(H * 0.42, 60 + d * 0.42),
      t: 0, dur: clamp(0.42 + d / 1100, 0.42, 1.05),
      hue: fingerHue(from), hue2: fingerHue(to)
    });
  }

  function arcAt(A2, u) {
    // ends follow the fingers, so a leap lands on your hand wherever it went
    var x0 = A2.from && A2.from.down ? A2.from.x : A2.x0;
    var y0 = A2.from && A2.from.down ? A2.from.y : A2.y0;
    var x1 = A2.to && A2.to.down ? A2.to.x : A2.x1;
    var y1 = A2.to && A2.to.down ? A2.to.y : A2.y1;
    return { x: x0 + (x1 - x0) * u,
             y: y0 + (y1 - y0) * u - Math.sin(Math.PI * u) * A2.lift };
  }

  function updateEnsemble(downs, dt, t) {
    var live = downs.length >= 3;
    ENS.on = live;
    ENS.k = live ? Math.min(1, ENS.k + dt * 3) : Math.max(0, ENS.k - dt * 2);
    ENS.noteCool -= dt;
    var i;

    // the leaps carry on even as the hand that threw them moves
    for (i = ENS.arcs.length - 1; i >= 0; i--) {
      var A2 = ENS.arcs[i];
      A2.t += dt;
      if (A2.t >= A2.dur) {
        if (live && A2.to && A2.to.down) ensNote(A2.to, t, 1.0);
        ENS.arcs.splice(i, 1);
      }
    }
    for (i = ENS.hits.length - 1; i >= 0; i--) {
      ENS.hits[i].t += dt;
      if (ENS.hits[i].t > ENS.hits[i].life) ENS.hits.splice(i, 1);
    }
    for (i = 0; i < downs.length; i++) {
      if (downs[i].hitK) downs[i].hitK = Math.max(0, downs[i].hitK - dt * 1.7);
    }
    if (!live) return;

    /* The tempo drifts, slowly, but the BAR does not - so it can quicken and
       ease off the way a person would without ever losing the one. */
    ENS.step = clamp(ENS.step + rnd(-0.35, 0.35) * dt, 0.15, 0.34);

    var voiced = voiceAnchors(downs);
    if (!ENS.motif || ENS.motif.n !== downs.length) {
      ENS.motif = newMotif(downs.length);
      ENS.motif.n = downs.length;
      ENS.pos = 0; ENS.reps = 0; ENS.next = 0;
    }

    ENS.next -= dt;
    if (ENS.next > 0) return;
    // more hands, a slightly brisker grid, so a bar does not sag under six
    ENS.next = ENS.step / clamp(1 + (downs.length - 3) * 0.12, 1, 1.5);

    var slot2 = ENS.motif[ENS.pos];
    var atBarEnd = ENS.pos === BAR - 1;
    ENS.pos = (ENS.pos + 1) % BAR;
    if (ENS.pos === 0) {
      /* Round again. Played straight two to four times, changing a step or two
         each pass, and then something new - which is long enough to be
         recognised and short enough never to become wallpaper. */
      ENS.reps++;
      if (ENS.reps >= 2 + ((Math.random() * 3) | 0)) {
        ENS.motif = newMotif(downs.length); ENS.motif.n = downs.length; ENS.reps = 0;
      } else if (Math.random() < 0.8) {
        mutateMotif(ENS.motif, downs.length, downs, t);
      }
    }
    if (!slot2) return;                                  // a rest, and rests matter

    var target = slot2.bass && voiced.length
               ? voiced[0].p
               : downs[slot2.i % downs.length];
    if (!target || !target.down) return;
    ensNote(target, t, slot2.acc);

    /* The leap goes on the off-beats. On the downbeat there is already the
       bass and a ring opening out, and a ribbon crossing the screen on top of
       that is one thing too many at the exact moment the bar wants to be
       clear. */
    if (downs.length > 2 && !slot2.bass && Math.random() < (atBarEnd ? 0.55 : 0.3)) {
      var others = [];
      for (i = 0; i < downs.length; i++) if (downs[i] !== target) others.push(downs[i]);
      if (others.length) ensLeap(target, pick(others), t);
    }
  }

  function drawEnsemble(awake) {
    if (ENS.k <= 0.004) return;
    var lit = (0.45 + awake * 0.55) * ENS.k;
    var i, j;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // the leaps: a bowed ribbon with a bright head, drawn fresh every frame
    for (i = 0; i < ENS.arcs.length; i++) {
      var A2 = ENS.arcs[i];
      var u = clamp(A2.t / A2.dur, 0, 1);
      var hue = norm360(A2.hue + (A2.hue2 - A2.hue) * u * 0.5).toFixed(0);
      var tail = Math.max(0, u - 0.46);
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (j = 0; j <= 16; j++) {
          var uu = tail + (u - tail) * (j / 16);
          var pt = arcAt(A2, uu);
          if (j) ctx.lineTo(pt.x * DPR, pt.y * DPR); else ctx.moveTo(pt.x * DPR, pt.y * DPR);
        }
        ctx.lineWidth = (pass ? 3.4 : 17) * DPR;
        ctx.strokeStyle = 'hsla(' + hue + ',95%,' + (pass ? '76%,' : '56%,') +
                          ((pass ? 0.90 : 0.20) * lit).toFixed(3) + ')';
        ctx.stroke();
      }
      var hd = arcAt(A2, u);
      ctx.beginPath(); ctx.arc(hd.x * DPR, hd.y * DPR, 26 * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',95%,56%,' + (0.16 * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath(); ctx.arc(hd.x * DPR, hd.y * DPR, 8.5 * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',98%,84%,' + (0.9 * lit).toFixed(3) + ')';
      ctx.fill();
      blob(tctx, hd.x, hd.y, 4.5, A2.hue + 30, 0.11 * lit);
    }

    // where a note landed: a ring opening out, in that finger's colour
    for (i = 0; i < ENS.hits.length; i++) {
      var hh = ENS.hits[i];
      var hk = hh.t / hh.life, fade = (1 - hk) * (1 - hk);
      // the body the trail buffer used to give it, drawn and thrown away again
      ctx.beginPath();
      ctx.arc(hh.x * DPR, hh.y * DPR, (10 + hk * 40) * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + norm360(hh.hue + 40).toFixed(0) + ',96%,60%,' +
                      (0.22 * fade * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hh.x * DPR, hh.y * DPR, (14 + hk * 88) * DPR, 0, TAU);
      ctx.lineWidth = (1 + fade * 7) * DPR;
      ctx.strokeStyle = 'hsla(' + norm360(hh.hue + 30).toFixed(0) + ',98%,64%,' +
                        (0.75 * fade * lit).toFixed(3) + ')';
      ctx.stroke();
      // a second ring chasing the first, so a hit reads as a burst not a line
      ctx.beginPath();
      ctx.arc(hh.x * DPR, hh.y * DPR, (8 + hk * 52) * DPR, 0, TAU);
      ctx.lineWidth = (1 + fade * 3) * DPR;
      ctx.strokeStyle = 'hsla(' + norm360(hh.hue + 70).toFixed(0) + ',98%,74%,' +
                        (0.45 * fade * lit).toFixed(3) + ')';
      ctx.stroke();
    }
    ctx.restore();
  }

  /* Every finger that is down wears its own colour, in both modes, so a child
     can point at the screen and say which light is theirs. */
  function drawFingers(list, awake) {
    var lit = 0.45 + awake * 0.55;
    var down = [], i;
    for (i = 0; i < list.length; i++) {
      if (list[i].down && list[i].mhue !== undefined && list[i].mhue !== null) down.push(list[i]);
    }
    if (!down.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    /* And each finger keeps its own colour. Bright enough to find from across
       a room and saturated enough to stay that colour when it is struck - the
       first version washed out to white on a hit, which is precisely when a
       child is looking to see whether it was theirs. */
    for (i = 0; i < down.length; i++) {
      var p = down[i];
      var hk = p.hitK || 0;
      var hue = norm360(p.mhue).toFixed(0);
      ctx.beginPath();
      ctx.arc(p.x * DPR, p.y * DPR, (26 + hk * 30) * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',95%,55%,' + ((0.07 + hk * 0.14) * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x * DPR, p.y * DPR, (16 + hk * 22) * DPR, 0, TAU);
      ctx.lineWidth = (2.2 + hk * 4) * DPR;
      ctx.strokeStyle = 'hsla(' + hue + ',97%,' + (60 + hk * 10).toFixed(0) + '%,' +
                        ((0.55 + hk * 0.42) * lit).toFixed(3) + ')';
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(p.x * DPR, p.y * DPR, (5 + hk * 9) * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',98%,' + (72 + hk * 12).toFixed(0) + '%,' +
                        ((0.55 + hk * 0.4) * lit).toFixed(3) + ')';
      ctx.fill();
    }
    ctx.restore();
  }

  /* ============================================================
     THE ECHO
     ------------------------------------------------------------
     Tap a few times and then stop. After a moment a small light appears where
     you first touched, travels to each of the other places in turn, arriving
     exactly on your rhythm, and sounds each one an octave up. Then it goes.

     This is the only thing in the app that takes a turn. Everything else is
     simultaneous - you act, it answers, at once - and this waits for you to
     finish, repeats what you did, and hands it back. That is worth having for
     this audience in particular, and it is worth having ONLY if it never nags:
     it needs a real silence first, it fires on about half the chances it gets,
     it will not come round again for a good while, and the instant you touch
     the screen it stops dead and the turn is yours again.

     It replays your PLACES, so it also replays your pitches - the notes come
     out of noteIdxAt and octAt exactly as yours did. It is your phrase, an
     octave higher, in the bell that was built to always be audible.
     ============================================================ */
  /* taps is what you played; play is what is being played back at you. These
     used to be one array, which was survivable only because a long cooldown
     kept them from ever being needed at the same time: after a reply, taps
     still held the finished sequence, whose entries carry a gap but no time,
     and the next taps were appended on top of that mixture. Left alone it
     computes a NaN gap and the reply stops dead on a note forever. Answering
     every phrase means the two lists are now in use within a second of each
     other, so they are two lists. */
  var ECHO = {
    taps: [], play: [], blooms: [],
    on: false, i: 0, next: 0, cool: 0, x: 0, y: 0, k: 0
  };
  /* However long the phrase was. Six was a guess, and it was the wrong end of
     the phrase to keep - shift() drops the OLDEST, so a child who tapped out
     a long figure got the last few taps of it handed back and none of the
     shape they had actually made. This is high enough not to be reached by
     anything anybody would sit and play in one breath, and it is still a
     ceiling, because the array wants one. The reply is cancelled the instant
     anything is touched, so a long answer can never trap anyone. */
  var ECHO_MAX = 32;

  function echoNote(x, y, vel) {
    if (!A.ok || !A.started) return;
    var v = vel === undefined ? 0.32 : vel;
    asNote(function () { playTouchNote(x, y, v); });
  }

  function echoStop() { ECHO.on = false; ECHO.k = 0; }

  function updateEcho(dt, t, fingers) {
    ECHO.cool -= dt;
    for (var bi = ECHO.blooms.length - 1; bi >= 0; bi--) {
      ECHO.blooms[bi].t += dt;
      if (ECHO.blooms[bi].t > ECHO.blooms[bi].life) ECHO.blooms.splice(bi, 1);
    }
    /* Your turn always wins. Note what this does NOT do: it does not throw the
       taps away. It used to, and a phrase is played with the finger DOWN, so
       every tap wiped the one before it and the app never held more than one -
       measured, four taps in and the list had a single entry. Forgetting is
       only right when you interrupt the reply, which is you taking the turn
       back. */
    if (fingers > 0) {
      if (ECHO.on) { echoStop(); ECHO.taps.length = 0; }
      return;
    }
    if (ECHO.on) {
      ECHO.k = Math.min(1, ECHO.k + dt * 4);
      ECHO.next -= dt;
      var tgt = ECHO.play[ECHO.i];
      if (!tgt) { echoStop(); return; }
      // the light slides to the next place and arrives on the beat
      var ease = 1 - Math.pow(0.0025, dt);
      ECHO.x += (tgt.x - ECHO.x) * ease;
      ECHO.y += (tgt.y - ECHO.y) * ease;
      if (ECHO.next <= 0) {
        ECHO.x = tgt.x; ECHO.y = tgt.y;
        echoNote(tgt.x, tgt.y, tgt.tail ? 0.24 : 0.32);
        /* On the screen canvas, not the trail. A child taps the same corner
           over and over, and now that every phrase is answered the reply
           returns to those same fixed points every few seconds - which is the
           exact recipe that scarred the ensemble's fingers white. */
        ECHO.blooms.push({ x: tgt.x, y: tgt.y, t: 0, life: 0.8 });
        if (ECHO.blooms.length > 10) ECHO.blooms.shift();
        for (var q = 0; q < 3; q++) {
          var ang = Math.random() * TAU, sp = 180 + Math.random() * 220;
          emitSpark(tgt.x, tgt.y, Math.cos(ang) * sp, Math.sin(ang) * sp,
                    world.hue + 100 + rnd(-25, 25), 0.4);
        }
        ECHO.i++;
        var nx2 = ECHO.play[ECHO.i];
        if (!nx2) { echoStop(); return; }
        ECHO.next = nx2.gap;
      }
      return;
    }

    // taps only belong to the same phrase if they were close together in time
    var taps = ECHO.taps;
    while (taps.length && t - taps[taps.length - 1].t > 4.5) taps.length = 0;
    if (taps.length < 3 || ECHO.cool > 0 || world.sleep > 0.5) return;
    var quiet = t - taps[taps.length - 1].t;
    if (quiet < 1.35) return;
    if (quiet > 2.6) { taps.length = 0; return; }        // the moment has passed
    var span = taps[taps.length - 1].t - taps[0].t;
    if (span < 0.5) { taps.length = 0; return; }         // a double tap is not a rhythm

    /* Every phrase gets an answer. The rarity used to be the safeguard - a
       long cooldown and a coin toss - but the safeguard was in the wrong
       place: what stops this being a nuisance is that it will not speak until
       you have genuinely stopped, and that the moment you touch anything it
       shuts up mid-note and the turn is yours. Those two are unchanged. What
       is left here is only long enough that a reply cannot set itself off
       again on its own tail. */
    ECHO.cool = 1.2;

    /* Slightly quicker than you played it, which is what makes it read as an
       answer rather than as a recording.

       And about half the time it is played somewhere else on the screen. The
       shape of the phrase is kept exactly - the same intervals, the same
       distances, the same turns - but the whole figure is carried to another
       part of the field. Because position IS pitch here, moving it sideways
       transposes it and moving it up or down changes its register, so the
       answer comes back recognisably the same tune in a different key. That is
       what a musician would do with a phrase you handed them, and it costs two
       lines. */
    var offX = 0, offY = 0;
    if (Math.random() < 0.5) {
      var lo = { x: taps[0].x, y: taps[0].y }, hi = { x: taps[0].x, y: taps[0].y };
      for (var b2 = 1; b2 < taps.length; b2++) {
        if (taps[b2].x < lo.x) lo.x = taps[b2].x;
        if (taps[b2].y < lo.y) lo.y = taps[b2].y;
        if (taps[b2].x > hi.x) hi.x = taps[b2].x;
        if (taps[b2].y > hi.y) hi.y = taps[b2].y;
      }
      var m = 40;
      offX = rnd(m - lo.x, W - m - hi.x);
      offY = rnd(m - lo.y, H - m - hi.y);
      // worth moving, or not worth pretending to
      if (Math.hypot(offX, offY) < 90) { offX = 0; offY = 0; }
    }
    var seq = [];
    for (var i = 0; i < taps.length; i++) {
      seq.push({ x: clamp(taps[i].x + offX, 24, W - 24),
                 y: clamp(taps[i].y + offY, 24, H - 24),
                 gap: i ? clamp((taps[i].t - taps[i - 1].t) * 0.86, 0.10, 1.5) : 0 });
    }
    /* AND THEN IT FINISHES THE THOUGHT.
       ------------------------------------------------------------
       Your phrase played back is a repetition. A repetition with a cadence on
       the end is an answer, and that is a different thing to be handed: it
       says the room heard where you stopped and had an idea about it.

       Three endings, chosen fresh each time. A RISE runs up the scale from
       wherever you left off and opens out. A FALL comes down and lands on the
       root. A SETTLE just breathes the root twice, an octave apart, and stops.
       None of them can be wrong, because all of them are degrees of the same
       pentatonic, and each note is PLACED at the position that means that
       pitch - so a rising ending is also a light climbing the screen. */
    if (Math.random() < 0.72 && seq.length) {
      var last = seq[seq.length - 1];
      var lastDeg = noteIdxAt(last.x), lastOct = octAt(last.y);
      var kind = pick(['rise', 'fall', 'settle']);
      var steps = [], n2, d2;
      if (kind === 'rise') {
        n2 = 3 + ((Math.random() * 2) | 0);
        d2 = lastDeg;
        for (i = 0; i < n2; i++) {
          d2 = Math.min(NOTES.length - 1, d2 + 1 + ((Math.random() * 2) | 0));
          steps.push({ deg: d2, oct: i === n2 - 1 ? Math.min(2, lastOct * 2) : lastOct });
        }
      } else if (kind === 'fall') {
        n2 = 3 + ((Math.random() * 2) | 0);
        d2 = lastDeg;
        for (i = 0; i < n2; i++) {
          d2 = Math.max(0, d2 - 1 - ((Math.random() * 2) | 0));
          steps.push({ deg: i === n2 - 1 ? 0 : d2, oct: lastOct });
        }
      } else {
        steps.push({ deg: 0, oct: lastOct });
        steps.push({ deg: 0, oct: Math.min(2, lastOct * 2) });
      }
      for (i = 0; i < steps.length; i++) {
        seq.push({ x: xForDeg(steps[i].deg), y: yForOct(steps[i].oct),
                   gap: i === 0 ? clamp(seq[seq.length - 1].gap * 1.15, 0.16, 0.9)
                                : (kind === 'settle' ? 0.42 : clamp(0.10 + Math.random() * 0.09, 0.10, 0.2)),
                   tail: true });
      }
    }

    ECHO.play = seq; ECHO.taps = [];
    ECHO.on = true; ECHO.i = 0; ECHO.next = 0; ECHO.k = 0;
    ECHO.x = seq[0].x; ECHO.y = seq[0].y;
  }

  function drawEcho(awake) {
    var lit0 = 0.5 + awake * 0.5, i;
    if (ECHO.blooms.length) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (i = ECHO.blooms.length - 1; i >= 0; i--) {
        var bl = ECHO.blooms[i];
        var bk = bl.t / bl.life, bf = (1 - bk) * (1 - bk);
        var bh = norm360(world.hue + 100).toFixed(0);
        ctx.beginPath();
        ctx.arc(bl.x * DPR, bl.y * DPR, (10 + bk * 46) * DPR, 0, TAU);
        ctx.lineWidth = (1 + bf * 4) * DPR;
        ctx.strokeStyle = 'hsla(' + bh + ',96%,72%,' + (0.6 * bf * lit0).toFixed(3) + ')';
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(bl.x * DPR, bl.y * DPR, (7 + bk * 22) * DPR, 0, TAU);
        ctx.fillStyle = 'hsla(' + bh + ',96%,64%,' + (0.20 * bf * lit0).toFixed(3) + ')';
        ctx.fill();
      }
      ctx.restore();
    }
    if (!ECHO.on) return;
    var lit = lit0 * ECHO.k;
    var hue = norm360(world.hue + 100).toFixed(0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(ECHO.x * DPR, ECHO.y * DPR, 4.5 * DPR, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ',96%,76%,' + (0.75 * lit).toFixed(3) + ')';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ECHO.x * DPR, ECHO.y * DPR, 11 * DPR, 0, TAU);
    ctx.fillStyle = 'hsla(' + hue + ',92%,60%,' + (0.16 * lit).toFixed(3) + ')';
    ctx.fill();
    ctx.restore();
    blob(tctx, ECHO.x, ECHO.y, 3.6, world.hue + 110, 0.16 * lit);
  }

  /* ============================================================
     SKIPPED STONES
     ------------------------------------------------------------
     Tap a rocky planet and it skips a few stones out across the water. Each
     one leaves in its own direction and touches down again and again, and the
     spacing is the whole point: the first hop carries a long way, and every
     one after it is shorter than the last until the stone runs out and sinks.

     That decreasing gap is the only thing that makes it read as skipping
     rather than as a row of dots, and it is one multiply - each hop is a fixed
     fraction of the one before, which is what a real stone does as it loses
     the energy to lift itself out again.
     ============================================================ */
  var STONES = [];
  var STONE_MAX = 26;

  function skipStones(big, t) {
    var R = worldR(big);
    var n = 2 + ((Math.random() * 4) | 0);
    var voice = 0;
    for (var i = 0; i < n && STONES.length < STONE_MAX; i++) {
      var ang = Math.random() * TAU;
      var gap = rnd(90, 150);
      STONES.push({
        x: big.x + Math.cos(ang) * R * 0.95, y: big.y + Math.sin(ang) * R * 0.95,
        dx: Math.cos(ang), dy: Math.sin(ang),
        gap: gap, decay: rnd(0.66, 0.80),
        wait: 0, hops: 5 + ((Math.random() * 5) | 0),
        hue: world.hue + big.hueOff + rnd(10, 60),
        deg: 2 + ((Math.random() * 5) | 0),
        sound: voice++ < 2
      });
    }
    flash(big.x, big.y, world.hue + big.hueOff + 30, R * 1.1, 0.16);
  }

  function updateStones(dt, t) {
    for (var i = STONES.length - 1; i >= 0; i--) {
      var st = STONES[i];
      st.wait -= dt;
      if (st.wait > 0) continue;
      // it comes down: a ring on the water, and the next hop is shorter
      var k = clamp(st.gap / 150, 0.15, 1);
      wave(tctx, st.x, st.y, 9 + k * 16, st.hue, 0.10 + k * 0.14);
      blob(tctx, st.x, st.y, 3 + k * 4, st.hue + 30, 0.16 + k * 0.20);
      addStir(st.x, st.y, 0.03 * k * (Math.random() < 0.5 ? -1 : 1), 0.14);
      if (st.sound && A.ok && A.started) {
        var sf = noteI(st.deg) * (k > 0.5 ? 1 : 2);
        var sp2 = panOf(st.x), sv = 0.012 + k * 0.014;
        ambient(function () { drop(sf, sv, sp2); });
      }
      st.hops--;
      if (st.hops <= 0 || st.gap < 12) {
        wave(tctx, st.x, st.y, 20, st.hue + 40, 0.10);
        STONES.splice(i, 1); continue;
      }
      st.x += st.dx * st.gap; st.y += st.dy * st.gap;
      st.gap *= st.decay;
      st.wait = 0.05 + st.gap * 0.0016;
      if (st.x < -40 || st.x > W + 40 || st.y < -40 || st.y > H + 40) STONES.splice(i, 1);
    }
  }

  /* ============================================================
     THE GIFT
     ------------------------------------------------------------
     Tap a dotted planet and it throws one arc of light out into the field. It
     lands on a creature, which lights up - and then, sometimes, passes it on
     to another, and that one to another. Sometimes it stops at the first.
     Sometimes it goes five deep across the whole screen.

     One arc in the air at a time from any one tap, because the pleasure here
     is following a single thing and wondering where it will go next, and four
     of them at once is a firework, which is what the ringed planet is for.
     ============================================================ */
  var GIFTS = [];

  function giftTarget(fromX, fromY, notThis) {
    var best = [], i;
    for (i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.vit < 0.4 || c === notThis || c.world) continue;
      var d = Math.hypot(c.x - fromX, c.y - fromY);
      if (d > 60) best.push(c);
    }
    return best.length ? pick(best) : null;
  }

  function sendGift(fromX, fromY, target, hops, hue) {
    if (!target || GIFTS.length > 6) return;
    var d = Math.hypot(target.x - fromX, target.y - fromY);
    GIFTS.push({
      x0: fromX, y0: fromY, to: target,
      x1: target.x, y1: target.y,
      lift: Math.min(H * 0.40, 70 + d * 0.40),
      t: 0, dur: clamp(0.45 + d / 1000, 0.45, 1.15),
      hue: hue, hops: hops
    });
  }

  function giftAt(G, u) {
    var x1 = G.to && G.to.vit > 0.2 ? G.to.x : G.x1;
    var y1 = G.to && G.to.vit > 0.2 ? G.to.y : G.y1;
    return { x: G.x0 + (x1 - G.x0) * u,
             y: G.y0 + (y1 - G.y0) * u - Math.sin(Math.PI * u) * G.lift };
  }

  function updateGifts(dt, t) {
    for (var i = GIFTS.length - 1; i >= 0; i--) {
      var G = GIFTS[i];
      G.t += dt;
      if (G.t < G.dur) continue;
      var c = G.to;
      GIFTS.splice(i, 1);
      if (!c || c.vit < 0.2) continue;
      c.glowAdd = Math.max(c.glowAdd, 0.9);
      c.mood = clamp(c.mood + 0.3, 0, 1);
      burstRing(c.x, c.y, G.hue, 12, 460, 0.7);
      wave(tctx, c.x, c.y, 24, G.hue + 30, 0.16);
      if (A.ok && A.started) {
        var gf = noteI(noteIdxAt(c.x)) * octAt(c.y), gp = panOf(c.x);
        ambient(function () { chime(gf, 0.024, gp, 1.1, 2.0); });
      }
      if (G.hops > 1) {
        var nxt = giftTarget(c.x, c.y, c);
        if (nxt) sendGift(c.x, c.y, nxt, G.hops - 1, G.hue + rnd(20, 60));
      }
    }
  }

  function drawStonesAndGifts(awake) {
    if (!GIFTS.length) return;
    var lit = 0.5 + awake * 0.5;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var i = 0; i < GIFTS.length; i++) {
      var G = GIFTS[i];
      var u = clamp(G.t / G.dur, 0, 1);
      var tail = Math.max(0, u - 0.5);
      var hue = norm360(G.hue).toFixed(0);
      for (var pass = 0; pass < 2; pass++) {
        ctx.beginPath();
        for (var j = 0; j <= 16; j++) {
          var pt = giftAt(G, tail + (u - tail) * (j / 16));
          if (j) ctx.lineTo(pt.x * DPR, pt.y * DPR); else ctx.moveTo(pt.x * DPR, pt.y * DPR);
        }
        ctx.lineWidth = (pass ? 3.2 : 15) * DPR;
        ctx.strokeStyle = 'hsla(' + hue + ',95%,' + (pass ? '78%,' : '58%,') +
                          ((pass ? 0.88 : 0.18) * lit).toFixed(3) + ')';
        ctx.stroke();
      }
      var hd = giftAt(G, u);
      ctx.beginPath(); ctx.arc(hd.x * DPR, hd.y * DPR, 22 * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',95%,58%,' + (0.15 * lit).toFixed(3) + ')';
      ctx.fill();
      ctx.beginPath(); ctx.arc(hd.x * DPR, hd.y * DPR, 7.5 * DPR, 0, TAU);
      ctx.fillStyle = 'hsla(' + hue + ',98%,86%,' + (0.92 * lit).toFixed(3) + ')';
      ctx.fill();
      blob(tctx, hd.x, hd.y, 4, G.hue + 30, 0.10 * lit);
    }
    ctx.restore();
  }

  function pokeCreature(c, px, py, t) {
    world.poked++;
    if (c.elder) {
      // an elder always answers properly, and it is always a moment
      markMoment(c.x, c.y, world.hue + c.hueOff + 60, 'elder');
      voicePrio++;      // an elder answering a touch is never refused
      c.glowAdd = Math.max(c.glowAdd, 1.4);
      startReaction(c, pick(['bloom', 'sing', 'pulse']), 1.4, world.hue, t, null);
      spawnPulse(c.x, c.y, {
        energy: 1.35, reach: rnd(0.6, 0.95), uni: rnd(0.8, 1.0), budget: 22,
        kind: pick([RIPPLES[0], RIPPLES[4], RIPPLES[1]]), layers: [0, 1, 2],
        speed: rnd(190, 320), show: 1.4
      });
      for (var ei = 0; ei < 40; ei++) {
        var ea = Math.random() * TAU, es = 160 + Math.random() * 620;
        emitSpark(c.x, c.y, Math.cos(ea) * es, Math.sin(ea) * es,
                  world.hue + c.hueOff + rnd(-60, 60), 1.2);
      }
      if (A.ok && A.started) {
        bowl(noteI(1), 0.06, panOf(c.x), 7);
        breath(noteI(5), 0.05, panOf(c.x), 0.7, 6);
      }
      voicePrio--;
      return;
    }
    /* A planet is not a creature and should not answer like one every time.
       About half of the taps send up a launch instead, which is the easter egg;
       the rest fall through to the ordinary twelve outcomes below. */
    /* A planet always does its OWN thing, and it is the thing you can see it is.
       ------------------------------------------------------------
       Rolling a fresh outcome per tap made every planet the same planet with a
       random mood, and nothing about it could be learnt - tap it twice and get
       two different answers, which reads as noise rather than as character. Tied
       to the type instead, which is already decided at birth and already
       visible: a rocky one sends out rings, a banded one launches rockets, a
       ringed one puts up a firework. Tap the same planet all afternoon and it
       will do the same thing, and after meeting two or three of them you can
       tell from across the room which one you have. */
    if (c.world) {
      c.flare = Math.max(c.flare, 0.5);
      c.mood = clamp(c.mood + 0.25, 0, 1);
      if (c.ptype === 1) launchRockets(c, t);
      else if (c.ptype === 2) launchFirework(c, t);
      else if (c.ptype === 3) {
        sendGift(c.x, c.y, giftTarget(c.x, c.y, c),
                 1 + ((Math.random() * 5) | 0), world.hue + c.hueOff + rnd(20, 80));
        if (A.ok && A.started) { voiceBg++; breath(noteI(1), 0.020, panOf(c.x), 0.45, 1.3); voiceBg--; }
      } else {
        skipStones(c, t);
        if (A.ok && A.started) { voiceBg++; breath(noteI(3), 0.020, panOf(c.x), 0.5, 1.4); voiceBg--; }
      }
      return;
    }
    var hue = world.hue + c.hueOff + 40;
    var P = choosePoke(c);
    /* No shared flash. Every answer used to be preceded by mood = 1 and a
       glow of 0.9 whatever it was about, so the brightening was the loudest
       thing in all twelve outcomes and it was identical in all twelve -
       which is why they read as one outcome with variations you had to look
       for. The brightening is now part of the answer and scaled to it, so a
       small answer stays small and can be seen for what it is. */
    c.mood = clamp(c.mood + 0.08 + P.amp * 0.78, 0, 1);
    c.glowAdd = Math.max(c.glowAdd, 0.04 + P.amp * 0.86);
    c.lastPoke = P.k;
    /* Attention feeds. Every touch grows it a little, so keeping at one
       creature makes it bigger and eventually heavy enough to hold others -
       which is the rule a child is most likely to find on their own, and the
       one that makes a world something you MADE rather than something that
       happened. About fifteen goes at the same one, and it has its own moon. */
    c.size = Math.min(c.world ? HEAVY_MAX : c.born0 * 1.9, c.size * 1.035);
    maybeWorld(c);
    feedWarmth(0.005);
    earnBubbles(0.028, c.x, c.y);          // a poke: many of them make a raft
    mine(function () { P.run(c, px, py, t, hue); });
  }

  /* Each creature leans towards a few of the gentle answers and keeps
     leaning that way for as long as it lives, so touching the same one
     twice gets related replies and it reads as having a temperament -
     while the one beside it answers quite differently. Just under half the
     time it does something out of character, which is what stops the lean
     from becoming a rule you can rely on. */
  function pokeByWeight(maxAmp) {
    var tot = 0, i;
    for (i = 0; i < POKES.length; i++) if (POKES[i].amp <= maxAmp) tot += POKES[i].w;
    var r = Math.random() * tot;
    for (i = 0; i < POKES.length; i++) {
      if (POKES[i].amp > maxAmp) continue;
      r -= POKES[i].w;
      if (r <= 0) return POKES[i];
    }
    return POKES[0];
  }

  function choosePoke(c) {
    if (!c.affin) {
      c.affin = [];
      // its leanings are all quiet ones, so a character never means a bang
      // its leanings may include a real change, just not an event
      for (var a = 0; a < 3; a++) c.affin.push(pokeByWeight(0.52));
    }
    if (Math.random() < 0.30) {
      var P = c.affin[(Math.random() * c.affin.length) | 0];

     Weighted heavily towards the small: about seven times in ten it is

     in ten it is a real change of state, and less than one time in ten it
     is an event that the rest of the room notices.

     They are deliberately spread across DIFFERENT CHANNELS rather than
     different amounts of the same channel: colour, darkness, outline,
     trail, tremble, motion, size, timing. Two quiet answers in a row

  var POKES = [

    { k: 'echo', w: 0.9, amp: 0.48, run: function (c, px, py, t, hue) {

          var dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
          if (d2 < bd) { bd = d2; best = o; }
        }
        if (best) {
          soon(0.5 + Math.random() * 0.3, function (tt) {

      } },
    { k: 'pip', w: 1.9, amp: 0.46, run: function (c, px, py, t, hue) {
        // collapses to a bright point, sits there, then swells back bigger
        startReaction(c, 'pip', 1.0, hue, t, null);
        c.rdur = 1.7;
        c.size = Math.min(70, c.size * 1.18);
        c.vx *= 0.1; c.vy *= 0.1;
        voiceOf(c, 'shed', 0.4, hue);
      } },
    { k: 'reconsider', w: 1.7, amp: 0.42, run: function (c, px, py, t, hue) {
        /* Backs off, slows, stops - and then comes part of the way back and
           has a look. The return is the whole thing: a creature that flinches
           and then thinks better of it reads as having an opinion about you. */
        var a = Math.atan2(c.y - py, c.x - px);
        if (!isFinite(a)) a = Math.random() * TAU;
        c.vx += Math.cos(a) * 300; c.vy += Math.sin(a) * 300;
        startReaction(c, 'shy', 0.5, hue, t, null);
        var cc = c, tx = px, ty = py;
        soon(0.62 + Math.random() * 0.25, function (tt) {
          if (cc.vit < 0.3 || cc.held) return;
          var d = Math.hypot(tx - cc.x, ty - cc.y) + 1;
          cc.vx += ((tx - cc.x) / d) * 140; cc.vy += ((ty - cc.y) / d) * 140;
          startReaction(cc, 'peek', 0.45, hue, tt, null);
        });
      } },
    { k: 'lengthen', w: 1.8, amp: 0.34, run: function (c, px, py, t, hue) {
        // grows a longer tail, and keeps it: a change of silhouette
        var add = 6 + ((Math.random() * 3) | 0);
        for (var i = 0; i < add && c.tail.length < 34; i++) {
          c.tail.push({ x: c.x, y: c.y });

    { k: 'borrow', w: 1.4, amp: 0.40, run: function (c, px, py, t, hue) {
        // answers in its neighbour's voice, and briefly wears its colour
        var best = null, bd = 320 * 320;
        for (var i = 0; i < creatures.length; i++) {
          var o = creatures[i];
          if (o === c || o.vit < 0.4) continue;
          var dx = o.x - c.x, dy = o.y - c.y, d2 = dx * dx + dy * dy;
          if (d2 < bd) { bd = d2; best = o; }
        }
        startReaction(c, 'blush', 0.9, hue, t, null);
        if (best) {
          var mine = c.sp.voice, own = {};
          for (var f in c.sp) own[f] = c.sp[f];    // its own copy to alter
          own.voice = best.sp.voice;
          c.sp = own;
          voiceOf(c, 'other', 0.42, hue);

    { k: 'chord', w: 1.1, amp: 0.42, run: function (c, px, py, t, hue) {

        if (A.ok && A.started) {
          var b = clamp(Math.round((1 - c.y / Math.max(1, H)) * (NOTES.length - 1)), 0, NOTES.length - 5);
          var pn = panOf(c.x), o = octAt(c.y);
          bowl(noteI(b) * o, 0.026, clamp(pn - 0.3, -1, 1), 4.5);
          chime(noteI(b + 2) * o, 0.020, pn, 0.8, 3.0);

      } },
    { k: 'recolour', w: 2.4, amp: 0.44, run: function (c, px, py, t, hue) {
        // and keeps the new colour: this one really did change
        c.hueOff += rnd(80, 250) * (Math.random() < 0.5 ? -1 : 1);
        startReaction(c, 'flip', 0.85, hue, t, null);
        voiceOf(c, 'flip', 0.45, hue);
      } },

    /* ---- an event ---- */
    { k: 'split', w: 0.95, amp: 0.90, run: function (c, px, py, t, hue) {
        world.pop = Math.min(6, world.pop + 2);
        var made = 0, i, a, sp;
        for (i = 0; i < 3; i++) {
          var n = freeCreature();
          if (!n) break;
          n.x = c.x + rnd(-30, 30); n.y = c.y + rnd(-30, 30);
          n.size = Math.max(6, c.size * 0.5); n.age = 0; n.span = rnd(40, 110);
          n.vit = 0; n.hueOff = c.hueOff + rnd(-50, 50);
          a = Math.random() * TAU; sp = rnd(160, 340);
          n.vx = Math.cos(a) * sp; n.vy = Math.sin(a) * sp;
          n.flare = 1; made++;

        c.size = Math.max(7, c.size * (made ? 0.62 : 0.85));

      } },
    { k: 'vanish', w: 1.0, amp: 0.80, run: function (c, px, py, t, hue) {
        for (var i = 0; i < 24; i++) emitSpark(c.x, c.y, 0, 0, hue, 1);
        c.x = Math.random() * W; c.y = Math.random() * H;
        c.vx = 0; c.vy = 0; c.vit = 0; c.flare = 1;
        gust(0.038, panOf(px), 1.0, false);
      } },
    { k: 'bolt', w: 1.3, amp: 0.82, run: function (c, px, py, t, hue) {
        var a = Math.atan2(c.y - py, c.x - px);
        if (!isFinite(a)) a = Math.random() * TAU;
        c.vx += Math.cos(a) * 600; c.vy += Math.sin(a) * 600;
        startReaction(c, 'scamper', 0.95, hue, t, { x: px, y: py, gen: 0 });
      } },
    { k: 'become', w: 1.5, amp: 0.70, run: function (c, px, py, t, hue) {
        c.sp = SPECIES_BAG[(Math.random() * SPECIES_BAG.length) | 0];
        c.size = rnd(c.sp.sz[0], c.sp.sz[1]);
        c.tail.length = 0;
        for (var i = 0; i < c.sp.tail; i++) c.tail.push({ x: c.x, y: c.y });

        startReaction(c, 'bloom', 0.8, hue, t, null);
      } },
    { k: 'call', w: 1.0, amp: 0.68, run: function (c, px, py, t, hue) {
        startReaction(c, 'sing', 0.95, hue, t, null);
        var called = 0;
        for (var i = 0; i < creatures.length && called < 2; i++) {
          var o = creatures[i];
          if (o === c || o.vit < 0.4 || o.socCool > 0) continue;
          var dx = o.x - c.x, dy = o.y - c.y;
          if (dx * dx + dy * dy > 380 * 380) continue;
          o.with = c; o.stance = 'follow'; o.socT = 2.5 + Math.random() * 4;
          called++;
        }
        voiceOf(c, 'sing', 0.5, hue);
      } },
    { k: 'wave', w: 0.7, amp: 1.00, run: function (c, px, py, t, hue) {
        /* Once in a while it lets go of something big: a wide, slow,
           single-minded front that really does travel and really does
           carry everyone it meets. Rare on purpose - it is the one answer
           that changes the whole room. */
        startReaction(c, 'bloom', 1.2, hue, t, null);
        var K = pick([RIPPLES[1], RIPPLES[4], RIPPLES[0]]);
        spawnPulse(c.x, c.y, {
          energy: 1.2, reach: rnd(0.7, 1.0), uni: rnd(0.85, 1.0),
          budget: 22, kind: K, layers: [0, 1, 2],
          speed: rnd(200, 340), show: 1.3
        });
        for (var i = 0; i < 26; i++) emitSpark(c.x, c.y, 0, 0, hue, 1);
        if (A.ok && A.started) {
          bowl(noteI(4), 0.045, panOf(c.x), 7);
          breath(noteI(8), 0.036, panOf(c.x), 0.7, 6);
        }
      } }
  ];

  /* ============================================================
     A GATHERING
     ------------------------------------------------------------
     Every so often the whole room quietly agrees to bloom: the drone
     opens out, the air steps back, the reverb deepens, more voices are
     allowed to sound at once, and a slow wave of creatures answers one
     after another in a rising then falling figure across the screen -
     a real chain reaction rather than a burst, so it reads as the room
     filling up rather than as something going off.

     It has to be EARNED, not scheduled: warmth accumulates while you
     play and drains away while you do not, so it is a payoff for
     staying with it and it will not arrive for somebody who has walked
     off. Steady play brings one every two or three minutes.

     Everything about the shape of it is deliberate, because this is
     meant to be something to decompress into:

       - it swells over five seconds and ebbs over seven, so it never
         arrives suddenly and never stops suddenly
       - it plateaus, so there is a stretch of simply being in it
       - the level is smoothed on top of that envelope, so even the
         corners between phases are rounded off
       - the notes are the same five it always uses over the same
         drone, so a fuller texture cannot become a harsher one
       - it makes the air QUIETER while it makes the warmth louder
       - it resolves back to exactly where it was, every time, so
         nothing about it feels like losing hold of the thing
     ============================================================ */
  var bloom = { on: false, t0: -99, dur: 19, warmth: 0, next: 0,
                ord: [], head: 0, k: 0, step: 0, lastNote: -99, hue: 0 };
  var BLOOM_GAP = 110;         // never twice in quick succession

  function feedWarmth(a) { bloom.warmth = Math.min(1.5, bloom.warmth + a); }

  function bloomShape(t) {
    if (!bloom.on) return 0;
    var u = (t - bloom.t0) / bloom.dur;
    if (u <= 0 || u >= 1) return 0;
    if (u < 0.26) return u / 0.26;          // five seconds coming in
    if (u < 0.62) return 1;                 // seven seconds of simply being in it
    return 1 - (u - 0.62) / 0.38;           // seven going out
  }

  function startBloom(t) {
    bloom.on = true;
    bloom.t0 = t;
    bloom.dur = 17 + Math.random() * 6;
    bloom.warmth = 0;
    bloom.next = t + bloom.dur + BLOOM_GAP * paceGap();
    bloom.head = 0;
    bloom.step = 0;
    bloom.lastNote = -99;
    bloom.hue = world.hue + rnd(-30, 30);
    /* Ordered along one axis so the answers travel across the room as a wave
       instead of popping at random. Which way it travels is rolled each time. */
    var a = Math.random() * TAU, ax = Math.cos(a), ay = Math.sin(a);
    bloom.ord = [];
    for (var i = 0; i < creatures.length; i++) {
      if (creatures[i].vit < 0.35) continue;
      bloom.ord.push({ i: i, d: creatures[i].x * ax + creatures[i].y * ay });
    }
    bloom.ord.sort(function (p1, p2) { return p1.d - p2.d; });
    // and it wakes the room gently on its way in
    world.wake = Math.max(world.wake, 0.6);
    world.sleep = 0; world.idle = 0;
  }

  function updateBloom(dt, t) {
    // warmth for playing, and it drains when nothing is happening
    // at the bottom of the ladder it puts on more of a show unprompted
    feedWarmth(dt * (0.00075 + world.energy * 0.005) * (LEVEL === 0 ? 3.2 : 1));
    if (world.calm > 0.75) bloom.warmth = Math.max(0, bloom.warmth - dt * 0.030);

    if (!bloom.on && bloom.warmth >= 1 && t > bloom.next && world.sleep < 0.2) {
      startBloom(t);
    }
    // smoothed on top of the envelope, so even the phase corners are rounded
    bloom.k = approach(bloom.k, bloomShape(t), 0.55, dt);
    if (bloom.on && t - bloom.t0 > bloom.dur) { bloom.on = false; }
    if (bloom.k < 0.004) { bloom.k = 0; return; }

    /* The wave itself: creatures answer in order along the axis, each with a
       soft reaction and a note a step further up the scale, turning round at
       the top. Paced so it is a procession and never a rattle. */
    var want = 0.52 - bloom.k * 0.16;
    if (bloom.on && t - bloom.lastNote > want && bloom.ord.length) {
      bloom.lastNote = t;
      /* Prefer one that is not already answering, so the wave moves on rather
         than shouting at the same creature - but if everything nearby happens
         to be busy, take one anyway. The procession must not fall silent
         halfway through; the whole point of it is that it keeps arriving. */
      var tries = 0, c = null, spare = null;
      while (tries < bloom.ord.length && !c) {
        var e = bloom.ord[bloom.head % bloom.ord.length];
        bloom.head++;
        tries++;
        var cc = creatures[e.i];
        if (!cc || cc.vit <= 0.35 || cc.held) continue;
        if (!cc.react) c = cc;
        else if (!spare) spare = cc;
      }
      if (!c) c = spare;
      if (c) {
        var mag = 0.20 + bloom.k * 0.45 * (0.4 + c.answer * 0.8);
        startReaction(c, pick(['bloom', 'sing', 'pulse', 'sparkle', 'bob', 'halo']),
                      mag, bloom.hue, t, null);
        c.glowAdd = Math.max(c.glowAdd, 0.2 + bloom.k * 0.4);
        if (A.ok && A.started) {
          // up the five notes and back down again, over and over
          var span = NOTES.length - 1;
          var pos = bloom.step % (span * 2);
          var deg = pos <= span ? pos : span * 2 - pos;
          bloom.step++;
          var f = noteI(deg) * octAt(c.y);
          var vv = 0.014 + bloom.k * 0.016;
          /* Not marked as scenery. The procession is the whole point of a
             gathering and it is earned, so it should not be queueing behind
             the ripple chains for the same handful of background voices -
             which is why half of it was being silently dropped. */
          if (deg % 2) chime(f, vv, panOf(c.x), 0.7, 1.8 + bloom.k * 0.9);
          else marimba(f, vv * 1.1, panOf(c.x));
        }
      }
    }

    // and a few wide, slow, quiet fronts across the plateau, so the room
    // answers together as well as in turn
    if (bloom.on && bloom.k > 0.55 && Math.random() < dt * 0.34) {
      spawnPulse(rnd(W * 0.15, W * 0.85), rnd(H * 0.15, H * 0.85), {
        energy: 0.30 + bloom.k * 0.24, reach: 0.30 + Math.random() * 0.24,
        uni: 0.8, budget: 5 + ((bloom.k * 5) | 0),
        kind: pick([RIPPLES[4], RIPPLES[0], RIPPLES[1]]),
        speed: rnd(150, 260), show: 0.55, hue: bloom.hue + rnd(-40, 40)
      });
    }
  }


  /* ============================================================
     PLACES, AND WANTING TO GO THERE
     ------------------------------------------------------------
     Somewhere on the screen, every half minute or so, something
     appears that a creature might want. Not a target, not a task -
     nothing is scored and nothing fails - just a place, and a few of
     them decide to make their way over to it.

     That decision is the whole point. Watching a creature set off,
     cross the screen and arrive is the difference between a screen
     saver and a terrarium: you can see it has an intention, you can
     guess where it is going, and then you get to find out whether you
     were right and what happens when it gets there. Enough of them
     ignore the whole business that it never reads as a procession.

     Three kinds, and what they give:

       bloom    an opening rosette. Whoever reaches it is fed: they
                swell, brighten, and let a ring go.
       hollow   a dark arch. Whoever reaches it rests - curls up, dims
                right down, stays a while, and leaves lighter.
       gate     a slow double ring. Whoever reaches it spirals in and
                is gone, and somewhere else one fades up in its place.

     Which kind a creature is drawn to depends on what it is, so the
     same species tends to want the same things. That is most of what
     makes them read as characters rather than as particles.
     ============================================================ */
  var WANTS = [];
  var wantNext = 0;
  var WANT_KINDS = ['bloom', 'hollow', 'gate'];
  /* how much each species is drawn to each kind, by the species index:
     suns and clusters go for blooms, lava and blobs for shelter, the
     streaming ones are the only ones much interested in leaving */
  var WANT_TASTE = [
  /*          bloom hollow gate */
  /* sun   */  1.0,  0.3,  0.4,
  /* lava  */  0.4,  1.0,  0.1,
  /* drop  */  0.8,  0.4,  0.7,
  /* ribb  */  0.5,  0.4,  1.0,
  /* wisp  */  0.4,  0.5,  1.0,
  /* jelly */  0.6,  0.9,  0.2,
  /* blob  */  0.5,  1.0,  0.2,
  /* clus  */  1.0,  0.2,  0.5
  ];

  function spawnWant(t) {
    var kind = WANT_KINDS[(Math.random() * WANT_KINDS.length) | 0];
    WANTS.push({
      kind: kind, x: rnd(W * 0.16, W * 0.84), y: rnd(H * 0.16, H * 0.84),
      born: t, life: 42 + Math.random() * 55, k: 0, held: null,
      hue: world.hue + rnd(-50, 90), spin: rnd(-0.5, 0.5),
      /* It gets used up. A bloom feeds two or three and is gone, a shelter
         takes a couple, a gate lets a couple through - which caps how often
         anything arrives anywhere without needing a timer, and gives the
         place a small story of its own: it appears, it is visited, it goes. */
      fed: 0, busy: 0,
      feeds: kind === 'bloom' ? 2 + ((Math.random() * 2) | 0) : 2
    });
  }

  function wantLevel(wa, t) {
    var u = (t - wa.born) / wa.life;
    if (u < 0.09) return u / 0.09;          // four seconds arriving
    if (u > 0.86) return Math.max(0, (1 - u) / 0.14);
    return 1;
  }

  function updateWants(dt, t) {
    if (t > wantNext) {
      wantNext = t + (26 + Math.random() * 34) * paceGap();
      if (WANTS.length < 2 && world.sleep < 0.3) spawnWant(t);
    }
    for (var i = WANTS.length - 1; i >= 0; i--) {
      var wa = WANTS[i];
      wa.k = approach(wa.k, wantLevel(wa, t), 0.5, dt);
      if (wa.held) {
        // carried: it follows, easing, so it does not snap to the finger
        wa.x = lerp(wa.x, wa.held.x, smooth(0.22, dt));
        wa.y = lerp(wa.y, wa.held.y, smooth(0.22, dt));
      }
      /* Anything that bumps into a place gets something out of it, whether it
         meant to come or not - so moving a place through a crowd is a way of
         setting things off. Gentle, and never the same twice. */
      if (wa.k > 0.6 && Math.random() < dt * 2.2) {
        for (var bi = 0; bi < creatures.length; bi++) {
          var bc = creatures[bi];
          if (bc.vit < 0.4 || bc.held || bc.want === wa || bc.cool > 0) continue;
          var bdx = bc.x - wa.x, bdy = bc.y - wa.y;
          if (bdx * bdx + bdy * bdy > 4900) continue;      // within seventy
          var bumpActs = wa.kind === 'bloom' ? ['bloom', 'giggle', 'sparkle', 'wiggle']
                       : wa.kind === 'hollow' ? ['curl', 'doze', 'peek', 'deflate']
                       : ['tumble', 'spin', 'ghost', 'shiver'];
          startReaction(bc, pick(bumpActs), 0.45 + Math.random() * 0.5, wa.hue, t, null);
          bc.glowAdd = Math.max(bc.glowAdd, 0.4);
          var bd = Math.sqrt(bdx * bdx + bdy * bdy) + 1;
          bc.vx += (bdx / bd) * 130; bc.vy += (bdy / bd) * 130;
          for (var bs = 0; bs < 7; bs++) emitSpark(bc.x, bc.y, 0, 0, wa.hue, 0.5);
          break;                                           // one at a time
        }
      }
      if (wa.held) { wa.born += dt; }        // it does not age in your hand
      if (t - wa.born > wa.life || wa.fed >= wa.feeds) {
        // once it is spent it fades out over the next couple of seconds
        if (wa.fed >= wa.feeds && t - wa.born < wa.life - 3) {
          wa.born = t - (wa.life - 2.4);
          continue;
        }
        // anyone still on their way gives up on it
        for (var j = 0; j < creatures.length; j++) {
          if (creatures[j].want === wa) { creatures[j].want = null; }
        }
        WANTS.splice(i, 1);
      }
    }

    /* Who sets off. Rare per creature per second, weighted by what it is,
       and capped so a place never draws a crowd - three at a time means
       you can follow any one of them across the screen. */
    if (WANTS.length && Math.random() < dt * 0.55) {
      var wa2 = WANTS[(Math.random() * WANTS.length) | 0];
      if (wantLevel(wa2, t) > 0.5) {
        var going = 0, k;
        for (k = 0; k < creatures.length; k++) if (creatures[k].want === wa2) going++;
        if (going < 3) {
          var pick2 = null, best = 0;
          for (k = 0; k < creatures.length; k++) {
            var c = creatures[k];
