          if (!big2 || f2.lobes[q].s > big2.s) big2 = f2.lobes[q];
        if (big2) {
          pt = proj(f2.lon + rot + big2.dl * 0.7, f2.lat + big2.dt * 0.7, R);
          if (pt) {
            g.globalAlpha = 0.55 * f2.k * pt.edge;
            g.fillStyle = hsl(lh2, 44, 60);
            g.beginPath();
            g.ellipse(pt.x, pt.y, big2.s * R * pt.n * 0.5, big2.s * R * 0.5, 0, 0, TAU);
            g.fill();
          }
        }
      }
      /* Ice at the poles. The one surface feature that is a single big shape
         rather than a scatter of small ones, which is precisely why it is worth
         having on something this size: it still reads when everything else has
         gone to texture, and a bright cap top and bottom is about the strongest
         "this is a planet" cue there is. Fixed to the disc rather than carried
         round by the rotation, because that is what a pole does. */
      if (c.ptype === 0) {
        /* Three nested ellipses rather than one. A single flat ellipse with a
           hard edge reads as a grey bar painted across the top of the ball; a
           stack that narrows and brightens as it approaches the pole has the
           gradient that ice actually has, and the softest ring hides the edge
           that gave the bar away. */
        g.fillStyle = hsl(hue + 150, 20, 92);
        for (var ic = 0; ic < 3; ic++) {
          var iw = 0.62 - ic * 0.15, ih = 0.23 - ic * 0.055;
          g.globalAlpha = 0.16 + ic * 0.14;
          g.beginPath(); g.ellipse(R, R * (0.02 + ih * 0.5), R * iw, R * ih, 0, 0, TAU); g.fill();
          g.beginPath(); g.ellipse(R, R * (1.98 - ih * 0.5), R * iw, R * ih, 0, 0, TAU); g.fill();
        }
      }
      g.globalAlpha = 1;
    }

    // ---- weather, turning faster than the ground -------------------------
    if (c.cloud) {
      /* Thin white streaks, not grey pillows. At the first size and alpha the
         weather was the most solid thing on the planet and read as damage. */
      for (i = 0; i < c.cloud.length; i++) {
        var cf = c.cloud[i];
        for (q = 0; q < 5; q++) {
          pt = proj(cf.lon + rot * 1.22 + q * 0.13, cf.lat + Math.sin(q + cf.wob) * 0.07, R);
          if (!pt) continue;
          g.globalAlpha = 0.2 * pt.edge;
          g.fillStyle = 'hsl(0,0%,97%)';
          g.beginPath();
          g.ellipse(pt.x, pt.y, cf.size * R * 0.3 * pt.n, cf.size * R * 0.1, 0, 0, TAU);
          g.fill();
        }
      }
      g.globalAlpha = 1;
    }

    /* ---- night ----------------------------------------------------------
       Multiplied over the finished surface, so the far side goes dark without
       any of it having to be drawn dark. This is the step that is simply not
       available in the additive buffer, and it is most of what makes the thing
       read as a sphere lit from somewhere rather than a flat coloured disc. */
    g.globalCompositeOperation = 'multiply';
    var sh = g.createRadialGradient(R + lx * R * 0.62, R + ly * R * 0.62, R * 0.05,
                                    R + lx * R * 0.2, R + ly * R * 0.2, R * 1.55);
    sh.addColorStop(0, '#ffffff');
    sh.addColorStop(0.32, '#eef1f6');
    sh.addColorStop(0.58, '#7d8391');
    sh.addColorStop(0.82, '#2b3047');
    sh.addColorStop(1, '#0a0d16');
    g.fillStyle = sh;
    g.fillRect(0, 0, R * 2, R * 2);

    // ---- and the air, catching the light round the lit limb --------------
    /* Air catching the light, and only where the light is. A radial gradient
       centred on the middle rims the whole circle evenly, which reads as a
       glowing hoop rather than as an atmosphere - so this is an arc, drawn
       round the lit limb and feathered off towards the terminator. */
    g.globalCompositeOperation = 'lighter';
    var la = Math.atan2(ly, lx);
    g.lineWidth = R * 0.13;
    for (var ri = 0; ri < 3; ri++) {
      g.strokeStyle = hsl(hue + 34 + ri * 20, 92, 58 - ri * 8);
      g.globalAlpha = (0.3 - ri * 0.08);
      g.beginPath();
      g.arc(R, R, R - R * 0.055 - ri * R * 0.05,
            la - 1.32 + ri * 0.1, la + 1.32 - ri * 0.1);
      g.stroke();
    }
    g.globalAlpha = 1;
    g.restore();

    /* A soft edge, applied to the whole canvas once the clip is off. A clipped
       path alone leaves visible stair-steps round the limb - the clip is a hard
       in-or-out test - and on a disc this size the jaggies are obvious. Keeping
       the alpha at full almost all the way out and then falling off over the
       last couple of percent both anti-aliases the edge and gives the limb the
       hint of softness that an atmosphere ought to have. */
    g.globalCompositeOperation = 'destination-in';
    var mask = g.createRadialGradient(R, R, R * 0.9, R, R, R);
    mask.addColorStop(0, 'rgba(0,0,0,1)');
    mask.addColorStop(0.86, 'rgba(0,0,0,1)');
    mask.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = mask;
    g.fillRect(0, 0, R * 2, R * 2);
    g.globalCompositeOperation = 'source-over';
    return c.gcv;
  }


  /* The BEACH BALL used to live here, and it is gone.
     ------------------------------------------------------------
     It arrived as an accident worth keeping - a planet being knocked about by
     things falling into it looked exactly like a ball being kept up in the air
     - and it was good on its own terms. It was also the one object in here that
     came from somewhere else: a hard shiny thing with painted panels and a
     specular highlight, bouncing, in a room that is otherwise light suspended
     in deep water. Everything else reads as one kind of place; the ball had to
     be read as a toy that had been dropped into it.

     Removed rather than hidden, along with its spawner, its physics, its
     collision, its painted canvas and the kick a swipe used to give it. What it
     was really contributing - something to look forward to, arriving now and
     then - the foam already does, in the app's own language. */

  /* ============================================================
     BUBBLES
     ------------------------------------------------------------
     Foam that arrives on the glass, and can be popped as fast as a hand can
     move. Everything else in here is light in a deep space; this is the one
     thing that is meant to look like it is ON the screen, right at the front,
     between the child and the rest of it.

     What makes a soap film look like a soap film, and none of it is the shape:

       it is nearly invisible face on and bright at the rim, because a thin
         film reflects almost nothing straight through and almost everything
         at a grazing angle;
       the rim runs through the whole spectrum in bands, because the film is
         wedge shaped and different thicknesses cancel different wavelengths;
       those bands DRIFT, because the soap is still flowing downwards;
       there is one hard white highlight and a second, fainter one opposite,
         which is the light source seen through the far wall of the bubble.

     The bands are baked once into a set of sprites and then simply rotated per
     bubble per frame, which costs nothing and is what lets there be forty of
     them at once. The highlights are drawn live on top, because they must stay
     put while the film turns underneath them - a highlight that rotates with
     the bands looks like a painted dot and the whole illusion goes.

     Popping is the point of the thing. It has to be instant, it has to be
     repeatable as fast as a child can tap, and it must never once fail to
     answer. Bubbles do not queue for a voice like the rest of the app does.
     ============================================================ */
  var BUBBLES = [];
  var BUBSPR = [];
  var BUBGLOSS = null;
  var BUB_N = 12;                    // baked film variants
  var BUB_R = 96;                    // baked at this radius
  var bubNext = 26;
  /* Measured at fifty four on screen: thirteen milliseconds a frame just for
     the foam, which is most of the budget for one feature. Two sprite draws
     each, and they are the only thing in the app drawn at full resolution to
     the screen rather than into the half-size trail. Thirty is still a lapful
     of bubbles and leaves the frame alone. */
  var BUB_MAX = 32;

  function bakeBubbles() {
    for (var v = 0; v < BUB_N; v++) {
      var cv = document.createElement('canvas');
      cv.width = cv.height = BUB_R * 2;
      var g = cv.getContext('2d');
      var R = BUB_R, base = (v / BUB_N) * 360;

      /* The film. Transparent through the middle, then the spectrum stacked up
         in the last quarter where the sightline goes glancing through it. */
      var grd = g.createRadialGradient(R, R, R * 0.05, R, R, R);
      grd.addColorStop(0.00, 'hsla(' + base + ',100%,60%,0)');
      grd.addColorStop(0.52, 'hsla(' + ((base + 30) % 360) + ',100%,62%,0.025)');
      grd.addColorStop(0.64, 'hsla(' + ((base + 70) % 360) + ',100%,60%,0.09)');
      /* TWO turns of the wheel across the rim, not one. A soap film is a wedge,
         and the spectrum repeats as it thickens - the doubled band is the thing
         the eye recognises as "bubble" rather than "ring with a gradient on it".
         Deep and saturated, too: the first pass was all pastels, and pastels
         read as a plastic hoop. */
      var bands = 13;
      for (var b = 0; b < bands; b++) {
        var f = b / (bands - 1);
        var u = 0.66 + f * 0.315;
        var h = (base + 20 + f * 720) % 360;             // two full cycles
        var a = 0.10 + f * f * 0.46;
        var li = 52 + Math.sin(f * Math.PI * 2) * 10;
        grd.addColorStop(u, 'hsla(' + h.toFixed(0) + ',100%,' + li.toFixed(0) + '%,' +
                            a.toFixed(3) + ')');
      }
      grd.addColorStop(0.988, 'hsla(' + ((base + 200) % 360) + ',70%,94%,0.70)');
      grd.addColorStop(1.00, 'hsla(' + ((base + 200) % 360) + ',70%,94%,0)');
      g.fillStyle = grd;
      g.fillRect(0, 0, R * 2, R * 2);

      /* And a second, tighter set inside it - the far wall of the bubble seen
         through the near one. Faint, but it is the difference between a ring
         and something with an inside. */
      var in2 = g.createRadialGradient(R, R, R * 0.26, R, R, R * 0.63);
      in2.addColorStop(0, 'hsla(' + ((base + 150) % 360) + ',100%,60%,0)');
      in2.addColorStop(0.62, 'hsla(' + ((base + 180) % 360) + ',100%,62%,0.09)');
      in2.addColorStop(0.86, 'hsla(' + ((base + 250) % 360) + ',100%,64%,0.05)');
      in2.addColorStop(1, 'hsla(' + ((base + 300) % 360) + ',100%,66%,0)');
      g.fillStyle = in2;
      g.fillRect(0, 0, R * 2, R * 2);

      BUBSPR.push(cv);
    }

    /* The highlights, baked once into their own sprite and drawn UNROTATED over
       the film. They were being built live as two radial gradients per bubble
       per frame, which measured at nearly a third of a millisecond each - fifty
       bubbles cost eighteen milliseconds a frame and the whole thing dropped
       under sixty. Creating a gradient is expensive; drawing an image is
       nearly free. Two sprites, one turning and one not, gets the look and the
       speed at the same time. */
    var gl = document.createElement('canvas');
    gl.width = gl.height = BUB_R * 2;
    var gg = gl.getContext('2d');
    var Rg = BUB_R;
    var hx = Rg - Rg * 0.42, hy = Rg - Rg * 0.44;
    var hgr = gg.createRadialGradient(hx, hy, 0, hx, hy, Rg * 0.3);
    hgr.addColorStop(0, 'rgba(255,255,255,0.85)');
    hgr.addColorStop(0.45, 'rgba(255,255,255,0.18)');
    hgr.addColorStop(1, 'rgba(255,255,255,0)');
    gg.fillStyle = hgr;
    gg.beginPath(); gg.arc(hx, hy, Rg * 0.3, 0, TAU); gg.fill();
    var sx3 = Rg + Rg * 0.34, sy3 = Rg + Rg * 0.4;
    var sgr = gg.createRadialGradient(sx3, sy3, 0, sx3, sy3, Rg * 0.34);
    sgr.addColorStop(0, 'rgba(255,255,255,0.2)');
    sgr.addColorStop(1, 'rgba(255,255,255,0)');
    gg.fillStyle = sgr;
    gg.beginPath(); gg.arc(sx3, sy3, Rg * 0.34, 0, TAU); gg.fill();
    BUBGLOSS = gl;
  }

  function bubbleAt(x, y) {
    for (var i = 0; i < BUBBLES.length; i++) {
      var b = BUBBLES[i];
      if (b.pop > 0 || b.born < 0) continue;
      var dx = b.x - x, dy = b.y - y, rr = b.r + 6;
      if (dx * dx + dy * dy <= rr * rr) return b;
    }
    return null;
  }

  function addBubble(x, y, r, hue, gen) {
    if (BUBBLES.length >= BUB_MAX) return null;
    var bb = {
      x: x, y: y, r: r, r0: r,
      vx: rnd(-14, 14), vy: rnd(-16, 6),
      spr: (Math.random() * BUB_N) | 0,
      rot: Math.random() * TAU,
      spin: rnd(-0.16, 0.16),
      wob: Math.random() * TAU,
      hue: hue,
      gen: gen || 0,
      born: 0,
      pop: 0,                          // >0 once it is bursting
      life: 26 + Math.random() * 34
    };
    BUBBLES.push(bb);
    return bb;
  }

  /* A raft. Bath foam rather than a drift of separate bubbles: a big one with
     smaller ones crowded round it and into the gaps, all touching. */
  function bubbleRaft(x, y, n) {
    var hue = world.hue + rnd(-40, 60);
    var big = 26 + Math.random() * 20;
    addBubble(x, y, big, hue, 0);
    var placed = [{ x: x, y: y, r: big }];
    for (var i = 0; i < n; i++) {
      var host = placed[(Math.random() * placed.length) | 0];
      var rr = Math.max(9, host.r * rnd(0.42, 0.86));
      var a = Math.random() * TAU;
      var d = (host.r + rr) * 0.92;      // just overlapping, like foam
      var nx = host.x + Math.cos(a) * d;
      var ny = host.y + Math.sin(a) * d;
      if (nx < 40 || nx > W - 40 || ny < 40 || ny > H - 40) continue;
      if (addBubble(nx, ny, rr, hue + rnd(-25, 25), 0)) {
        placed.push({ x: nx, y: ny, r: rr });
      }
    }
    return placed.length;
  }

  /* ---- foam is EARNED --------------------------------------------------
     A raft turning up on a timer is scenery. A raft turning up because of
     something you just did is a reward, and it teaches itself: it blooms where
     your hand was, so the connection between doing and getting is made without
     a word of explanation.

     Two ways in, and both matter for where this is meant to live:

       played for  -  the meter fills from the same interactions that feed the
                      room's warmth, and tips over into a raft at the last
                      place you touched. Deliberate acts - a wave let go, a
                      special move landed - pay a good deal more than a poke,
                      so making something happen brings the bubbles sooner.

       waited for  -  and if nobody touches it at all, one still drifts up
                      every few minutes, because a screen on a waiting room
                      wall has to be worth watching with your hands in your
                      lap. Much rarer than the earned kind.
     ------------------------------------------------------------------- */
  var bubEarn = 0;
  var bubAt = { x: -1, y: -1 };

  function earnBubbles(a, x, y) {
    if (BUBBLES.length > BUB_MAX * 0.62) return;
    bubEarn += a;
    if (x !== undefined) { bubAt.x = x; bubAt.y = y; }
    if (bubEarn < 1) return;
    bubEarn = 0;
    var px = bubAt.x, py = bubAt.y;
    if (px < 0) { px = rnd(160, Math.max(200, W - 160)); py = rnd(150, Math.max(200, H - 150)); }
    px = clamp(px, 90, Math.max(120, W - 90));
    py = clamp(py, 90, Math.max(120, H - 90));
    bubbleRaft(px, py, 4 + ((Math.random() * 7) | 0));
    // a breath of light where it came from, so it reads as having been given
    markMoment(px, py, world.hue + 60, 'foam');
  }

  function updateBubbleSpawn(dt, t) {
    // the slow one, for a room nobody is touching
    if (t >= bubNext) {
      bubNext = t + (150 + Math.random() * 130) * paceGap();
      if (BUBBLES.length < BUB_MAX * 0.4) {
        bubbleRaft(rnd(160, Math.max(200, W - 160)), rnd(150, Math.max(200, H - 150)),
                   4 + ((Math.random() * 6) | 0));
      }
    }
    // and what has been earned drains away slowly if play stops
    if (bubEarn > 0) bubEarn = Math.max(0, bubEarn - dt * 0.012);
  }

/* ---- the pop ---------------------------------------------------------
   Physically honest soap-bubble rupture:
   film tear → sudden release of the trapped air parcel.
   No oscillator, no resonance (Q always < 1). Size only opens the
   low-pass and deepens the sub-breath, so big bubbles are soft “phuh”
   and tiny ones are dry “tik”.  The ear hears a clean, addictive
   transient that begs to be repeated. */
  /* The bubbles' answer. Not a pop - see SHIMMER above for why chasing a
     realistic burst was the wrong brief five times running.

     Size chooses the note, low for big and high for small, off the same
     pentatonic everything else uses - so a raft going off under a sweeping
     hand is an arpeggio and can never be wrong. Small ones ring briefly and
     bright; big ones are longer, darker and quieter, which is the one way the
     ear reads size without anything having to sound heavy. */
  function popSound(bb) {
    if (!A.ok || !A.started) return;
    var u = clamp((bb.r - 8) / 44, 0, 1);              // 0 tiny, 1 big
    var step = Math.round((1 - u) * (NOTES.length - 2));
    var oct = bb.r > 30 ? 1 : (bb.r > 16 ? 2 : 4);
    var f = noteI(step) * oct * 0.5;
    /* A pop counts as the player's own doing, so it goes to the bus ahead of
       the scenery duck - which means a phrase has to be told about it here.
       Turned down rather than off: popping must always answer, even mid-tune. */
    var pq = now() < phraseUntil ? 0.34 : 1;
    mine(function () {
      shimmer(f, (0.030 + (1 - u) * 0.012) * pq, panOf(bb.x),
              0.55 + u * 0.75, 0.35 + (1 - u) * 0.5);
    });
  }

  function popBubble(bb, t, noSplit) {
    if (bb.pop > 0) return 0;
    /* A pop does nothing to anything else. It used to stir the liquid, and the
       press that caused it went on to poke whatever creature happened to be
       behind the bubble - so popping over a crowd set off a reaction every
       time and the pop itself was lost in it. Bubbles are on the glass; they
       are their own small world and they do not reach through it. */
    bb.pop = 0.0001;
    popSound(bb);

    /* Sometimes it does not simply go: it comes apart into a handful of smaller
       ones, and those may come apart again. Never below about nine pixels,
       which is where a bubble stops reading as a bubble. */
    /* Measured: at a sixty per cent chance of splitting, a hand sweeping right
       across the screen left as many bubbles behind as it took out, and the
       foam could never be cleared. Splitting is the fun of it, so it stays
       common - but it has to lose to a determined child. */
    var made = 0;
    if (!noSplit && bb.r > 15 && bb.gen < 3 && Math.random() < 0.42) {
      var n = 2 + ((Math.random() * 3) | 0);
      for (var i = 0; i < n; i++) {
        var a = (i / n) * TAU + Math.random() * 0.6;
        var rr = bb.r * rnd(0.32, 0.5);
        if (rr < 8) continue;
        var nb = addBubble(bb.x + Math.cos(a) * bb.r * 0.5,
                           bb.y + Math.sin(a) * bb.r * 0.5,
                           rr, bb.hue + rnd(-30, 30), bb.gen + 1);
        if (nb) {
          nb.vx = Math.cos(a) * rnd(50, 130);
          nb.vy = Math.sin(a) * rnd(50, 130);
          nb.born = -0.14;                 // a beat of swelling as it forms
          made++;
        }
      }
    }
    // and a scatter of droplets whichever way it went
    for (var q = 0; q < 7; q++) {
      var qa = Math.random() * TAU, qs = 60 + Math.random() * 200;
      emitSpark(bb.x, bb.y, Math.cos(qa) * qs, Math.sin(qa) * qs,
                bb.hue + rnd(-60, 60), 0.5);
    }
    return made;
  }

  /* Anything a finger touches, and anything the finger CROSSED since the last
     frame - a hand sweeping through foam must not skip bubbles between frames,
     which at speed is most of them. */
  function sweepBubbles(p, dt, t) {
    var px = p.x, py = p.y;
    var lx = p.bx === undefined ? px : p.bx;
    var ly = p.by === undefined ? py : p.by;
    p.bx = px; p.by = py;
    var sx = px - lx, sy = py - ly;
    var seg = sx * sx + sy * sy;
    var hit = 0;
    for (var i = 0; i < BUBBLES.length; i++) {
      var bb = BUBBLES[i];
      if (bb.pop > 0 || bb.born < 0) continue;
      var dx, dy;
      if (seg > 4) {
        // nearest point on the path the finger took this frame
        var u = ((bb.x - lx) * sx + (bb.y - ly) * sy) / seg;
        u = clamp(u, 0, 1);
        dx = bb.x - (lx + sx * u); dy = bb.y - (ly + sy * u);
      } else {
        dx = bb.x - px; dy = bb.y - py;
      }
      var rr = bb.r + 6;
      if (dx * dx + dy * dy <= rr * rr) { popBubble(bb, t); hit++; }
    }
    if (hit) p.popped = true;
    return hit;
  }

  function updateBubbles(dt, t) {
    var i, j;
    for (i = BUBBLES.length - 1; i >= 0; i--) {
      var b = BUBBLES[i];
      if (b.pop > 0) {
        b.pop += dt;
        if (b.pop > 0.34) BUBBLES.splice(i, 1);
        continue;
      }
      if (b.born < 0) { b.born += dt; continue; }
      b.born += dt;
      b.life -= dt;
      if (b.life <= 0) { popBubble(b, t); continue; }

      // drifting up and wandering, the way foam does
      b.vy -= 5 * dt;
      b.vx += Math.sin(t * 0.4 + b.wob) * 7 * dt;
      b.vx *= Math.pow(0.965, dt * 60);
      b.vy *= Math.pow(0.965, dt * 60);
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.rot += b.spin * dt;

      // the film breathing - surface tension never quite settles
      b.r = b.r0 * (1 + Math.sin(t * 1.6 + b.wob) * 0.035);

      // walls
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx) * 0.6; }
      if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx) * 0.6; }
      if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy) * 0.5; }
      if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy) * 0.5; }
    }

    /* And they hold each other off, just barely - foam sits in contact, so the
       push only starts once they are genuinely overlapping and it never quite
       separates them. */
    for (i = 0; i < BUBBLES.length; i++) {
      var a = BUBBLES[i];
      if (a.pop > 0) continue;
      for (j = i + 1; j < BUBBLES.length; j++) {
        var c = BUBBLES[j];
        if (c.pop > 0) continue;
        var dx = c.x - a.x, dy = c.y - a.y;
        var d2 = dx * dx + dy * dy;
        var want = (a.r + c.r) * 0.86;
        if (d2 >= want * want || d2 < 0.01) continue;
        var d = Math.sqrt(d2);
        var push = (want - d) / want * 60;
        var ux = dx / d, uy = dy / d;
        a.vx -= ux * push * dt; a.vy -= uy * push * dt;
        c.vx += ux * push * dt; c.vy += uy * push * dt;
      }
    }
  }

  /* Drawn last of everything, straight onto the screen, above even the bloom -
     they are on the glass, not in the world. */
  function drawBubbles(t) {
    if (!BUBBLES.length) return;
    ctx.globalCompositeOperation = 'source-over';
    for (var i = 0; i < BUBBLES.length; i++) {
      var b = BUBBLES[i];
      var r = b.r, al = 1;
      if (b.born < 0) { continue; }
      if (b.pop > 0) {
        /* Gone in a third of a second: the film flies outwards and thins to
           nothing. Fast, because the next one has to be poppable immediately. */
        var k = b.pop / 0.34;
        r = b.r * (1 + k * 0.85);
        al = (1 - k) * (1 - k);
      } else if (b.born < 0.3) {
        var kb = b.born / 0.3;
        r = b.r * (0.55 + 0.45 * kb);
        al = kb;
      }
      var px = b.x * DPR, py = b.y * DPR, pr = r * DPR;
      ctx.globalAlpha = al;
      /* Below about fourteen pixels the film's bands are smaller than a pixel
         and there is nothing to see turning, so the transform is skipped
         entirely - and a plain drawImage is a good deal cheaper than a
         save, translate, rotate and restore around one. */
      if (r < 14) {
        ctx.drawImage(BUBSPR[b.spr], px - pr, py - pr, pr * 2, pr * 2);
      } else {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(b.rot);
        ctx.drawImage(BUBSPR[b.spr], -pr, -pr, pr * 2, pr * 2);
        ctx.restore();
      }

      if (b.pop > 0) {
        // the rupture: a bright thin ring running outwards
        ctx.globalAlpha = al * 0.7;
        ctx.strokeStyle = 'hsl(' + (((b.hue % 360) + 360) % 360) + ',90%,80%)';
        ctx.lineWidth = Math.max(1, 2.5 * DPR * (1 - b.pop / 0.34));
        ctx.beginPath();
        ctx.arc(px, py, pr, 0, TAU);
        ctx.stroke();
        continue;
      }

      /* The highlights, upright while the film turns underneath - the lamp,
         and the lamp again through the back of the bubble. One baked sprite,
         drawn without rotation; see the note where it is made. */
      if (r >= 11) {
        ctx.globalAlpha = al;
        ctx.drawImage(BUBGLOSS, px - pr, py - pr, pr * 2, pr * 2);
      }
    }
    ctx.globalAlpha = 1;
  }


  /* ============================================================
     PHRASES - a whole little piece for one tap
     ------------------------------------------------------------
     Tapping the canvas already plays the note of that place, and people find
     it and enjoy it. What it does not give them is anywhere to go: every tap
     is as good as every other, so there is nothing to be pleased about having
     played. This lays out a short phrase and hands the whole of it over for a
     single touch.

     The lovely accident that makes it work: pitch here is a pure function of
     WHERE. Scale degree comes from x and octave from the band of y, so a
     phrase does not have to be represented as anything - laying it out IS
     drawing it. Its shape on the screen is its melodic contour. A rising
     phrase climbs to the right, an arch really arches, and the tune is legible
     before a note of it has sounded.

     ---- notation ----
     The whole phrase is visible at once, and the notes say how they will be
     played, borrowing the one convention everybody has already absorbed
     without ever being taught it:

        hollow, large   a long note, held
        filled          an ordinary note
        filled + flag   a quick one, hurrying into the next

     Hollow-means-long is exactly the rule on a stave, and two of them side by
     side teaches it in a second. So the picture is not only the tune's shape,
     it is also its rhythm - and you can see the whole of what you are about to
     set off before you set it off.

     ---- and angular ----
     A diamond, because everything else in this app is round. The first version
     of these was a ring, and a ring among fifty glowing discs is still a disc:
     it got mistaken for a creature, tapped, and did nothing. Nothing else here
     has a corner. Round things live here; angular things are asking to be
     played.
     ============================================================ */
  var SEQS = [];
  var seqNext = 34;
  var BEAT = 0.34;
  var SEQ_LEAD = 0.2;            // the pause between the tap and the first note
  /* Back to level with everything else. Making it louder did work, and it was
     the wrong fix: a tune that has to shout over the room is not the same thing
     as a tune you can hear. What was actually wrong is below. */
  var LEAD_GAIN = 1;
  var phraseUntil = -99;

  /* ---- a note's colour comes from its PITCH ----------------------------
     A fifth of the colour wheel per step of the scale, so every note has its
     own colour and the same note is always the same colour - which is the only
     mapping here that is worth calling logic rather than decoration. Two
     things fall out of it for free:

       a phrase's colours sweep as its pitch does, so the line of diamonds is
         a gradient as well as a contour - the tune's shape twice over;
       and the ripple a note lets go when it sounds is its own colour, so
         playing a phrase paints it.

     Deliberately NOT tied to the drifting palette. Everything else in the room
     wanders with it, and a note that changed colour depending on the hour would
     have no logic left in it. The octave nudges the hue a little so a high one
     is not mistaken for its own low neighbour. */
  function noteHue(deg, band) {
    return norm360((deg % 5) * 72 + 14 + band * 15);
  }

  /* Melody by CONTOUR rather than by dice. A random walk on a pentatonic is
     inoffensive and instantly forgettable; giving it a shape to follow - climb,
     fall, arch, a question and its answer - is most of the difference between
     notes in a row and a phrase. Steps are small by default with the odd leap,
     and it comes home near where it set out. */
  function makeMelody() {
    for (var tryN = 0; tryN < 4; tryN++) {
      var m = melodyOnce();
      // a phrase with no range draws as a vertical stack and sounds like one
      // note repeated - measured at one in forty, so it is worth a second go
      var lo2 = Math.min.apply(null, m), hi2 = Math.max.apply(null, m);
      if (hi2 - lo2 >= 3) return m;
    }
    return m;
  }

  function melodyOnce() {
    var top = NOTES.length - 1;
    var shape = pick(['arch', 'valley', 'rise', 'fall', 'wave', 'call']);
    var n = 7 + ((Math.random() * 6) | 0);            // seven to twelve
    var lo = 3, hi = Math.max(6, top - 3);
    /* Start where the shape has somewhere to go. A falling phrase that begins
       at the bottom of the range spends its whole length pinned against the
       floor by the clamp, which is how the flat ones happened - the contour was
       fine, it just had no room to express it. */
    var span = hi - lo;
    var start;
    if (shape === 'rise') start = lo + ((Math.random() * span * 0.35) | 0);
    else if (shape === 'fall') start = hi - ((Math.random() * span * 0.35) | 0);
    else start = lo + ((span * 0.3) | 0) + ((Math.random() * span * 0.4) | 0);
    start = clamp(start, lo, hi);
    var deg = start, out = [];
    for (var i = 0; i < n; i++) {
      var u = n > 1 ? i / (n - 1) : 0, bias = 0;
      if (shape === 'arch') bias = Math.cos(u * Math.PI) * -2.2;
      else if (shape === 'valley') bias = Math.cos(u * Math.PI) * 2.2;
      else if (shape === 'rise') bias = 1.5;
      else if (shape === 'fall') bias = -1.5;
      else if (shape === 'wave') bias = Math.sin(u * Math.PI * 2) * 2;
      else bias = u < 0.5 ? 1.6 : -1.8;               // call, and its answer
      var step = Math.round(bias + rnd(-1.1, 1.1));
      if (Math.abs(step) > 3) step = step > 0 ? 3 : -3;
      if (i === 0) step = 0;
      if (i > 0 && Math.random() < 0.14) step += (step >= 0 ? 2 : -2);
      deg = clamp(deg + step, lo, hi);
      out.push(deg);
    }
    out[out.length - 1] = clamp(start + (Math.random() < 0.5 ? 0 : 4), lo, hi);
    return out;
  }

  /* Rhythm in bars rather than note by note. A run of quick ones followed by
     something held is a figure; quick and long shuffled at random is a
     stumble. Each little group is chosen whole. */
  function makeRhythm(n) {
    var cells = [[1], [1, 1], [0.5, 0.5], [0.5, 0.5, 1], [2], [1, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]];
    var out = [];
    while (out.length < n) {
      var c = pick(cells);
      for (var i = 0; i < c.length && out.length < n; i++) out.push(c[i]);
    }
    out[n - 1] = 2;                                    // and it lands on a long one
    return out;
  }

  function makeSequence(t) {
    var degs = makeMelody();
    var beats = makeRhythm(degs.length);
    /* One band for the whole phrase most of the time, so it reads as a single
       line drawn across the screen. Now and then it lifts an octave part way
       through, which is the one moment a phrase gets to open out. */
    var band = Math.random() < 0.5 ? 1 : (Math.random() < 0.5 ? 0 : 2);
    var liftAt = Math.random() < 0.3 ? 2 + ((Math.random() * (degs.length - 3)) | 0) : -1;

    var notes = [], i, at = 0;
    for (i = 0; i < degs.length; i++) {
      var b = (liftAt >= 0 && i >= liftAt) ? clamp(band + 1, 0, 2) : band;
      var lowY = b === 2 ? 0.05 : (b === 1 ? 0.38 : 0.70);
      var hiY = b === 2 ? 0.27 : (b === 1 ? 0.61 : 0.92);
      notes.push({
        deg: degs[i], beats: beats[i], at: at, hue: noteHue(degs[i], b),
        x: clamp(degs[i] / Math.max(1, NOTES.length - 1) * W, 52, Math.max(70, W - 52)),
        y: clamp((lowY + Math.random() * (hiY - lowY)) * H, 52, Math.max(70, H - 52)),
        gone: 0, born: -i * 0.05
      });
      at += beats[i] * BEAT;
    }

    /* No sequence colour any more. Each note takes its own from its pitch, so
       there is nothing left to keep apart - and a phrase in one flat colour was
       throwing away the most useful thing the layout had to say. */
    SEQS.push({ notes: notes, t0: t, span: at, next: 0, auto: false,
                style: SEQS.length ? 1 : 0, playing: -1, done: 0, fade: 0 });
  }

  function updateSeqs(dt, t) {
    var i, j;
    for (i = SEQS.length - 1; i >= 0; i--) {
      var sq = SEQS[i];
      for (j = 0; j < sq.notes.length; j++) {
        var nt = sq.notes[j];
        if (nt.born < 1) nt.born = Math.min(1, nt.born + dt * 1.6);
        if (nt.gone > 0) nt.gone += dt;
      }
      if (sq.done) {
        sq.fade += dt;
        if (sq.fade > 2.4) SEQS.splice(i, 1);
        continue;
      }
      /* Its own clock. Any note whose moment has arrived sounds now, and more
         than one in a frame if the frame was slow. */
      if (sq.playing >= 0) {
        while (sq.next < sq.notes.length &&
               t - sq.playing >= sq.notes[sq.next].at) {
          var nn2 = sq.notes[sq.next];
          sq.next++;
          // a long note is leaned on a little, which is where phrasing lives
          // a long note is leaned on a little, which is where phrasing lives
          strikeNote(sq, nn2, nn2.beats >= 2 ? 0.85 : 0.68);
        }
      }
      // running: it ends a beat after the last note has sounded
      if (sq.playing >= 0 && t >= sq.playing && t - sq.playing > sq.span + 1.1) {
        sq.done = 1;
        finishSeq(sq, t);
        continue;
      }
      /* An untouched phrase plays ITSELF rather than fading away unheard.
         Somebody laid it out; letting it expire in silence throws away the one
         thing it was for. And on a wall in a waiting room, where nobody may
         touch the screen all afternoon, it means the room quietly plays little
         tunes to itself - which is a better thing for that screen to be doing
         than showing an invitation nobody took.

         Only ever one at a time. Two phrases going off together is mud, and
         these are supposed to be the clearest sound in the app - so if another
         is already sounding, this one waits its turn. */
      if (sq.playing < 0 && t - sq.t0 > 80) {
        var soundingNow = false;
        for (var b2 = 0; b2 < SEQS.length; b2++) {
          if (SEQS[b2] !== sq && !SEQS[b2].done && SEQS[b2].playing >= 0) soundingNow = true;
        }
        if (!soundingNow) playSeq(sq, t, true);
      }
    }
    if (t >= seqNext) {
      /* Much longer gaps when nobody is there. A child at the screen wants
         these often - that is the point of them - but an empty room does not,
         and now that an untouched phrase plays itself the idle rate is HEARD
         rather than just seen. Somebody sitting in a waiting room not looking
         at the screen should get a little tune now and then, not a recital.

         Between three and seven minutes at rest, averaging about five; a
         child actually playing still gets one every thirty to sixty seconds. */
      /* WATCHING IS NOT LEAVING.
         ------------------------------------------------------------
         world.idle counts from the last frame with a finger actually ON the
         glass, and it was fed straight into the multiplier, so pausing for
         twenty seconds to watch what you had just made already tripled the
         gap: measured at the default dial, thirty to sixty-four seconds became
         ninety-nine to two hundred and twelve. Almost nobody holds a finger
         down continuously, so almost nobody ever got the rate this was written
         to give them, and the phrases quietly thinned out for everyone who
         was actually enjoying it.

         There is now a grace period. Touch anything in the last twenty seconds
         and you count as here; the long gaps only arrive after a minute and a
         half of nothing at all, which is the empty room this was guarding
         against in the first place. */
      var quiet = clamp((world.idle - 20) / 60, 0, 1);
      seqNext = t + (30 + Math.random() * 34) * (1 + quiet * 5.2) * paceGap();
      var live = 0;
      for (i = 0; i < SEQS.length; i++) if (!SEQS[i].done) live++;
      // usually one out at a time; now and then a second, to make a choice of
      if (live === 0 || (live === 1 && Math.random() < 0.3)) makeSequence(t);
    }
  }

  function finishSeq(sq, t) {
    var last = sq.notes[sq.notes.length - 1];
    markMoment(last.x, last.y, last.hue, 'phrase');
    for (var q = 0; q < 26; q++) {
      var a = Math.random() * TAU, sp = 70 + Math.random() * 220;
      emitSpark(last.x, last.y, Math.cos(a) * sp, Math.sin(a) * sp,
                last.hue + rnd(-40, 40), 0.9);
    }
    if (!sq.auto) {
      earnBubbles(0.6, last.x, last.y);      // a piece PLAYED earns some foam
      feedWarmth(0.06);
    }
  }

  /* ANY note of ANY live sequence, purely so that a touch landing on one can
     be CLAIMED. It used to be only the playable head that claimed a press, so
     a tap on the second diamond, or on the head of something already playing,
     went straight through and prodded whatever creature happened to be behind
     or beside it - and since the phrase is spread across the screen, there is
     usually something. A diamond swallows its own tap now, whichever one it is
     and whatever the sequence is doing. */
  function anyNoteAt(x, y) {
    for (var i = 0; i < SEQS.length; i++) {
      var sq = SEQS[i];
      if (sq.done) continue;
      for (var j = 0; j < sq.notes.length; j++) {
        var nt = sq.notes[j];
        var dx = nt.x - x, dy = nt.y - y;
        // generous on the head, tight enough elsewhere not to wall off the room
        var rr = j === 0 ? 80 : 52;
        if (dx * dx + dy * dy < rr * rr) return sq;
      }
    }
    return null;
  }

  /* And which tap actually SETS ONE OFF. Any of its notes will do - a child
     aiming at a line of diamonds should not have to work out which end is the
     handle, and one tap plays the whole piece either way. */
  function seqNoteAt(x, y) {
    var sq = anyNoteAt(x, y);
    return (sq && sq.playing < 0) ? sq : null;
  }

  function strikeNote(sq, nt, vel) {
    nt.gone = 0.0001;
    // the mark and the sound must not be able to disagree - see asNote
    asNote(function () { playTouchNote(nt.x, nt.y, vel); });
    for (var q = 0; q < 12; q++) {
      var a = Math.random() * TAU, sp = 40 + Math.random() * 160;
      emitSpark(nt.x, nt.y, Math.cos(a) * sp, Math.sin(a) * sp,
                nt.hue + rnd(-30, 30), 0.7);
    }
  }

  /* One touch, and the whole piece plays itself out in time. Each note is the
     same note it would have been under a finger - what is given is the timing,
     which is the part a child cannot supply and the part that makes it music
     rather than a row of taps. */
  function playSeq(sq, t, auto) {
    if (sq.playing >= 0 || sq.done) return;
    /* A short lead-in before the first note, so the room is ALREADY down when
       it arrives rather than getting out of the way underneath it. A duck takes
       a moment to travel even at a twentieth of a second, and the first note is
       the one that has to land cleanly - it is the one that tells you something
       has started. A fifth of a second reads as nothing at the start of a piece
       of music, and it is the difference between hearing the tune and hearing
       the tune fade in behind whatever was already going on. */
    sq.playing = t + SEQ_LEAD;
    sq.next = 0;                       // note zero fires off the same clock
    sq.auto = !!auto;
    /* Everything else gets out of the way until it has finished. A phrase is
       four or five seconds of deliberate music and the room is capable of
       fifteen voices of scenery at once - without this the tune simply
       disappears underneath whatever the creatures happen to be doing. */
    // the room is told to stand down NOW, before any of it sounds
    phraseUntil = t + SEQ_LEAD + sq.span + 0.9;
    /* The rest are NOT queued through soon(). That queue is shared with forty
       other call sites and it drops anything arriving once sixty are waiting -
       silently, with no signal - so on a busy moment a phrase would sound its
       first note and quietly lose every one after it. Which is exactly the
       report: tapped it, heard nothing.

       It does not need a queue anyway. Every note already carries its offset
       and updateSeqs already runs every frame, so the phrase simply keeps its
       own time. Nothing can starve it, and if a frame runs long it catches up
       rather than falling behind. */
    /* One that played itself pays nothing into the foam. That meter is meant
       to record what the child did, and crediting them for a phrase they never
       touched would quietly turn the reward into a clock. */
    if (!auto) {
      feedWarmth(0.03);
      earnBubbles(0.2, sq.notes[0].x, sq.notes[0].y);
    }
  }

  /* A diamond, stroked. Slightly taller than wide, the way a note head sits on
     a stave. Hollow for a long note and filled for a short one - the rule from
     real notation, which nobody has to be told. */
  function diamondNote(cx, cy, r, hue, a, lw, fill, flag) {
    if (a <= 0.004) return;
    var w = r * 0.74, hh = r;
    tctx.save();
    tctx.translate(cx, cy);
    tctx.strokeStyle = hsl(hue, 92, 66);
    tctx.lineJoin = 'round';
    tctx.beginPath();
    tctx.moveTo(0, -hh); tctx.lineTo(w, 0); tctx.lineTo(0, hh); tctx.lineTo(-w, 0);
    tctx.closePath();
    tctx.globalAlpha = a * 0.4;
    tctx.lineWidth = lw * 3.4;
    tctx.stroke();
    tctx.globalAlpha = a;
    tctx.lineWidth = lw;
    tctx.stroke();
    if (fill) {
      tctx.fillStyle = hsl(hue + 20, 90, 62);
      tctx.globalAlpha = a * 0.8;
      tctx.fill();
    }
    /* The flag on a quick one, exactly where a quaver wears it. */
    if (flag) {
      tctx.globalAlpha = a;
      tctx.lineWidth = lw;
      tctx.beginPath();
      tctx.moveTo(w * 0.5, -hh * 0.5);
      tctx.quadraticCurveTo(w * 2.1, -hh * 1.1, w * 1.5, -hh * 1.9);
      tctx.stroke();
    }
    tctx.globalAlpha = 1;
    tctx.restore();
  }

  function drawSeqs(t, awake) {
    var br = 0.4 + awake * 0.6;
    for (var i = 0; i < SEQS.length; i++) {
      var sq = SEQS[i];
      var sf = sq.done ? Math.max(0, 1 - sq.fade / 2.4) : 1;
      if (sf <= 0.01) continue;
      var running = sq.playing >= 0;

      /* The line through the whole phrase, drawn first and faintly. It is the
         tune's shape, and it is what turns a scatter of marks into something
         that plainly goes somewhere. */
      for (var j = 0; j + 1 < sq.notes.length; j++) {
        var a1 = sq.notes[j], b1 = sq.notes[j + 1];
        if (a1.gone > 0.5) continue;
        var steps = 7;
        for (var d2 = 1; d2 < steps; d2++) {
          var ud = d2 / steps;
          // and the thread between two notes runs from one colour to the other
          blob(tctx, a1.x + (b1.x - a1.x) * ud, a1.y + (b1.y - a1.y) * ud,
               2.6, a1.hue + wrapDeg(b1.hue - a1.hue) * ud,
               0.035 * clamp(a1.born, 0, 1) * sf * br);
        }
      }

      for (j = 0; j < sq.notes.length; j++) {
        var nt = sq.notes[j];
        var app = clamp(nt.born, 0, 1);
        if (app <= 0) continue;

        // ---- sounded: it goes out in a soft ring ----
        if (nt.gone > 0) {
          var g = nt.gone / 0.65;
          if (g >= 1) continue;
          var ge = 1 - (1 - g) * (1 - g);
          wave(tctx, nt.x, nt.y, 12 + ge * 82, nt.hue, 0.26 * (1 - g) * sf);
          blob(tctx, nt.x, nt.y, 17 * (1 - g), nt.hue + 25, 0.24 * (1 - g) * sf);
          continue;
        }

        var head = j === 0 && !running;
        var pulse = 0.5 + 0.5 * Math.sin(t * 1.9);
        // size says duration too: a long note is a bigger mark
        var rad = (nt.beats >= 2 ? 17 : (nt.beats >= 1 ? 13 : 10.5))
                  * (head ? 1.22 + pulse * 0.12 : 1);
        var al = (head ? 0.44 : 0.19) * app * sf * br;

        diamondNote(nt.x, nt.y, rad, nt.hue, al,
                    head ? 2.6 : 1.7,
                    nt.beats < 2,               // hollow only for the long ones
                    nt.beats < 1);              // and a flag on the quick ones
        blob(tctx, nt.x, nt.y, rad * 1.6, nt.hue - 14, al * 0.26);

        /* Two phrases at once are told apart by colour and by this: the second
           carries a ring around its head. Colour alone is not enough when the
           palette itself drifts. */
        if (sq.style === 1 && j === 0) {
          wave(tctx, nt.x, nt.y, rad * 2.5, nt.hue + 40, al * 0.55);
        }

        if (head) {
          /* Rings drawing INWARDS on the one note you may touch. Everything in
             this app that expands is a thing that has happened; only a wind-up
             contracts, and it already means "press here". Borrowing it means
             the invitation needs no explaining. */
          for (var r2 = 0; r2 < 2; r2++) {
            var ph = (t * 0.7 + r2 * 0.5) % 1;
            wave(tctx, nt.x, nt.y, (1 - ph) * 64 + rad,
                 nt.hue + ph * 40, 0.2 * ph * app * sf * br);
          }
        }
      }
    }
  }

  function swallow(big, sml, t) {
    /* The kick a planet used to take from every mouthful is what made it bounce
       like a beach ball. Kept, but a tenth of the size: enough to see it was
       hit, not enough to send it across the room. */
    var kbx = (sml.x - big.x), kby = (sml.y - big.y);
    var kbd = Math.hypot(kbx, kby) + 1;
    big.vx += (kbx / kbd) * 9; big.vy += (kby / kbd) * 9;
    /* It does NOT grow. Feeding a planet used to make it bigger, and since a
       planet is already the largest thing here, a few mouthfuls turned it into
       something that took over the screen. The reward is now entirely in the
       COLOUR: the swallowed thing's hue moves the whole world's palette and
       becomes a landmass, which is a change you can actually read on the
       surface, where growth was just encroachment.

       A very small amount of growth remains so that eating is not completely
       weightless, and it is capped near where it started. */
    /* It does not grow. Full stop. Even a third of a pixel a mouthful added up
       to something that took over the screen once the room got busy, and the
       colour is the better reward anyway - it is a change you can read on the
       surface, where growth was only ever encroachment. */
    // colour drifts towards what went in, by the shorter way round
    // and the colour shift is much stronger, since it is now the whole reward
    big.hueOff = norm360(big.hueOff + wrapDeg(sml.hueOff - big.hueOff) * 0.62);
    big.flare = Math.max(big.flare, 0.8);
    /* And it is written on the surface. Where it came down decides where the
       colour sits, so a planet ends up patterned by its own history rather
       than by anything random - eat enough green things on one side and that
       side is green. */
    /* What came down becomes land, at the longitude it arrived on. The colour
       it brought stays there and turns with the world, so after a while you can
       read what a planet has eaten off its surface. */
    if (!big.land) makeLand(big, 4, 1.5);
    maybeWorld(big);
    var ang = Math.atan2(sml.y - big.y, sml.x - big.x) - big.rot;
    /* Capped. Every mouthful used to add a continent for ever, so a planet
       that had eaten a dozen things was a mess of overlapping shapes - and the
       smaller the planet, the sooner that happens. */
    if (big.land.length > 6) big.land.shift();
    big.land.push(makeLandMass(ang, (Math.random() - 0.5) * 1.5,
                               wrapDeg(sml.hueOff - big.hueOff) * 0.6, 0));
    if (big.land.length > 11) big.land.shift();
    big.glowAdd = Math.max(big.glowAdd, 0.7);
    startReaction(big, 'pulse', 0.7, world.hue + big.hueOff, t, null);
    for (var i = 0; i < 14; i++) {
      emitSpark(sml.x, sml.y, (big.x - sml.x) * 0.6, (big.y - sml.y) * 0.6,
                world.hue + sml.hueOff, 0.6);
    }
    sml.vit = 0; sml.age = sml.span + 1;
    if (A.ok && A.started) {
      var b = clamp(Math.round((1 - big.y / Math.max(1, H)) * (NOTES.length - 1)), 0, NOTES.length - 1);
      ambient(function () { bowl(noteI(b) * 0.5, 0.024, panOf(big.x), 4); });
    }
  }

  function loseInterest(c) {
    c.with = null; c.stance = null; c.socT = 0;
    c.socCool = 5 + Math.random() * 14;    // will not re-attach immediately
    // and drifts off with its own idea of where to go
    var a = Math.random() * TAU;
    c.vx += Math.cos(a) * 90; c.vy += Math.sin(a) * 90;
    c.bias = a; c.biasTurn = rnd(-0.25, 0.25);
  }

  /* Several answers are about a PLACE rather than about another creature -
     dancing round the spot you touched, circling it, hanging about it. The
     stance system cannot express any of those, because it needs a host to be
     interested in and quietly does nothing without one. So a place gets its
     own small anchor. */
  /* Once in a while something decides to tag along behind a moving hand. Not
     held, not attached to another creature - just following, for a few seconds,
     until it thinks better of it. */
  function applyChase(c, dt) {
    var ch = c.chase;
    if (!ch) return;
    ch.t -= dt;
    if (ch.t <= 0 || !ch.p || !ch.p.down || !pointers.has(ch.p.id)) { c.chase = null; return; }
    var dx = ch.p.x - c.x, dy = ch.p.y - c.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    // keeps its distance rather than sticking to you
    if (d > 70) { c.vx += (dx / d) * 210 * dt; c.vy += (dy / d) * 210 * dt; }
    if (Math.random() < dt * 0.5) c.mood = Math.max(c.mood, 0.4);
  }

  function applySpot(c, dt) {
    var sp = c.spot;
    if (!sp) return;
    sp.t -= dt;
    if (sp.t <= 0) { c.spot = null; return; }
    c.orbA += dt * sp.rate;
    var tx, ty;
    if (sp.kind === 'dance') {
      // a figure of eight about the spot
      tx = sp.x + Math.sin(c.orbA) * sp.r;
      ty = sp.y + Math.sin(c.orbA * 2) * sp.r * 0.6;
    } else if (sp.kind === 'circle') {
      tx = sp.x + Math.cos(c.orbA) * sp.r;
      ty = sp.y + Math.sin(c.orbA) * sp.r;
    } else {
      tx = sp.x; ty = sp.y;
    }
    c.vx += (tx - c.x) * 3.4 * dt;
    c.vy += (ty - c.y) * 3.4 * dt;
  }

  function applyStance(c, dt) {
    if (!c.with || c.socT <= 0) { c.with = null; return; }
    var h = c.with;
    if (h.vit < 0.2) { c.with = null; return; }
    // interest can simply run out at any moment, mid-follow
    if (Math.random() < dt * 0.16) { loseInterest(c); return; }
    var dx = h.x - c.x, dy = h.y - c.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    switch (c.stance) {
      case 'follow':
        if (d > 90) { c.vx += (dx / d) * 190 * dt; c.vy += (dy / d) * 190 * dt; }
        break;
      case 'orbit':
        c.orbA += dt * 1.5;
        var want = 105 + Math.sin(c.orbA * 0.7) * 25;
        var tx = h.x + Math.cos(c.orbA) * want, ty = h.y + Math.sin(c.orbA) * want;
        c.vx += (tx - c.x) * 2.4 * dt; c.vy += (ty - c.y) * 2.4 * dt;
        break;
      case 'shy':
        if (d < 230) { c.vx -= (dx / d) * 170 * dt; c.vy -= (dy / d) * 170 * dt; }
        break;
      case 'mimic':
        // how eagerly it copies and how much it puts in are the same trait:
        // a reluctant one echoes late, faintly, or not at all
        if (h.react && !c.react && c.cool <= 0 &&
            Math.random() < dt * (0.35 + c.answer * 1.5)) {
          startReaction(c, h.react, 0.10 + c.answer * 0.62, world.hue, now(), null);
        }
        break;
      case 'dance': {
        // a figure of eight about where it was standing
        c.orbA += dt * 2.2;
        var fx = c.homeX + Math.sin(c.orbA) * 46;
        var fy = c.homeY + Math.sin(c.orbA * 2) * 30;
        c.vx += (fx - c.x) * 3.0 * dt; c.vy += (fy - c.y) * 3.0 * dt;
        break;
      }
      case 'jitter':
        c.vx += rnd(-1, 1) * 340 * dt; c.vy += rnd(-1, 1) * 340 * dt;
        break;
      case 'circle': {
        // tight circles on the spot, nothing to do with the newcomer
        c.orbA += dt * 3.1;
        var cxp = c.homeX + Math.cos(c.orbA) * 52;
        var cyp = c.homeY + Math.sin(c.orbA) * 52;
        c.vx += (cxp - c.x) * 3.4 * dt; c.vy += (cyp - c.y) * 3.4 * dt;
        break;
      }
      case 'bounce':
        c.bounceT -= dt;
        if (c.bounceT <= 0) {
          c.bounceT = 0.5 + Math.random() * 0.7;
          var sgn = Math.random() < 0.5 ? 1 : -1;
          c.vx += (dx / d) * 250 * sgn; c.vy += (dy / d) * 250 * sgn;
        }
        break;
      // 'ignore' does exactly that
    }
  }

  /* ============================================================
     BRINGING TWO TOGETHER
     ------------------------------------------------------------
     Whether a given pair will do anything is decided ONCE, the
     first time they come within noticing distance, and remembered.
     If the answer is yes, the other one starts telling you so: a
     brightening core and a ring that tightens the closer you bring
     them. If the answer is no it stays completely calm. That way
     the anticipation is a promise rather than a tease, and you
     learn to read which pairs are worth steering together.
     ============================================================ */
  /* Bringing two together can do any of these, and the variety is the point -
     but joining is the one the gesture looks like it should do, so it is in the
     bag three times and comes up about one go in five. Everything else stays a
     surprise. Repelling is left in deliberately: occasionally being refused is
     what makes the rest feel like the things themselves deciding. */
  var PAIR_OUTCOMES = [
    'merge', 'merge', 'merge',
    'twin', 'jiggle', 'burst', 'swap', 'spawn', 'repel',
    'tether', 'bloomPair', 'mirror', 'halo', 'absorb', 'whirl', 'pop'
  ];

  function updateAnticipation(held, dt, t) {
    /* Only a third of them are up for it, over a radius small enough that a
       handful are in range rather than half the room. It was two thirds over
       285px, which meant six or seven creatures signalling at once and the
       cue stopped meaning anything - the ones that DO signal need to stand out
       from a quiet background, so making them rarer is what makes them read. */
    var R = 240;
    for (var i = 0; i < creatures.length; i++) {
      var o = creatures[i];
      if (o === held || o.vit < 0.4 || o.held) continue;
      var dx = o.x - held.x, dy = o.y - held.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > R) { o.antic = Math.max(0, o.antic - dt * 2.2); continue; }

      /* Decided once and then kept for the rest of THIS carry, so the cue
         does not flicker while you steer - but re-decided the next time you
         pick something up. Keying it on the partner alone meant a creature
         that once declined a given neighbour declined it for the whole
         session, so a child who kept dragging their favourite one around
         found fewer and fewer takers for it as the session went on. */
      if (o.pairWith !== held || o.pairKey !== held.grabId) {
        o.pairWith = held;
        o.pairKey = held.grabId;
        // and the shy ones are still mostly not interested
        o.pairYes = Math.random() < 0.16 + o.answer * 0.50;
        o.pairPlan = pick(PAIR_OUTCOMES);
      }
      if (!o.pairYes) { o.antic = Math.max(0, o.antic - dt * 2.2); continue; }

      // Ramps over the last 180px rather than the whole 210px reach, so
      // the signal is well underway before the commit point instead of
      // only appearing once you are basically on top of it.
      // and how brightly it signals is its own business too, so a passing
      // hand gets a range of answers rather than a row of matching lamps
      var near = clamp(1 - (d - 90) / 180, 0, 1) * (0.30 + o.answer * 0.70);
      o.antic = approach(o.antic, near, 0.10, dt);
      // A definite threshold, and it LOOKS definite: past this point the
      // link between them goes taut and the pair will fire on contact.
      // Without a visible commit point you cannot tell whether you are
      // meant to drop it on top or merely pass nearby.
      o.locked = d < (held.size + o.size) * 1.9 + 46;
      o.vx += (dx === 0 ? 0 : -dx / (d + 1)) * near * near * 70 * dt;
      o.vy += (dy === 0 ? 0 : -dy / (d + 1)) * near * near * 70 * dt;

      var touch = (held.size + o.size) * 0.85 + 14;
      if (d < touch && t - (world.lastPair || -99) > 0.35) {
        world.lastPair = t;
        doPair(held, o, o.pairPlan, t);
        o.antic = 0; o.pairWith = null;
      }
    }
  }

  /* When two of them actually meet, the moment is marked: a bright
     front thrown off the meeting point, and for a beat everything
     else in the world is held back a little so the event has the
     room to itself. That contrast is what makes it read as an
     occasion rather than as more of the same activity. */
  var moment = { t0: -99, x: 0, y: 0, hue: 0, kind: '' };
  /* A few answers only make sense if they arrive after a pause - the one
     that replies a beat too late, the neighbour that copies it once it has
     thought about it. Both read as something deciding rather than something
     firing, and a pause needs somewhere to be kept. */
  var later = [];
  function soon(delay, fn) {
    if (later.length > 60) return;      // a burst of taps cannot pile up forever
    later.push({ at: now() + delay, fn: fn });
  }
  var duck = 1, duckUntil = -99, pDuck = 1;
  var chordNext = 0;    // how long until a sweep may sound again
  function runLater(t) {
    for (var i = later.length - 1; i >= 0; i--) {
      if (t >= later[i].at) { var f = later[i].fn; later.splice(i, 1); f(t); }
    }
  }

  function markMoment(x, y, hue, kind) {
    moment.t0 = now(); moment.x = x; moment.y = y; moment.hue = hue; moment.kind = kind;
  }
  function momentLevel(t) {
    var u = (t - moment.t0) / 1.15;
    return u < 0 || u > 1 ? 0 : Math.sin((1 - u) * (1 - u) * Math.PI * 0.5);
  }
  function drawMoment(t, awake) {
    var k = momentLevel(t);
    if (k <= 0.01) return;
    var u = clamp((t - moment.t0) / 1.15, 0, 1);
    wave(tctx, moment.x, moment.y, 26 + u * 340, moment.hue + u * 130, k * k * 0.55);
    wave(tctx, moment.x, moment.y, 14 + u * 190, moment.hue + 60 - u * 90, k * 0.38);
    blob(tctx, moment.x, moment.y, 26 + k * 74, moment.hue + 20, k * 0.30);
    blob(tctx, moment.x, moment.y, 8 + k * 26, moment.hue + 80, k * 0.62);
  }

  function doPair(a, b, plan, t) {
    var mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
    markMoment(mx, my, world.hue + a.hueOff + 70, plan);
    // a two note figure so the ear knows something happened as well
    if (A.ok && A.started) {
      var mb = clamp(Math.round((1 - my / Math.max(1, H)) * (NOTES.length - 1)), 0, NOTES.length - 1);
      chime(noteI(mb + 5) * 2, 0.05, panOf(mx), 1, 1.4);
      bowl(noteI(mb), 0.045, panOf(mx), 4.5);
    }
    for (var fx = 0; fx < 30; fx++) {
      var fa = Math.random() * TAU, fs = 150 + Math.random() * 520;
      emitSpark(mx, my, Math.cos(fa) * fs, Math.sin(fa) * fs,
                world.hue + a.hueOff + 70 + rnd(-50, 50), 1.1);
    }
    var hue = world.hue + a.hueOff + 40;
    var i, an, sp;
    function burstAt(x, y, n, pw, h) {
      for (var k = 0; k < n; k++) emitSpark(x, y, 0, 0, h, pw);
    }
    a.glowAdd = Math.max(a.glowAdd, 1); b.glowAdd = Math.max(b.glowAdd, 1);
    a.mood = 1; b.mood = 1;

    switch (plan) {
      case 'merge':
        // one bigger thing, but it does not stay big for long
        a.size = Math.min(96, Math.sqrt(a.size * a.size + b.size * b.size) * 1.2);
        a.sizeGoal = Math.min(46, a.size * 0.42);
        a.hueOff = (a.hueOff + b.hueOff) * 0.5;
        burstAt(mx, my, 26, 1, hue);
        b.x = Math.random() * W; b.y = Math.random() * H; b.vit = 0; b.age = 0;
        startReaction(a, 'bloom', 1.3, hue, t, null);
        bowl(noteI(3), 0.055, panOf(mx), 6);
        break;
      case 'twin':
        b.with = a; b.stance = 'orbit'; b.socT = 9 + Math.random() * 8;
        b.orbA = Math.atan2(b.y - a.y, b.x - a.x);
        startReaction(a, 'giggle', 0.9, hue, t, null);
        startReaction(b, 'giggle', 0.9, hue, t, null);
        chime(noteI(6), 0.05, panOf(mx), 1, 2);
        break;
      case 'jiggle':
        b.with = a; b.stance = 'jitter'; b.socT = 5 + Math.random() * 5;
        b.homeX = b.x; b.homeY = b.y;
        startReaction(a, 'giggle', 1.1, hue, t, null);
        startReaction(b, 'giggle', 1.1, hue, t, null);
        marimba(noteI(9), 0.05, panOf(mx));
        break;
      case 'burst':
        burstAt(mx, my, 44, 1.2, hue);
        spawnPulse(mx, my, { energy: 0.85, reach: 0.3, budget: 8, uni: 0.8 });
        b.x = Math.random() * W; b.y = Math.random() * H; b.vit = 0; b.age = 0;
        a.vx += rnd(-1, 1) * 420; a.vy += rnd(-1, 1) * 420;
        gust(0.05, panOf(mx), 1.1, false);
        break;
      case 'swap': {
        var th = a.hueOff, tf = a.sp, tz = a.size;
        a.hueOff = b.hueOff; a.sp = b.sp; a.size = b.size;
        b.hueOff = th; b.sp = tf; b.size = tz;
        startReaction(a, 'flip', 1, hue, t, null);
        startReaction(b, 'flip', 1, hue, t, null);
        drop(noteI(7), 0.05, panOf(mx));
        break;
      }
      case 'spawn': {
        var n = freeCreature();
        if (n) {
          world.pop = Math.min(6, world.pop + 1);
          n.x = mx; n.y = my; n.vx = 0; n.vy = 0;
          n.size = Math.max(7, (a.size + b.size) * 0.24);
          n.hueOff = (a.hueOff + b.hueOff) * 0.5 + rnd(-30, 30);
          n.age = 0; n.span = rnd(50, 130); n.vit = 0; n.flare = 1;
        }
        burstAt(mx, my, 18, 0.7, hue);
        startReaction(a, 'bloom', 0.9, hue, t, null);
        breath(noteI(5), 0.04, panOf(mx), 0.7, 3);
        break;
      }
      case 'repel':
        an = Math.atan2(b.y - a.y, b.x - a.x);
        if (!isFinite(an)) an = Math.random() * TAU;
        b.vx += Math.cos(an) * 700; b.vy += Math.sin(an) * 700;
        a.vx -= Math.cos(an) * 260; a.vy -= Math.sin(an) * 260;
        startReaction(b, 'scamper', 1.1, hue, t, null);
        burstAt(mx, my, 14, 0.8, hue);
        gust(0.045, panOf(mx), 0.8, true);
        break;
      case 'tether':
        b.with = a; b.stance = 'follow'; b.socT = 12 + Math.random() * 10;
        startReaction(b, 'rush', 1, hue, t, null);
        drop(noteI(4), 0.05, panOf(mx));
        break;
      case 'bloomPair':
        startReaction(a, 'bloom', 1.4, hue, t, null);
        startReaction(b, 'bloom', 1.4, hue, t, null);
        spawnPulse(mx, my, { energy: 1.0, reach: 0.5, budget: 14,
                             uni: 0.9, kind: RIPPLES[4] });
        burstAt(mx, my, 22, 0.9, hue);
        break;
      case 'mirror':
        b.sp = a.sp; b.hueOff = a.hueOff; b.size = a.size;
        b.tail.length = 0;
        for (i = 0; i < b.sp.tail; i++) b.tail.push({ x: b.x, y: b.y });
        b.head = 0;
        startReaction(b, 'bloom', 1, hue, t, null);
        chime(noteI(8), 0.045, panOf(mx), 1, 1.8);
        break;
      case 'halo':
        for (i = 0; i < 30; i++) {
          an = i / 30 * TAU; sp = 240 + Math.random() * 160;
          emitSpark(mx, my, Math.cos(an) * sp, Math.sin(an) * sp, hue + i * 4, 1);
        }
        startReaction(a, 'sparkle', 1.1, hue, t, null);
        startReaction(b, 'sparkle', 1.1, hue, t, null);
        pluck(noteI(10), 0.05, panOf(mx));
        break;
      case 'absorb':
        a.size = Math.min(80, a.size * 1.45);
        a.sizeGoal = Math.min(44, a.size * 0.55);
        b.size = Math.max(5, b.size * 0.4);
        b.vx += rnd(-1, 1) * 200; b.vy += rnd(-1, 1) * 200;
        startReaction(a, 'bloom', 1.1, hue, t, null);
        startReaction(b, 'curl', 1.1, hue, t, null);
        bowl(noteI(1), 0.05, panOf(mx), 5);
        break;
      case 'whirl':
        a.spin += 13; b.spin -= 13;
        b.with = a; b.stance = 'circle'; b.socT = 6 + Math.random() * 5;
        b.homeX = b.x; b.homeY = b.y;
        startReaction(a, 'tumble', 1.1, hue, t, null);
        startReaction(b, 'tumble', 1.1, hue, t, null);
        break;
      default: {
        world.pop = Math.min(6, world.pop + 2);
        var made = 0;
        for (i = 0; i < 3; i++) {
          var f = freeCreature();
          if (!f) break;
          f.x = b.x + rnd(-24, 24); f.y = b.y + rnd(-24, 24);
          f.size = Math.max(6, b.size * 0.46); f.age = 0; f.span = rnd(40, 100);
          f.vit = 0; f.hueOff = b.hueOff + rnd(-40, 40); f.flare = 1;
          an = Math.random() * TAU; sp = rnd(180, 360);
          f.vx = Math.cos(an) * sp; f.vy = Math.sin(an) * sp;
          made++;
        }
        burstAt(b.x, b.y, 24, 1, hue);
        if (made) { b.x = Math.random() * W; b.y = Math.random() * H; b.vit = 0; b.age = 0; }
        marimba(noteI(11), 0.05, panOf(mx));
      }
    }
  }

  function updateGrab(c, dt, t) {
    var p = c.held;
    if (!p) return;
    c.gt += dt;
    if (c.ember) {
      c.fuse += dt;
      if (c.fuse >= EMBER_FUSE) {
        var pp = c.held;
        c.held = null; c.hold = null; c.grab = null;
        if (pp) { pp.holding = null; }
        stopHeldVoice();
        blowEmber(c, t);
        return;
      }
    }
    stepHeldVoice(c);
    if (c.hold && c.hold.tick) c.hold.tick(c, dt, t, world.hue + c.hueOff + 40);
    socialise(c, dt, t);
    updateAnticipation(c, dt, t);
    var gx = p.x, gy = p.y, tau = 0.09;
    c.hopX = (c.hopX || 0) * Math.pow(0.90, dt * 60);
    c.hopY = (c.hopY || 0) * Math.pow(0.90, dt * 60);

    switch (c.grab) {
      case 'docile': tau = 0.075; break;
      case 'heavy':  tau = 0.34; break;
      case 'eager':  tau = 0.035; break;
      case 'struggle':
        tau = 0.13;
        // pulls against you instead of coming along quietly
        gx += Math.sin(t * 7.3 + c.phase) * 52 - p.vx * 0.05;
        gy += Math.cos(t * 6.1 + c.phase) * 52 - p.vy * 0.05;
        break;
      case 'hop':
        tau = 0.085;
        c.hopT -= dt;
        if (c.hopT <= 0) {
          c.hopT = 0.4 + Math.random() * 0.5;
          var ha = Math.random() * TAU, hr = 40 + Math.random() * 70;
          c.hopX = Math.cos(ha) * hr; c.hopY = Math.sin(ha) * hr;
          startReaction(c, 'giggle', 0.5, world.hue, t, null);
        }
        break;
      case 'slippery':
        tau = 0.10;
        if (c.gt > 2.2 + Math.random() * 2) { endGrab(p, t); return; }
        break;
      case 'swell':
        tau = 0.09;
        c.mood = 1;
        c.glowAdd = Math.max(c.glowAdd, 0.4 + Math.min(1, c.gt * 0.25));
        break;
      case 'parade': tau = 0.11; break;
    }
    var px0 = c.x, py0 = c.y;
    var f = 1 - Math.exp(-dt / tau);
    c.x += (gx + c.hopX - c.x) * f;
    c.y += (gy + c.hopY - c.y) * f;
    c.vx = (c.x - px0) / Math.max(dt, 1e-4);
    c.vy = (c.y - py0) / Math.max(dt, 1e-4);
    c.mood = Math.max(c.mood, 0.6);
    if (Math.random() < dt * 5) emitSpark(c.x, c.y, c.vx * 0.2, c.vy * 0.2, world.hue + 50, 0.4);
    if (Math.random() < dt * 0.7) voiceOf(c, 'sing', 0.35, world.hue);
  }

  /* ---- what a tap does to a creature ---------------------
     Touching one directly is nothing like disturbing the water near
     it. Which of these happens is unpredictable; the only constant
     is that something does, and that it happens to THAT creature
     rather than radiating out across everybody. */
  function freeCreature(near) {
    for (var i = creatures.length - 1; i >= 0; i--) {
      if (creatures[i].vit < 0.25 && !creatures[i].held) return creatures[i];
    }
    return null;
  }

  /* ============================================================
     LAUNCHES
     ------------------------------------------------------------
     Tap a planet and sometimes a handful of tiny rockets leave the surface.
     Each one is given a fate at launch and none of them ends well, which is the
     joke: one bursts almost at once, one gets a long way out before it goes, one
     loses its bearings and corkscrews until it gives up, and one never really
     leaves - it stalls, falls back, and goes off against the ground it came
     from.

     It is an easter egg, so it is not every tap. Roughly half of them, which is
     often enough to be found by a child pressing things and rare enough that
     finding it feels like finding something.

     Written to be cheap. A rocket is a point with a short plume drawn into the
     trail buffer, which is safe here precisely because they move fast - it is
     stationary things that burn a hole in that buffer. There is a hard ceiling
     on how many can exist, the bursts reuse the spark pool that already exists,
     and only the first couple in a volley are allowed to make a sound.
     ============================================================ */
  var ROCKETS = [];
  var ROCKET_MAX = 40;

  /* Sparks that actually go OUTWARDS.
     ------------------------------------------------------------
     emitSpark keeps only three tenths of the velocity it is handed and adds a
     random vector of up to a couple of hundred on top, which is right for the
     scatter it was written for and wrong for this: every burst came out a puff
     rather than a shell, which is most of why none of it read as a firework.
     Handing it a big enough velocity puts the radial part back in charge. */
  function burstRing(x, y, hue, n, speed, life) {
    for (var i = 0; i < n; i++) {
      var a2 = (i / n) * TAU + rnd(-0.10, 0.10);
      var sp = speed * rnd(0.7, 1.3);
      emitSpark(x, y, Math.cos(a2) * sp, Math.sin(a2) * sp, hue + rnd(-34, 34), life);
    }
  }

  function flash(x, y, hue, r, a3) {
    blob(tctx, x, y, r, hue, a3);
    blob(tctx, x, y, r * 0.45, hue + 20, a3 * 1.3);
    wave(tctx, x, y, r * 1.5, hue + 40, a3 * 0.7);
  }

  /* Two things a planet does when it is tapped, and they are meant to be told
     apart at a glance.

     ROCKETS are individual and they go wrong. Each is given a fate at launch:
     one bursts early, one gets a long way out, one loses its bearings and
     corkscrews, and one never really leaves - it stalls, falls back and goes off
     against the ground it came from.

     A FIREWORK is the opposite: one shell, no drama on the way, rising in a
     clean arc a long way clear of the planet before it opens into a proper ring.

     The first version of the rockets was drawn at two and a half pixels and a
     quarter alpha, which next to creatures forty pixels across and far brighter
     is simply not there. Both of these are now bold and both travel properly
     clear of the surface, because the whole point is watching something leave. */
  function launchRockets(big, t) {
    var R = worldR(big);
    var n = 3 + ((Math.random() * 4) | 0);
    var voice = 0;
    for (var i = 0; i < n && ROCKETS.length < ROCKET_MAX; i++) {
      var ang = Math.random() * TAU;
      var fate = pick(['quick', 'far', 'far', 'spin', 'dud']);
      ROCKETS.push({
        kind: 'rocket', fate: fate,
        x: big.x + Math.cos(ang) * R * 0.94, y: big.y + Math.sin(ang) * R * 0.94,
        vx: Math.cos(ang) * rnd(120, 190), vy: Math.sin(ang) * rnd(120, 190),
        dir: ang, home: big,
        burn: fate === 'quick' ? rnd(0.45, 0.70)
            : fate === 'far' ? rnd(1.40, 2.20)
            : fate === 'spin' ? rnd(1.00, 1.80)
            : rnd(0.18, 0.30),
        curl: fate === 'spin' ? (Math.random() < 0.5 ? -1 : 1) * rnd(1.5, 2.8) : 0,
        hue: world.hue + big.hueOff + rnd(18, 50),
        age: 0, sound: voice++ < 2
      });
    }
    flash(big.x, big.y, world.hue + big.hueOff + 30, R * 1.2, 0.22);
    if (A.ok && A.started) { voiceBg++; breath(noteI(2), 0.022, panOf(big.x), 0.5, 1.1); voiceBg--; }
  }

  function launchFirework(big, t) {
    if (ROCKETS.length >= ROCKET_MAX) return;
    var R = worldR(big);
    var ang = Math.random() * TAU;
    ROCKETS.push({
      kind: 'shell',
      x: big.x + Math.cos(ang) * R * 0.94, y: big.y + Math.sin(ang) * R * 0.94,
      vx: Math.cos(ang) * rnd(230, 300), vy: Math.sin(ang) * rnd(230, 300),
      dir: ang, home: big,
      burn: rnd(0.95, 1.45),                 // a long clean rise
      curl: rnd(-0.5, 0.5),                  // the faintest lean, so it arcs
      hue: world.hue + big.hueOff + rnd(0, 300),
      age: 0, sound: true
    });
    flash(big.x, big.y, world.hue + big.hueOff + 30, R * 1.1, 0.18);
    if (A.ok && A.started) { voiceBg++; breath(noteI(1), 0.020, panOf(big.x), 0.45, 1.3); voiceBg--; }
  }

  function burstRocket(r, t) {
    if (r.kind === 'shell') {
      // the whole point of it: a big round ring, well away from home
      burstRing(r.x, r.y, r.hue, 34 + ((Math.random() * 16) | 0), 1500, 1.25);
      burstRing(r.x, r.y, r.hue + 40, 14, 700, 0.9);
      flash(r.x, r.y, r.hue, 34, 0.40);
      if (r.sound && A.ok && A.started) {
        drop(noteI(2 + ((Math.random() * 3) | 0)), 0.030, panOf(r.x));
      }
      return;
    }
    var hard = r.fate === 'far' || r.fate === 'dud';
    burstRing(r.x, r.y, r.hue, hard ? 20 : 12, hard ? 1000 : 620, hard ? 1.0 : 0.75);
    flash(r.x, r.y, r.hue, hard ? 22 : 15, hard ? 0.30 : 0.20);
    if (r.sound && A.ok && A.started) {
      drop(noteI(4 + ((Math.random() * 4) | 0)) * 2, hard ? 0.026 : 0.018, panOf(r.x));
    }
  }

  function updateRockets(dt, t) {
    for (var i = ROCKETS.length - 1; i >= 0; i--) {
      var r = ROCKETS[i];
      r.age += dt;
      var big = r.home;
      var alive = big && big.world && big.vit > 0.2;
      var burning = r.age < r.burn;

      if (burning) {
        if (r.curl) r.dir += r.curl * dt * (r.kind === 'shell' ? 1 : (0.5 + r.age * 2.2));
        var push = r.kind === 'shell' ? 340
                 : (r.fate === 'far' ? 420 : (r.fate === 'dud' ? 110 : 320));
        r.vx += Math.cos(r.dir) * push * dt;
        r.vy += Math.sin(r.dir) * push * dt;
      }
      /* Its own planet keeps a hold on it, which is what brings a dud back down
         and gives everything else a slight arc instead of a straight line. */
      if (alive) {
        var dx = big.x - r.x, dy = big.y - r.y;
        var d = Math.hypot(dx, dy) + 1;
        var g = r.fate === 'dud' ? 300 : 42;
        r.vx += (dx / d) * g * dt;
        r.vy += (dy / d) * g * dt;
      }
      r.vx *= Math.pow(0.988, dt * 60);
      r.vy *= Math.pow(0.988, dt * 60);
      r.x += r.vx * dt; r.y += r.vy * dt;

      if (alive && r.age > 0.12 &&
          Math.hypot(r.x - big.x, r.y - big.y) < worldR(big) * 0.98) {
        burstRocket(r, t); ROCKETS.splice(i, 1); continue;
      }
      var over = r.kind === 'shell' ? r.burn + rnd(0.10, 0.30)
               : r.fate === 'quick' ? r.burn + rnd(0.10, 0.30)
               : r.fate === 'far' ? r.burn + 0.9
               : r.fate === 'spin' ? r.burn + 0.5
               : 4.0;
      if (r.age > over) { burstRocket(r, t); ROCKETS.splice(i, 1); continue; }
      if (r.x < -90 || r.x > W + 90 || r.y < -90 || r.y > H + 90) ROCKETS.splice(i, 1);
    }
  }

  function drawRockets(t, awake) {
    var lit = 0.55 + awake * 0.45;
    for (var i = 0; i < ROCKETS.length; i++) {
      var r = ROCKETS[i];
      var burning = r.age < r.burn;
      var shell = r.kind === 'shell';
      var sp = Math.hypot(r.vx, r.vy) + 1;
      var ux = -r.vx / sp, uy = -r.vy / sp;
      /* The plume is spaced along the ACTUAL travel each frame, so it reads as a
         streak behind something moving rather than a fixed little tail. */
      var step = clamp(sp * 0.016, 3, 11);
      var segs = burning ? (shell ? 9 : 7) : 3;
      for (var q = 1; q <= segs; q++) {
        var f = q / segs;
        blob(tctx, r.x + ux * q * step, r.y + uy * q * step,
             (shell ? 5.2 : 4.4) * (1 - f * 0.72),
             r.hue + 20 + f * 30, (burning ? 0.26 : 0.10) * (1 - f * 0.85) * lit);
      }
      blob(tctx, r.x, r.y, shell ? 7 : 5.6, r.hue,
           (burning ? 0.55 : 0.30) * lit);
      blob(tctx, r.x, r.y, shell ? 3.2 : 2.6, r.hue + 30,
           (burning ? 0.5 : 0.28) * lit);
    }
  }

  /* The CHASE and the DROP used to live here, and they are gone.
     ------------------------------------------------------------
     A thing appeared while you swept, a follower answered your swipes through a
     random rotation, and steering one into the other made the whole room fall
     to the floor. It worked - it was measured working, caught in a couple of
     seconds from six hundred pixels out - and it was still wrong.

     It put a GOAL in an app whose entire character is that there is nothing to
     achieve. Everything else here answers you immediately and in proportion:
     touch more, get more, now. The chase asked you to want something, gave you
     a few seconds to get it, and could be lost. And the reward broke continuity
     worse than the goal did - gravity is not a thing in this world, so the room
     collapsing into a heap read as the app breaking rather than as a joke.

     What replaced it is below and in the hand-drawing code: rewards that arrive
     as you move, get larger the more of your hand you use, and cannot be missed.
     ============================================================ */

  /* ============================================================
     THE STRING
     ------------------------------------------------------------
     Put two fingers on open space and a line is stretched between them. It
     sounds for as long as you hold it, and how far apart your hands are IS the
     pitch: close together is high, spread wide is low. Everything else here
     answers a touch and then decays; this is the one thing you play.

     Which is only making the app's own rule audible. Position has always been
     pitch - noteIdxAt and octAt turn a place into a note, invertibly - but you
     could only ever hear that one note at a time, struck. A held string turns
