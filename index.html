      wave(tctx, x + lx2 * pr * 0.09, y + ly2 * pr * 0.09, pr * 1.16,
           hue + 42, 0.024 * pk * al);
      /* No drawn orbit paths at all. I added them so a system would read as a
         system in a still frame, and in motion they were the single most
         intrusive thing on the screen: a ring is drawn at the same radius every
         frame, so in an accumulating buffer even two percent alpha builds into a
         solid bright annulus, and five of them at five radii turned each planet
         into a great glowing target. The orbiters have tails; the tails are the
         paths, they fade as they should, and they were always enough. */

      // a ringed one puts the far half of its ring on before the body
      if (c.ptype === 2) {
        for (var rg = 0; rg < c.rings; rg++) {
          var rr2 = pr * (1.42 + rg * 0.24);
          for (var rp = 0; rp < 34; rp++) {
            var ra2 = (rp / 34) * TAU + c.rot * 0.4 + rg;
            if (Math.sin(ra2) >= 0) continue;         // near half comes later
            blob(tctx, x + Math.cos(ra2) * rr2, y + Math.sin(ra2) * rr2 * 0.28,
                 3 + rg, hue + 48 + rg * 16, 0.075 * pk * al);
          }
        }
      }

      // the body itself, opaque, drawn to the screen after this pass
      SOLIDS.push({ cv: paintGlobe(c, t, hue), x: x, y: y, r: pr,
                    a: clamp(pk * c.vit * 1.3, 0, 1) });
      /* The halo goes OUTSIDE the body, as an annulus, never as a disc over it.
         A disc at the body's own radius is repainted on the same pixels every
         frame, and the trail buffer is never cleared - so on something that
         barely drifts, even three percent a frame saturates to white in a few
         seconds and then the surface is stamped onto a glowing blob. Dose times
         dwell, and a planet's dwell is forever. An annulus outside the limb
         cannot land on the surface at all. */
      wave(tctx, x, y, pr * 1.09, hue + 20, 0.03 * pk * al);

      // and the near half of the ring, over the top
      if (c.ptype === 2) {
        for (var rg2 = 0; rg2 < c.rings; rg2++) {
          var rr3 = pr * (1.42 + rg2 * 0.24);
          for (var rp2 = 0; rp2 < 34; rp2++) {
            var ra3 = (rp2 / 34) * TAU + c.rot * 0.4 + rg2;
            if (Math.sin(ra3) < 0) continue;
            blob(tctx, x + Math.cos(ra3) * rr3, y + Math.sin(ra3) * rr3 * 0.28,
                 3 + rg2, hue + 48 + rg2 * 16, 0.115 * pk * al);
          }
        }
      }
    }

    if (c.elder) {
      var eb = 0.5 + 0.5 * Math.sin(t * 0.4 + c.phase);
      blob(tctx, x, y, sz * (2.0 + eb * 0.35), hue - 25, 0.045 * al);
      blob(tctx, x, y, sz * (1.3 + eb * 0.2), hue - 10, 0.05 * al);
    }

    /* From here down is the creature's own body. Under a world it drops right
       back - the planet above IS the drawing, and the species core at full
       strength put a bright white disc back in the middle of every one. */
    al *= wDim;
    gl *= wDim;

    switch (c.sp.form) {
      case 'blob':
        blob(tctx, x - ux * el, y - uy * el, sz * 1.5 * wob, hue + 10, (0.10 + gl * 0.18) * al);
        blob(tctx, x, y, sz * 0.55, hue + 60, (0.34 + gl * 0.5) * al);
        break;
      case 'ribbon':
        for (var r = 0; r < 7; r++) {
          var u = r / 6, ph = c.phase + t * 2.4;
          var off = (u - 0.5) * sz * 7;
          var sw = Math.sin(ph + u * 5) * sz * 1.5 * (0.4 + m.spread);
          blob(tctx, x + ux * off - uy * sw, y + uy * off + ux * sw,
               sz * (0.75 - Math.abs(u - 0.5) * 0.6), hue + r * 6,
               (0.16 + gl * 0.3) * al);
        } break;
      case 'jelly':
        blob(tctx, x, y - sz * 0.3, sz * 1.35 * wob, hue, (0.13 + gl * 0.2) * al);
        for (var j = 0; j < 5; j++) {
          var a2 = (j / 5 - 0.5) * 1.5;
          var ln = sz * (1.4 + Math.sin(t * 3 + j + c.phase) * 0.5);
          blob(tctx, x + Math.sin(a2) * sz * 0.8, y + sz * 0.5 + ln,
               sz * 0.30, hue + 30, (0.13 + gl * 0.2) * al);
        }
        blob(tctx, x, y - sz * 0.3, sz * 0.42, hue + 70, (0.28 + gl * 0.45) * al);
        break;
      case 'sun':
        // the one that reads as a little star: long soft rays of
        // uneven length around a hot core
        for (var s2 = 0; s2 < 11; s2++) {
          var an = c.rot + s2 / 11 * TAU;
          var beat = 0.75 + 0.45 * Math.sin(t * 3.1 + s2 * 1.7 + c.phase);
          var rr = sz * (1.55 + m.spread) * beat;
          blob(tctx, x + Math.cos(an) * rr, y + Math.sin(an) * rr,
               sz * 0.30 * (0.7 + beat * 0.5), hue + s2 * 3, (0.15 + gl * 0.30) * al);
          blob(tctx, x + Math.cos(an) * rr * 0.6, y + Math.sin(an) * rr * 0.6,
               sz * 0.24, hue + s2 * 3, (0.10 + gl * 0.20) * al);
        }
        blob(tctx, x, y, sz * 1.25, hue + 30, (0.13 + gl * 0.26) * al);
        blob(tctx, x, y, sz * 0.52, hue + 60, (0.40 + gl * 0.5) * al);
        break;
      case 'lava':
        // a lava-lamp body: overlapping lobes that drift within the
        // mass, so it pinches and swells instead of holding a shape
        for (var lb = 0; lb < 4; lb++) {
          var la = c.phase * (0.5 + lb * 0.22) + lb * 1.9;
          var ld = sz * (0.30 + 0.26 * Math.sin(t * (0.5 + lb * 0.19) + lb));
          var lx = x + Math.cos(la) * ld - ux * el * 0.5;
          var ly = y + Math.sin(la) * ld * 0.8 - uy * el * 0.5;
          blob(tctx, lx, ly, sz * (1.12 - lb * 0.13) * wob,
               hue + lb * 7, (0.13 + gl * 0.20) * al);
        }
        blob(tctx, x, y, sz * 0.62, hue + 55, (0.24 + gl * 0.4) * al);
        break;
      case 'cluster':
        for (var k = 0; k < 6; k++) {
          var ka = c.rot * 1.4 + k / 6 * TAU;
          var kr = sz * (1.0 + Math.sin(t * 2 + k) * 0.35 + m.spread * 1.2);
          blob(tctx, x + Math.cos(ka) * kr, y + Math.sin(ka) * kr,
               sz * 0.42, hue + k * 9, (0.20 + gl * 0.34) * al);
        } break;
      case 'droplet':
        // a teardrop drawn out behind its heading
        for (var dp = 0; dp < 5; dp++) {
          var du = dp / 4;
          blob(tctx, x - ux * sz * du * 2.3, y - uy * sz * du * 2.3,
               sz * (1.15 - du * 0.85) * wob, hue + dp * 6,
               (0.16 + gl * 0.26) * al * (1 - du * 0.45));
        }
        blob(tctx, x + ux * sz * 0.15, y + uy * sz * 0.15, sz * 0.5,
             hue + 65, (0.32 + gl * 0.45) * al);
        break;
      default: // wisp
        for (var wI = 0; wI < 5; wI++) {
          var wu = wI / 4;
          blob(tctx, x - ux * sz * wu * 3.4 + Math.sin(t * 2 + wI + c.phase) * sz * 0.8,
               y - uy * sz * wu * 3.4 + Math.cos(t * 1.7 + wI) * sz * 0.8,
               sz * (1.1 - wu * 0.7), hue + wI * 8, (0.09 + gl * 0.18) * al * (1 - wu * 0.6));
        }
        blob(tctx, x, y, sz * 0.42, hue + 60, (0.2 + gl * 0.36) * al);
    }
  }

  /* ============================================================
     FRAME
     ============================================================ */
  /* Solid things - planets and balls - are not painted into the trail buffer
     like everything else. That buffer is never cleared, only slowly veiled,
     which is exactly what gives glowing things their tails; but an OPAQUE stamp
     left in it does not fade fast enough, so a ball crossing the screen drew
     itself as a long solid tube rather than a ball.

     So they are collected here during the creature pass and drawn straight onto
     the screen afterwards, in between the liquid field and the trail. That gets
     all three things right at once: they cover the background because they are
     solid, glowing creatures still pass in front of them because the trail goes
     on top, and nothing smears because the screen is redrawn every frame. A
     faint copy still goes into the trail so they keep a little atmosphere. */
  var SOLIDS = [];

  var lastT = now(), dith = 0, momentK = 0;

  function frame() {
    requestAnimationFrame(frame);
    if (needResize()) resize();
    var t = now();
    var dt = clamp(t - lastT, 0.0005, 0.05);
    lastT = t;

    /* the painting moves on to another composition */
    if (t > palNext) {
      palNext = t + rnd(34, 80);
      palIdx = (palIdx + 1 + ((Math.random() * (PALS.length - 1)) | 0)) % PALS.length;
      setPalette(palIdx, false);       // drift carries on from wherever it is
      root = pick([0, 2, 4, 5, 7, 9]);
      buildNotes(); retune(3.0);
    }
    world.hue = approachHue(world.hue, pal.hues[0], 5, dt);

    /* pointers */
    var list = [], active = 0, totalPath = 0, nDown = 0;
    pointers.forEach(function (p) { if (p.down) nDown++; });
    pointers.forEach(function (p) {
      var ivx = p.accx / dt, ivy = p.accy / dt;
      p.accx = 0; p.accy = 0;
      var s = smooth(0.35, dt);
      p.vx = lerp(p.vx, ivx, s); p.vy = lerp(p.vy, ivy, s);
      p.speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      // arc length per second: direction-agnostic, so a jiggle in place
      // reads as agitation rather than as stillness
      p.path = lerp(p.path, p.pathAcc / dt, smooth(0.3, dt));
      p.pathAcc = 0;
      p.coh = clamp(p.speed / Math.max(p.path, 1), 0, 1);
      if (p.path < 26) p.hold = Math.min(1, p.hold + dt * 1.1);
      else p.hold = Math.max(0, p.hold - dt * 3);
      p.stir += p.path * dt;
      totalPath += p.path;
      // a press that wanders turns into a stroke, and stops charging
      if (p.charging) {
        p.chargeDist += p.path * dt;
        if (p.chargeDist > 38) {
          p.chargeCancelled = true;
          releaseCharge(p, t);
          p.chargeCancelled = false;
        } else { updateCharge(p, t); chargeOrbit(p, dt, t); }
      }
      // keep pressing on one and you pick it up
      /* Counted by contacts, not by entries: a desktop mouse leaves a
         pointer behind after the button comes up so it can go on being
         tracked, and that lingering entry must not disqualify the next
         gesture. Two fingers genuinely down, though, means a shove. */
      if (p.down) sweepBubbles(p, dt, t);
      if (nDown > 1) p.solo = false;
      var wdx = p.x - (p.tapX || p.x), wdy = p.y - (p.tapY || p.y);
      var went2 = wdx * wdx + wdy * wdy;                 // compared squared below
      var age = t - (p.downAt || t);
      // held still and waited
      /* Held still and waited. All three parts matter, and the third was
         missing: went2 is the distance from where the finger LANDED, so on any
         gesture that comes back to where it started - a lasso above all - it
         collapses to nothing again at the end and this fired. The stroke was
         then converted into a grab on completion, which is why drawing a
         circle round something picked it up instead of gathering it, and why
         no closed shape could ever be recognised. A hand that is genuinely
         waiting has no arc length; a loop closing is doing 2400 a second. */
      var patient = went2 < 1156 && age > PRESS_T && p.path < 200;   // 34 squared
      /* or set off the way a drag sets off: far enough to be movement, slow
         enough that placing the finger came first. A swipe covers this same
         distance in a fraction of the time and at several times the speed.

         Note there is deliberately no test on p.strokeOn here. That was the
         first thing I reached for and it is exactly what made dragging feel
         impossible: strokeOn is set the moment the hand exceeds sixty pixels a
         second, which every deliberate drag does within two frames, so the
         gesture was being claimed by the stroke system before the grab was
         ever considered. The window below closes at a quarter of a second, so
         a stroke that is genuinely under way is still safe from this. */
      /* Twenty pixels, not twelve: a finger resting on glass drifts, and a
         tap that drifted its way into a grab would lose its prod. And
         coherence, which is how much of the distance travelled went in one
         direction - about one for purposeful movement, a fifth for a wobble -
         so a wandering fingertip is not mistaken for setting off somewhere. */
      var dragging = went2 > 400 && went2 < 8100 && p.coh > 0.5 &&  // 20 and 90 squared
                     age > 0.07 && age < 0.24 && p.path < 520;
      if (p.down && !p.holding && (patient || dragging)) {
        /* Having held still this long you have committed. What you committed
           TO depends on where the press landed:

           - on a creature: it is yours, look no further
           - on open space with nothing winding up: look again and look wider,
             since a near miss on something you were clearly aiming at should
             still pick it up
           - on open space WITH a charge running: your intent is not in doubt,
             and one wandering across your finger must not quietly cancel it.
             Only now and then is one bold enough to take it, and then it has
             to be properly on top of you, not merely nearby. */
        /* Look again, because whatever was under your finger may have drifted
           on in the meantime - but at the SAME reach, not a wider one. A
           second, wider search was quietly claiming most of the canvas.

           Once a wind-up is actually running the press landed on open space
           and there is no doubt what you meant, so something wandering across
           your finger must not cancel it. Just occasionally one is bold
           enough to take it, and then it has to be properly on top of you. */
        // a place, if there is one under the finger and nothing living
        if (!p.holdWant && !p.holding && !p.cand) {
          var wq = wantAt(p.x, p.y);
          if (wq && !wq.held) { wq.held = p; p.holdWant = wq; p.mayCharge = false; }
        }
        var gc = null;
        if (p.cand && p.cand.vit > 0.3 && !p.cand.held) {
          var mvx = p.x - (p.tapX || p.x), mvy = p.y - (p.tapY || p.y);
          if (p.onBody) gc = p.cand;                       // pressed on it
          else if (mvx * mvx + mvy * mvy > 100) gc = p.cand;   // halo, and moved
          else if (p.charging) p.cand = null;              // the wave won
        }
        /* Only a patient press goes looking; a drag takes what it pressed on.
           And nothing whatsoever can take a wind-up. It used to be possible
           "rarely", which sounded reasonable and in practice meant that the
           one gesture with a long commitment was the one gesture that could
           be snatched away - so it is now simply impossible. Press on open
           water and you get your wave. */
        else if (patient && !p.charging && !p.mayCharge) gc = creatureAt(p.x, p.y);
        if (gc && gc.vit > 0.3 && !gc.held) {
          if (p.charging) {
            p.chargeCancelled = true;
            releaseCharge(p, t);
            p.chargeCancelled = false;
          }
          p.mayCharge = false;
          beginGrab(p, gc, t);
        }
      }
      /* And only now, with that settled, does a wind-up begin. Its clock is
         backdated to the moment of contact so a hold reaches full in the same
         time it always did. */
      /* One finger winds up a wave. Two or more are making music instead, and
         a handful of wind-ups under a running beat is just noise. This is the
         only thing the multitouch modes take away, and they take it from the
         second finger onward rather than from the first: a single press and
         hold builds and releases exactly as it always did. */
      if (p.mayCharge && p.down && !p.holding && !p.charging && nDown < 2 &&
          (t - p.downAt) > 0.30) {
        p.mayCharge = false;
        /* It landed on open space and it stayed put, so it winds up - full
           stop. Whether something has since drifted across is not relevant;
           checking made a creature wandering past able to cancel your wave. */
        if (p.chargeDist <= 38) {
          beginCharge(p, t);
          p.chargeT0 = p.downAt;
        }
      }
      list.push(p); active++;
    });

    /* ---- how many fingers, how full the chord ---------------------------
       Position is already pitch, exactly and invertibly, so a sweep is
       literally playing a line - but it only ever played one note at a time
       however much of your hand was on the glass, which is why there was no
       reason to use more than a finger.

       Now the number of fingers down IS the size of the chord. One is a single
       note, two adds the fifth, three makes a triad, four or more a wide
       shimmering stack. Every interval comes out of the same anhemitonic
       pentatonic as everything else, so it cannot be made to sound wrong, and
       the whole thing is arithmetic on a count - there is no technique to
       learn and nothing to get right. A whole hand simply sounds better than
       one finger, straight away.

       Only the fastest hand speaks, and only every so often. Five fingers
       meaning five times the voices would be five times the load on a device
       that is already struggling, and it would sound like a scramble rather
       than a chord. */
    var swN = 0, lead = null, leadSp = 0;
    for (var si = 0; si < list.length; si++) {
      var sp3 = list[si];
      if (!sp3.down) continue;
      swN++;
      var v3 = Math.hypot(sp3.vx, sp3.vy);
      if (v3 > leadSp) { leadSp = v3; lead = sp3; }
    }
    chordNext -= dt;
    if (lead && leadSp > 260 && chordNext <= 0 && !lead.charging &&
        A.ok && A.started && world.sleep < 0.6) {
      var voices = Math.min(4, swN);
      /* A bigger chord is spaced further apart, so five fingers is not five
         times the voices per second - measured, a whole hand went from about
         three notes a second to six rather than to nineteen. That matters on an
         older tablet, which already drops notes when the room is busy, and it
         sounds better anyway: a full chord wants room to ring rather than to be
         trodden on by the next one. */
      chordNext = (0.26 + voices * 0.10) - clamp(leadSp / 4000, 0, 0.10);
      var base = noteIdxAt(lead.x);
      var oc = octAt(lead.y);
      var pan3 = panOf(lead.x);
      // stacked scale degrees: always consonant, wider with more fingers
      var STEPS = [0, 2, 4, 6];
      mine((function (voices2, base2, oc2, pan4, spd) {
        return function () {
          for (var q3 = 0; q3 < voices2; q3++) {
            var deg = clamp(base2 + STEPS[q3], 0, NOTES.length - 1);
            var lvl = (0.020 + spd * 0.000012) * (q3 ? 0.55 : 1);
            chime(noteI(deg) * oc2 * (q3 > 2 ? 2 : 1), lvl,
                  clamp(pan4 + (q3 - 1) * 0.18, -1, 1), 0.7, 1.6 + q3 * 0.4);
          }
        };
      })(voices, base, oc, pan3, leadSp));
    }
    PTR_LIST = list;
    var DOWNS = [];
    for (var dz = 0; dz < list.length; dz++) if (list[dz].down) DOWNS.push(list[dz]);
    updateAnchors(list, dt, t);
    updateWeb(list, dt, t);
    updateEnsemble(ANCH, dt, t);
    updateEcho(dt, t, swN);
    updatePinch(list, t);
    updateErosion(list, dt, t);
    updateWorldSpawn(dt, t);
    updateRockets(dt, t);
    updateStones(dt, t);
    updateGifts(dt, t);
    updateWEV(dt);
    updateMFX(dt);

    /* A dragging hand used to throw off ripples as it went. It no
       longer does: a swipe is a different act from a press, and it has
       its own light, its own sound and its own stirring. Mixing the
       press's ripples into it made both harder to read. */

    /* ---- shoving with a palm or several fingers ----------
       Only under unmistakable conditions: two or more contacts
       bunched within a hand's width of each other, or one contact
       the browser reports as broad, AND actually moving. Anything
       looser would fire by accident during ordinary two-finger
       play, so a lone finger can never do this however fast it
       moves. A shove also cancels those pointers' charges, since
       you plainly meant to push rather than to gather. */
    shoves.length = 0;
    if (list.length >= 1) {
      var usedS = [];
      for (var si2 = 0; si2 < list.length; si2++) usedS.push(false);
      for (var a3 = 0; a3 < list.length; a3++) {
        if (usedS[a3]) continue;
        var members = [list[a3]];
        usedS[a3] = true;
        for (var b3 = a3 + 1; b3 < list.length; b3++) {
          if (usedS[b3]) continue;
          for (var m3 = 0; m3 < members.length; m3++) {
            var ddx3 = list[b3].x - members[m3].x, ddy3 = list[b3].y - members[m3].y;
            if (ddx3 * ddx3 + ddy3 * ddy3 < 150 * 150) { members.push(list[b3]); usedS[b3] = true; break; }
          }
        }
        var broad = members.length === 1 && members[0].broad > 26;
        if (members.length < 2 && !broad) continue;
        var sx3 = 0, sy3 = 0, svx = 0, svy = 0, spd3 = 0;
        for (var q3 = 0; q3 < members.length; q3++) {
          sx3 += members[q3].x; sy3 += members[q3].y;
          svx += members[q3].vx; svy += members[q3].vy;
          spd3 += members[q3].path;
        }
        var nM = members.length;
        sx3 /= nM; sy3 /= nM; svx /= nM; svy /= nM; spd3 /= nM;
        if (spd3 < 130) continue;                     // must actually be moving
        var spread3 = 0;
        for (var w3 = 0; w3 < nM; w3++) {
          spread3 = Math.max(spread3, Math.hypot(members[w3].x - sx3, members[w3].y - sy3));
        }
        var rad3 = spread3 + (broad ? members[0].broad * 2.4 : 96);
        /* A palm, or a whole hand's worth of fingers, is not a nudge - it is
           a plough. Everything in front of it goes the way the hand is going
           and keeps going, rather than being pushed politely aside. */
        var plow = broad || nM >= 3;
        if (plow) rad3 *= 1.5;
        shoves.push({ x: sx3, y: sy3, vx: svx, vy: svy, r: rad3, n: nM,
                      spd: spd3, plow: plow });
        for (var c3 = 0; c3 < nM; c3++) {
          if (members[c3].charging) {
            members[c3].chargeCancelled = true;
            releaseCharge(members[c3], t);
            members[c3].chargeCancelled = false;
          }
        }
      }
    }

    world.energy = approach(world.energy, clamp(totalPath / 900 + pulses.length / 26, 0, 1), 1.2, dt);
    world.calm = approach(world.calm, active ? 0 : 1, active ? 3 : 30, dt);

    /* Left alone, it goes to sleep: slower, dimmer, quieter, and the
       painting itself begins to drift more lazily. Coming back to it
       wakes it, which gives a long session a shape - it is nice to be
       greeted. */
    if (active) { world.idle = 0; } else { world.idle += dt; }
    var sleepTarget = world.idle > 40 ? 1 : 0;
    world.sleep = approach(world.sleep, sleepTarget, sleepTarget ? 22 : 1.6, dt);
    world.wake = Math.max(0, world.wake - dt * 0.7);
    var awake = (1 - world.calm * 0.45) * (1 - world.sleep * 0.42) + world.wake * 0.35;
    momentK = momentLevel(t);
    updateScan(dt, t);
    updateEmber(dt, t);
    updateBubbleSpawn(dt, t);
    updateSeqs(dt, t);
    updateBubbles(dt, t);
    updateWants(dt, t);
    updateBands(dt, t);
    /* Adaptive generosity: if presses keep finding nothing, quietly widen
       what counts as a hit. It settles back once they are landing again, so
       a child who is getting the hang of it is not helped forever. */
    /* Only where it has been asked for. Widening every creature's reach helps
       somebody who cannot aim, but it does it by eating the open space - and
       open space is not empty, it is the instrument. At the top of the ladder
       that trade is wrong twice over: the place-notes stop sounding because
       the tap gets captured by a creature, and a wind-up cannot find anywhere
       to start. So the default experience never widens anything. */
    if (LEVEL <= 2 && aimHit + aimMiss >= 6) {
      var missRate = aimMiss / (aimHit + aimMiss);
      assist = approach(assist, clamp((missRate - 0.35) * 1.8, 0, 1), 6, dt);
      if (aimHit + aimMiss > 24) { aimHit *= 0.5; aimMiss *= 0.5; }
    } else if (LEVEL > 2 && assist !== 0) {
      assist = approach(assist, 0, 2, dt);
    }
    updateBloom(dt, t);
    runLater(t);
    if (world.hintCool > 0) world.hintCool -= dt;

    /* ---- audio bed follows the ecosystem's mood ---- */
    /* One answer works by SUBTRACTING: the room's drone and air drop away
       for a moment so your own note rings out into a sudden emptiness. That
       needs a factor the per-frame audio update respects, or it would be
       overwritten sixty times a second. */
    duck = approach(duck, t < duckUntil ? 0.12 : 1, t < duckUntil ? 0.10 : 0.55, dt);
    /* And a gentler version of the same idea under a phrase: the air steps back
       so the tune sits in front of it, but it does not drop out altogether the
       way it does for a hollow - five seconds of true silence underneath would
       be its own kind of event. */
    pDuck = approach(pDuck, t < phraseUntil ? 0.28 : 1, 0.7, dt);
    if (A.ok && A.started) {
      var ac = A.ctx;
      // the drone carries the flow, so it sits a touch higher, and a gathering
      // opens it up rather than making it louder
      A.bed.gain.setTargetAtTime((0.026 + world.energy * 0.17) * (1 + bloom.k * 0.85) *
                                 (1 - world.sleep * 0.45) * duck * pDuck,
                                 ac.currentTime, 0.8);
      A.bedLp.frequency.setTargetAtTime(300 + world.energy * 520 + bloom.k * 420,
                                        ac.currentTime, 1.5);
      /* Squared, because energy saturates almost immediately - a single drag
         puts it at 1 - so a linear term meant the bed sat at its loudest
         through any ordinary play. Squaring keeps it low until the room really
         is busy, and it fades as the world falls asleep. */
      /* Brought back up a little - it had gone too far the other way, and the
         air is what holds the room together. Still less than half of what it
         once peaked at, and it no longer pumps. Quietened during a gathering,
         so that what swells then is warmth rather than hiss. */
      var nzE = world.energy * world.energy;
      A.nzG.gain.setTargetAtTime((0.015 + nzE * 0.023) * (1 - world.sleep * 0.55) *
                                 (1 - bloom.k * 0.35) * duck * pDuck,
                                 ac.currentTime, 0.35);
      A.nzF.frequency.setTargetAtTime(210 + nzE * 420 + pal.band * 300, ac.currentTime, 2.6);
      A.wet.gain.setTargetAtTime(0.5 + world.calm * 0.25 + bloom.k * 0.22,
                                ac.currentTime, 1.5);
      /* Everything that is not the phrase, right down. Not silent - a room that
         stops dead is its own event, and the creatures carrying on quietly
         underneath is what makes the tune sound like it belongs here rather
         than like the app paused to play it. */
      var inPhrase = t < phraseUntil;
      A.scene.gain.setTargetAtTime(inPhrase ? 0.16 : 1,
                                   ac.currentTime, inPhrase ? 0.06 : 0.5);
      /* Not as far down as the scenery. These are notes the child played on
         purpose and cutting them dead would read as the app taking the
         instrument away; a step back is enough for the phrase to sit in front.
         Ducked FAST, because the whole problem is the sound that is already
         ringing when the diamond is tapped. */
      A.play.gain.setTargetAtTime(inPhrase ? 0.22 : 1,
                                  ac.currentTime, inPhrase ? 0.05 : 0.45);
    }

    /* ---- backdrop ---- */
    drawBackground(t, dt);

    /* ---- fade the accumulation buffer ---- */
    tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    tctx.globalCompositeOperation = 'source-over';
    tctx.globalAlpha = 1;
    tctx.fillStyle = 'rgba(0,0,0,0.075)';
    tctx.fillRect(0, 0, W, H);
    dith ^= 1;
    if (dith && noisePat) {
      var ox = (Math.random() * 128) | 0, oy = (Math.random() * 128) | 0;
      tctx.setTransform(1, 0, 0, 1, ox, oy);
      tctx.globalCompositeOperation = 'difference';
      tctx.fillStyle = noisePat;
      tctx.fillRect(-ox, -oy, PW, PH);
      tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    tctx.globalCompositeOperation = 'lighter';

    /* ---- swipes leave their mark ---- */
    for (var sk = 0; sk < list.length; sk++) {
      var kp = list[sk];
      if (!kp.down || kp.holding) {
        // hovering a mouse across the window must leave nothing behind
        if (kp.strokeOn) { kp.strokeOn = false; traceReset(kp); }
        endStrokeVoice(kp);
        continue;
      }
      strokeStep(kp, dt, t, awake);
      strokeVoice(kp, t);
    }

    /* ---- impulses travel ---- */
    for (var pi = pulses.length - 1; pi >= 0; pi--) {
      var P = pulses[pi];
      var pr = P.r;
      P.r += P.speed * dt;
      P.life = 1 - clamp(P.r / P.reach, 0, 1);
      if (P.r > P.reach) { pulses.splice(pi, 1); continue; }

      /* Only while it still has anyone left to touch. This used to be tested
         per creature, so a spent wave went on scanning the whole population
         every frame until it expired. */
      if (P.budget > 0) {
        var pr2 = pr * pr, pR2 = P.r * P.r;
        for (var ci = 0; ci < creatures.length; ci++) {
          var cc = creatures[ci];
          if (cc.vit < 0.3 || P.hit[ci]) continue;
          if (!layerHit(P, cc.L)) continue;
          var ddx = cc.x - P.x, ddy = cc.y - P.y;
          var dd2 = ddx * ddx + ddy * ddy;
          if (dd2 >= pr2 && dd2 < pR2) {
            P.hit[ci] = 1;
            if (receive(cc, P, t)) P.budget--;
            if (P.budget <= 0) break;
          }
        }
      }
      // the wavefront itself, faint - you can see the news travelling
      // drawn every other frame: into an accumulating buffer a ring
      // redrawn each frame stacks into a solid band of concentric lines
      if (P.show > 0.05 && P.life > 0.02 && dith) {
        // the colour slides along the wheel as the front travels out
        var wh = P.hue + 40 + (1 - P.life) * P.hueSpan;
        wave(tctx, P.x, P.y, P.r / 0.9, wh,
             P.life * P.life * 0.20 * P.show * P.energy * (0.5 + awake * 0.5));
      }
    }

    /* ---- creatures ---- */
    /* dt does not change within a frame, so anything derived from it alone is
       computed once here rather than once per creature. */
    /* one world at a time. Counted before anything moves, so the decision
       to let something else grow is made on this frame's truth. */
    heavyCount = 0;
    for (var hv = 0; hv < creatures.length; hv++) {
      if (creatures[hv].vit > 0.3 && creatures[hv].world) heavyCount++;
    }
    var DAMP = Math.pow(0.974, dt * 60);
    var SPINDAMP = Math.pow(0.985, dt * 60);
    var target = Math.min(creatures.length,
      Math.round((clamp((W * H) / 24000, 26, 74) + world.pop) * paceAmt()));
    world.pop = Math.max(0, world.pop - dt * 0.05);
    for (var k2 = 0; k2 < creatures.length; k2++) {
      var c = creatures[k2];
      var L = LAYERS[c.L];
      /* Hushed: sent away by the ember and not back yet. It fades out over
         about a fifth of a second, and then it is simply not there - not
         drawn, not simulated, not recycled into a fresh one - until its own
         timer runs out. Without this the pool handed back a replacement on
         the very next frame and the room never actually emptied. */
      if (c.hush > 0) {
        c.hush -= dt;
        c.vit = approach(c.vit, 0, 5, dt);
        if (c.hush <= 0) {
          var hc = makeCreature();
          creatures[k2] = hc;
          hc.vit = 0; hc.age = 0; hc.flare = 1;
        }
        continue;
      }
      /* Never cull one being carried, and never cull a world. A world is
         something somebody made on purpose and it has its own way of ending -
         worn away under a hand, or settling back down over a few minutes, both
         of which go through unWorld and get the send-off. Quietly thinning one
         out because the population drifted over its cap is not that. */
      var alive = k2 < target || !!c.held || c.world;
      c.age += dt;
      /* A world does not die of old age either. It has exactly two ends -
         worn away under a hand, or settling back down over minutes - and both
         go through unWorld, which gives it the send-off. An ember has one job
         and has to survive long enough to be found and held. */
      var vt = (alive && (c.age < c.span || c.held || c.world || c.ember)) ? 1 : 0;
      /* While the dial is open the population follows in under a second rather
         than over five, so dragging it shows you the room you are choosing
         instead of the room you had. Back to the gentle rates as soon as it is
         put away, because outside of that moment things arriving and leaving
         should not be abrupt. */
      var vtau = paceUI.open ? 0.3 : (vt > c.vit ? 1.2 : 2.2);
      c.vit = approach(c.vit, vt, vtau, dt);
      /* Some coming and going, but not much: about one creature a
         minute quietly thins away and another fades up somewhere
         else, so the population feels alive rather than fixed. */
      /* The quiet thinning, which must not reach a world or the ember. This was
         the last way a planet could vanish without earning it: a one-in-eight
         chance per world per thirty seconds of simply being marked for death,
         which is exactly what killed one in testing. */
      if (!c.held && !c.world && !c.ember && c.age > 12 && Math.random() < dt * 0.004) {
        c.span = Math.min(c.span, c.age + 2.5);
      }
      if (c.vit < 0.03 && vt === 0) {
        if (alive && c.age >= c.span) {
          c.world = false; c.crust = null;
          for (var dg = 0; dg < 10; dg++) emitSpark(c.x, c.y, 0, 0, world.hue + c.hueOff, 0.5);
          // never leave a hand holding a creature that no longer exists
          if (c.held) { c.held.holding = null; c.held.cand = null; c.held = null; }
          for (var fo = 0; fo < creatures.length; fo++) {
            if (creatures[fo].follow === c) creatures[fo].follow = null;
          }
          var nc = makeCreature();
          creatures[k2] = nc; nc.vit = 0;
        }
        continue;
      }
      if (c.cool > 0) c.cool -= dt;
      // a merged one is briefly huge, then settles back down
      if (c.sizeGoal > 0) {
        c.size = approach(c.size, c.sizeGoal, 4.5, dt);
        if (Math.abs(c.size - c.sizeGoal) < 0.6) { c.size = c.sizeGoal; c.sizeGoal = 0; }
      }
      // Only fade the cue once nobody is courting it. Decaying it while
      // it is still being approached fought the proximity value every
      // frame, so the signal only surfaced once you were almost touching.
      if (c.antic > 0 && (!c.pairWith || !c.pairWith.held)) {
        c.antic = Math.max(0, c.antic - dt * 1.8);
        c.locked = false;
      }
      // a stance toward someone fades, and then they are strangers again
      if (c.socCool > 0) c.socCool -= dt;
      if (c.socT > 0) { c.socT -= dt; applyStance(c, dt); }
      if (c.spot) applySpot(c, dt);
      if (c.chase) applyChase(c, dt);
      if (c.wantCool > 0) c.wantCool -= dt;
      if (c.feed) runFeed(c, dt, t);
      runOrbit(c, dt, t);
      updateEscape(c, dt, t);          // re-established by the pair loop each frame
      if (c.want) steerToWant(c, dt, t);
      if (c.band) inBand(c, dt);
      else if (c.with) { c.with = null; c.stance = null; c.socCool = 4 + Math.random() * 10; }
      c.mood = Math.max(0, c.mood - dt * 0.22);
      c.glowAdd = Math.max(0, c.glowAdd - dt * 1.1);
      if (c.react) { c.rt += dt; if (c.rt > c.rdur) { c.react = null; } }

      /* Drift. The shared field is deliberately weak and each
         creature carries its OWN slowly turning heading: one field
         alone funnels everybody along the same streamlines, which is
         half of why they used to end up in a heap. */
      c.bias += c.biasTurn * dt;
      var fa = Math.sin(c.x * 0.0018 + t * 0.19) + Math.cos(c.y * 0.0021 - t * 0.15);
      var fb = Math.cos(c.x * 0.0009 - t * 0.11) + Math.sin(c.y * 0.0013 + t * 0.13);
      var ang = (fa + fb * 0.8) * 0.75 + c.bias;
      var drive = 26 * L.spd * (0.5 + c.sp.calm * 0.9) * (1 - world.sleep * 0.55);
      c.vx += Math.cos(ang) * drive * dt;
      c.vy += Math.sin(ang) * drive * dt;

      /* Personal space, across layers as well as within one. Reading
         only same-layer neighbours still let the picture look piled
         up, because every layer draws to the same screen. */
      // constant across the whole inner loop, so lifted out of it
      var cR = c.size * L.size;
      for (var nb = k2 + 1; nb < creatures.length; nb++) {
        var o2 = creatures[nb];
        if (o2.vit < 0.3) continue;
        var oxx = o2.x - c.x, oyy = o2.y - c.y;
        var od2 = oxx * oxx + oyy * oyy;
        var sameL = o2.L === c.L;
        var want = (cR + o2.size * LSIZE[o2.L]) * (sameL ? 3.4 : 2.2);
        // something heavy draws in rather than holding off, so it keeps only
        // enough room to have a surface to land on
        // only heavy-and-light get to be close; heavy-and-heavy do not
        if (c.world !== o2.world) want *= 0.30;
        /* Two worlds keep well apart, and firmly. They do not attract each
           other - but each one is dragged about by whatever is going round it,
           so three of them slowly gathered into one overlapping heap in the
           middle of the screen and stopped reading as separate systems. */
        if (c.world && o2.world) {
          var wmin = (cR + o2.size * LSIZE[o2.L]) * 5.5 + 160;
          if (od2 < wmin * wmin && od2 > 1) {
            var wd = Math.sqrt(od2);
            var pushW = (wmin - wd) / wmin * 520;
            c.vx += ((c.x - o2.x) / wd) * pushW * dt;
            c.vy += ((c.y - o2.y) / wd) * pushW * dt;
          }
        }
        // and nothing shoulders aside the world it is going round
        if (c.inOrb === o2 || o2.inOrb === c) want *= 0.12;
        if (od2 < want * want && od2 > 1) {
          var odd = Math.sqrt(od2);
          var push = (1 - odd / want) * (sameL ? 150 : 70);
          c.vx -= (oxx / odd) * push * dt; c.vy -= (oyy / odd) * push * dt;
          o2.vx += (oxx / odd) * push * dt; o2.vy += (oyy / odd) * push * dt;
        } else if (c.world !== o2.world) {
          /* Exactly one of them is a world. Two worlds fall through to
             ordinary personal space above, so they keep well apart instead
             of collapsing into each other. */
          var big = c.world ? c : o2;
          var sml = big === c ? o2 : c;
          var bs = worldR(big);
          // a LOCAL system. At nine times its radius it captured the whole
          // screen and the terrarium collapsed into one heap.
          // far enough to gather a system without swallowing the screen
          /* A smaller catchment than before. The old figure did not shrink with
             the planet - four radii plus a hundred and ninety is two hundred and
             eighty-six pixels around a fifty-pixel planet, nearly six diameters,
             so a much smaller object was reaching out over a LARGER share of the
             screen than the big one did and pulling everything into a ring that
             had got much tighter. Both ends of that were wrong. */
          var reach = bs * 2 + 190;
          /* One knock per VISIT. Timing the gap between contacts was not enough:
             a bounce throws the creature clear and gravity brings it straight
             back, so a creature resting against a planet is not in constant
             contact at all - it is arriving over and over, perfectly correctly,
             about every three and a half seconds. Measured sixteen knocks a
             minute that way, which is the complaint almost unchanged.

             So the sound is claimed once and not released until the creature has
             actually gone away, which is a distance, not a delay. Land on it and
             you hear it; sit on it and you do not; leave and come back and you
             hear it again. */
          if (od2 > reach * reach * 1.4) sml.bumped = 0;
          if (od2 < reach * reach && od2 > 1) {
            var gd = Math.sqrt(od2);
            var gx = (big.x - sml.x) / gd, gy = (big.y - sml.y) / gd;
            /* freeT means "do not capture me again just yet" - it does NOT mean
               "let me through solid matter", and it was gating this entire block
               including the surface. So anything recently thrown clear, by a
               special move or a soap drop or by escaping an orbit of its own,
               sailed straight through the planet. Capture respects freeT; the
               surface respects nothing. */
            var freeNow = sml.freeT > 0;
            /* Not already going round something, and only a few at a time -
               a world with thirty things circling it is a heap, not a system.
               Nearer ones are taken sooner, so it fills from the inside out. */
            /* Some of them simply do not care. Four in ten are born aloof and
               are never captured at all - they wander through the system, bounce
               off the surface and carry on. A planet where EVERYTHING within
               reach ends up in a neat ring looks like a machine, and it also
               drains the rest of the screen; leaving most things indifferent is
               what makes the ones that do go round look like a choice. */
            if (!sml.inOrb && !sml.aloof && !freeNow) {
              var going = 0;
              for (var oc = 0; oc < creatures.length; oc++) {
                if (creatures[oc].inOrb === big) going++;
              }
              var eager = (1 - gd / reach) * 1.4;
              /* Three, not five - and taken more readily than before, because
                 cutting the catchment and the pull together left a planet with
                 one lonely moon. Measured at one; the point was never to empty
                 the system, only to stop it piling into a heap. Three spread
                 over a ring that is now four times the area is about a fifth of
                 the old density, which is where the blobbing lived. */
              /* And only things SMALLER than the planet may go round it. Two
                 reasons, and the second is the one that was actually causing
                 trouble. A moon larger than the world it circles reads as a
                 mistake; and a big one on the deep layer is drawn at nearly
                 forty pixels of radius, so two of them on neighbouring rings
                 forty pixels apart still overlap by half their width whatever
                 the spacing. Capping the passengers is what makes the spacing
                 mean something.

                 Sized against the POPULATION, not against the planet. The first
                 attempt required a moon smaller than 0.85 of the planet's
                 radius, which is twenty-one pixels - and the median creature is
                 twenty-four, so more than half the room was disqualified on top
                 of the two-thirds that are born aloof. Planets ended up with
                 less than one moon each. Loosening it to 1.5 then let two big
                 ones onto neighbouring rings, where their bodies overlap by half
                 their width whatever the spacing - measured at twenty-seven of
                 fifty-six samples.

                 The cap has nothing to do with the planet. It is the RING GAP:
                 two moons must fit between one orbit and the next, so each may
                 be at most half of it. That number happens to sit just above the
                 median creature, which is why most of the room still qualifies
                 and the systems stay populated. */
              var mr = sml.size * LSIZE[sml.L];
              if (going < 3 && mr < ORB_GAP * 0.52 &&
                  Math.random() < dt * eager * 1.25) captureOrbit(sml, big, t);
            }
            if (!sml.inOrb && !sml.aloof && !freeNow) {
              // still outside the system: a gentle draw, so it drifts closer
              // and it pulls a little more gently, so passers-by are not all reeled in
              var g = 170 * (1 - world.sleep * 0.5);
              sml.vx += gx * g * dt * 0.5;
              sml.vy += gy * g * dt * 0.5;
            }
            /* ANYTHING not actually in an orbit bounces off the surface, aloof
               or not. A planet is a solid object; the only things that may pass
               into it are the few it has captured, and even they only go in
               once their path has decayed all the way down. Everything else
               arrives, bounces, and carries on - which is what stops a planet
               quietly hoovering up the room. */
            if (!sml.inOrb) {
              // just OUTSIDE the visible edge, which is where a surface is
              var surf = bs * 1.06 + sml.size * LSIZE[sml.L] * 0.7;
              if (gd < surf) {
                /* A bump is an ARRIVAL, not a state of being in contact.
                   ------------------------------------------------------------
                   The reaction fired whenever the creature was moving inwards
                   and its refractory timer had run out, and those two are true
                   over and over for anything resting against a planet: gravity
                   pushes it in, the bounce pushes it out, and half a second
                   later it does it again. So one creature parked on the surface
                   knocked and squeaked indefinitely - reported for the ember,
                   which loiters there most, but every creature did it.

                   Two conditions now. It has to have been AWAY a moment ago, so
                   sitting there is silent however hard gravity presses; and it
                   has to arrive with some speed behind it, so drifting onto the
                   surface is a touch rather than a knock. Landing on something
                   still deserves a sound - it is the same event repeating that
                   does not. */
                var away = !sml.bumped;
                sml.x = big.x - gx * surf; sml.y = big.y - gy * surf;
                var into2 = sml.vx * gx + sml.vy * gy;
                if (into2 > 0) {
                  sml.vx -= gx * into2 * 1.7; sml.vy -= gy * into2 * 1.7;
                  if (away && into2 > 55 && sml.cool <= 0) {
                    sml.bumped = 1;
                    startReaction(sml, pick(['bob', 'wobble', 'hiccup']), 0.4,
                                  world.hue + sml.hueOff, t, null);
                  }
                }
              }
            }
            // the big one feels it too, a little, so it is not a fixed post
            var back = sml.size / Math.max(1, big.size) * 0.1;
            big.vx -= gx * 120 * back * dt;
            big.vy -= gy * 120 * back * dt;
            /* Anything that is NOT in an orbit and has drifted onto the surface
               still falls in. Things that are going round properly are dealt
               with by runOrbit, which only lets them in once their path has
               decayed to the surface. */
            var rvx = sml.vx - big.vx, rvy = sml.vy - big.vy;
            var slow = (rvx * rvx + rvy * rvy) < 90 * 90;
            // and the same contact test for anything not in an orbit at all
            if (!sml.inOrb && !sml.aloof && !freeNow &&
                gd < bs + sml.size * LSIZE[sml.L] * 0.62 && slow &&
                sml.size < big.size * 0.72 &&
                !sml.held && !big.held && big.world) {
              swallow(big, sml, now());
            }
          }
        } else if (od2 < AFF_R * AFF_R && od2 > 1) {
          // outside touching distance, kinds lean towards or away from
          // each other - far too gently to catch it happening
          var af = AFF[c.sp.i * 8 + o2.sp.i];
          if (af) {
            var ad = Math.sqrt(od2);
            var f3 = af * 22 * (1 - ad / AFF_R) * (1 - world.sleep * 0.6) * dt;
            c.vx += (oxx / ad) * f3; c.vy += (oyy / ad) * f3;
            o2.vx -= (oxx / ad) * f3; o2.vy -= (oyy / ad) * f3;
          }
        }
      }

      // being swept along by a palm or a bunch of fingers
      for (var sv = 0; sv < shoves.length; sv++) {
        var S3 = shoves[sv];
        var sdx = c.x - S3.x, sdy = c.y - S3.y;
        var sd = Math.sqrt(sdx * sdx + sdy * sdy);
        if (sd > S3.r) continue;
        var w4 = 1 - sd / S3.r;
        if (S3.plow) {
          /* only what is in FRONT of it, and it goes where the hand goes */
          var hv = Math.sqrt(S3.vx * S3.vx + S3.vy * S3.vy) + 1;
          var hx = S3.vx / hv, hy = S3.vy / hv;
          var ahead = (sdx * hx + sdy * hy) / (sd + 1);
          if (ahead > -0.35) {
            var push4 = w4 * (0.55 + ahead * 0.75);
            c.vx += (S3.vx * 1.5 - c.vx * 0.6) * push4 * dt * 3.4;
            c.vy += (S3.vy * 1.5 - c.vy * 0.6) * push4 * dt * 3.4;
            c.mood = Math.max(c.mood, w4 * 0.8);
            if (Math.random() < dt * 1.6 * w4) {
              startReaction(c, pick(['tumble', 'scamper', 'wobble', 'squat']),
                            0.3 + w4 * 0.5, world.hue, t, null);
            }
          }
        } else {
          c.vx += (S3.vx * 0.9 + (sdx / (sd + 1)) * 40) * w4 * w4 * dt * 3.2;
          c.vy += (S3.vy * 0.9 + (sdy / (sd + 1)) * 40) * w4 * w4 * dt * 3.2;
          c.mood = Math.max(c.mood, w4 * 0.7);
        }
      }

      /* A hand nearby: gentle draws them, agitated scatters them. Only
         while actually touching, and only close by. A resting cursor
         scores maximum gentleness and maximum hold, so an untouched
         hover used to quietly hoover the whole ecosystem into one pile
         in the middle - which looked like the world had a bug even
         though nobody had done anything. */
      for (var pj = 0; pj < list.length; pj++) {
        var pt = list[pj];
        if (!pt.down) continue;
        var hdx = pt.x - c.x, hdy = pt.y - c.y;
        var hd = Math.sqrt(hdx * hdx + hdy * hdy) + 1;
        var gentle = 1 - clamp(pt.path / 420, 0, 1) * 2;
        var reach2 = clamp(1 - hd / (DIAG * 0.16), 0, 1);
        /* A hand that is carrying something is busy and should not also be
           drawing a crowd around what it carries; and a hand winding
           something up should not be reeling them onto itself, though they
           are still welcome to drift over and be curious about it. */
        var busy = pt.holding ? 0.35 : (pt.charging ? 0.42 : 1);
        var f2 = gentle * reach2 * (26 + pt.hold * 40) * L.par * busy;
        c.vx += (hdx / hd) * f2 * dt; c.vy += (hdy / hd) * f2 * dt;
        if (hd < 90) {
          c.vx -= (hdx / hd) * (1 - hd / 90) * 150 * dt;
          c.vy -= (hdy / hd) * (1 - hd / 90) * 150 * dt;
        }
        /* Twice per session, until the player has touched one, a
           creature near an unhurried hand pulses to say it can be
           touched. That is the whole tutorial. */
        if (world.hints > 0 && world.poked === 0 && world.hintCool <= 0 &&
            hd < 150 && pt.path < 110 && c.vit > 0.7) {
          world.hints--; world.hintCool = 40;
          startReaction(c, 'pulse', 0.8, world.hue, t, null);
        }
      }

      // following someone who was picked up
      if (c.follow) {
        c.followT -= dt;
        if (c.followT <= 0 || c.follow.vit < 0.2) c.follow = null;
        else {
          var fdx = c.follow.x - c.x, fdy = c.follow.y - c.y;
          var fdd = Math.sqrt(fdx * fdx + fdy * fdy) + 1;
          if (fdd > 70) { c.vx += (fdx / fdd) * 150 * dt; c.vy += (fdy / fdd) * 150 * dt; }
        }
      }
      if (c.held) updateGrab(c, dt, t);

      // lighter damping than before, so movement carries and glides.
      // updateGrab does its own damping, so a held one is left alone.
      // updateGrab already placed a held creature and derived its
      // velocity, so integrating again would move it twice
      if (!c.held) {
        c.vx *= DAMP; c.vy *= DAMP;
        var sp2 = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
        /* A ball is not bound by its layer. Layers exist to make far things
           drift slowly and near things move freely, which is right for
           creatures - but it capped the ball's speed and then scaled down the
           distance it actually covered, so the same object was slowed twice and
           bounced like something underwater. */
        var vmax = 340 * L.spd * (c.elder ? 0.52 : 1);
        if (sp2 > vmax) { c.vx *= vmax / sp2; c.vy *= vmax / sp2; }
        var par = L.par;
        c.x += c.vx * dt * par; c.y += c.vy * dt * par;
      }
      keepOutOfCharges(c);        // nothing sits on a wind-up, whatever its speed
      keepOutOfWorlds(c);         // nor inside a planet, by any route at all
      c.rot += c.spin * dt;
      c.spin *= SPINDAMP;
      /* A world turns steadily. Everything else here spins because it was
         knocked and then settles, so the damping is right for them and wrong
         for a planet - left alone it wound down to a stop within seconds and
         the surface stopped telling you it was a world at all. */
      if (c.world) c.spin = c.spinBase;
      c.phase += dt * (1 + c.mood * 2);
      /* A world settles back down over a few minutes, so it is something
         that happens rather than something that has happened. */
      /* ONE ceiling, applied every frame, and nothing can get round it.
         There are ten separate places in this file that grow a creature - a
         poke, being fed at a bloom, a merge, half a dozen reactions - with
         their own caps of 62, 70, 80 and 96, and any of them will happily act
         on a world. Capping them one at a time is how a planet kept turning up
         the size of a dinner plate: I would find three of them and miss the
         fourth. A limit checked here cannot be escaped by a path I have not
         thought of, or by one added later. */
      /* A world's size is not a variable. It is what it was born at, on every
         frame, for ever.

         A ceiling was not enough. Measured: a planet ping-ponging between 117
         and 128 pixels across while it sat there, because the reactions that
         multiply a creature's size - and there are a dozen of them, up by 1.035
         or 1.45 or 1.8, down by 0.9 or 0.6 or 0.4 - all apply happily to a
         world, and the cap only ever caught the ones going up. Pinning it is
         the only version of "one size" that is actually one size, and it costs
         nothing: everything a reaction wants to say about a planet, it can say
         with colour and light. */
      if (c.world) c.size = c.born0;
      if (c.armor > 0) c.armor -= dt;
      /* A planet barely drifts. It is the heaviest thing on the screen and it
         should behave like it - the bouncing about that was so good to watch is
         the BALL's job now, and a planet doing the same thing was just the two
         of them competing for the same trick. */
      if (c.world) {
        c.vx *= Math.pow(0.93, dt * 60);
        c.vy *= Math.pow(0.93, dt * 60);
        var wsp = Math.hypot(c.vx, c.vy);
        // measured at the old cap of seventy, which crosses the screen in under
        // twenty seconds - a drift you notice. This is a third of that.
        if (wsp > 22) { c.vx *= 22 / wsp; c.vy *= 22 / wsp; }
      }
      /* Its life is a CLOCK, not a slow shrink. The size decay that used to end
         a planet also meant it was quietly getting smaller the whole time it
         was on screen, which is not "one size" by any reading - and with the
         size now fixed, that death could never arrive at all, so three planets
         would have sat there for ever and the next child could not make one.

         So it lasts three to six minutes at full size and then goes, with the
         same send-off it always had. */
      if (c.world && c.age > c.span) unWorld(c, t);

      /* Energy put into wearing one down drains away when the hand stops. The
         grace period is what lets a back-and-forth count as one continuous
         effort rather than a series of separate ones that each start over. */
      if (c.world && c.wear > 0 && t - (c.wearAt || 0) > 0.35) {
        c.wear = Math.max(0, c.wear - dt * 0.42);
      }

      var mg = 70;
      if (c.x < -mg) c.x += W + mg * 2; else if (c.x > W + mg) c.x -= W + mg * 2;
      if (c.y < -mg) c.y += H + mg * 2; else if (c.y > H + mg) c.y -= H + mg * 2;

      // tail sampled by DISTANCE: sampling by time collapses the whole
      // trail onto one point whenever a creature is moving slowly
      var lp = c.tail[c.head];
      if (Math.abs(c.x - lp.x) + Math.abs(c.y - lp.y) > 6) {
        c.head = (c.head + 1) % c.tail.length;
        c.tail[c.head].x = c.x; c.tail[c.head].y = c.y;
      } else { lp.x = lerp(lp.x, c.x, 0.3); lp.y = lerp(lp.y, c.y, 0.3); }

      drawAnticipation(c, t, awake);
      drawCreature(c, t, awake);
    }

    drawWEV(t);
    drawMFX(t);
    drawRockets(t, awake);
    drawSeqs(t, awake);
    drawWants(t, awake);
    drawFeeds(t, awake);
    drawMoment(t, awake);
    drawScan(t, awake);
    updateCtrls(dt, t);
    updateClump(dt, t);
    drawClump(t, awake);

    /* ---- sparks ---- */
    var sd = Math.pow(0.955, dt * 60);
    for (var s3 = 0; s3 < sparks.length; s3++) {
      var S = sparks[s3];
      if (S.life <= 0) continue;
      S.life -= dt;
      S.vx *= sd; S.vy = S.vy * sd + 12 * dt;
      S.x += S.vx * dt; S.y += S.vy * dt;
      var lu = clamp(S.life / S.max, 0, 1);
      blob(tctx, S.x, S.y, S.r * (0.4 + lu * 1.3), S.hue + (1 - lu) * 40,
           Math.sin(lu * Math.PI) * 0.4 * (0.55 + awake * 0.45));
    }

    /* ---- the hand ---- */
    /* A whole hand is worth more than a finger.
       ------------------------------------------------------------
       Nothing here used to care how many fingers were on the glass, so there
       was no reason to use more than one. Now a moving hand rakes the water it
       is moving through - one furrow per finger, cut across the direction of
       travel so they read as the marks of a comb rather than as one wide smear
       - and the whole thing gets stronger with every extra finger. There is no
       trick to it and nothing to get right; five fingers simply plough more
       than one, immediately, which is the only kind of reward this app should
       be handing out. */
    var handN = 0;
    for (var hn = 0; hn < list.length; hn++) if (list[hn].down) handN++;
    var rakeK = 1 + (handN - 1) * 0.55;
    for (var hI = 0; hI < list.length; hI++) {
      var hp = list[hI];
      if (hp.down) {
        var hsp = Math.hypot(hp.vx, hp.vy);
        if (hsp > 140) {
          var ux2 = hp.vx / hsp, uy2 = hp.vy / hsp;
          /* Across the travel, not along it. A furrow is the mark left beside
             where the tooth went, so the teeth are laid out on the
             perpendicular and each one turns the water its own way. */
          var tine = Math.min(3, handN);
          for (var ti = 0; ti < tine; ti++) {
            var off = (ti - (tine - 1) * 0.5) * 26;
            var sgn = (ti & 1) ? -1 : 1;
            addStir(hp.x - uy2 * off, hp.y + ux2 * off,
                    0.055 * sgn * rakeK * clamp(hsp / 900, 0.3, 1.2), 0.16);
            blob(tctx, hp.x - uy2 * off, hp.y + ux2 * off,
                 5 + rakeK * 2.5, world.hue + 40 + ti * 26,
                 0.05 * clamp(hsp / 700, 0.2, 1));
          }
        }
      }
      var pw = clamp(hp.path / 900, 0, 1);
      // a still hand redraws the same pixels every frame, so alpha here
      // is dose-per-frame, not brightness; without this it burns a disc
      var dose = 0.10 + 0.90 * clamp(hp.path / 260, 0, 1);
      blob(tctx, hp.x, hp.y, 26 + hp.hold * 26, world.hue + 30,
           (0.03 + hp.hold * 0.04) * (0.4 + dose * 0.6));
      blob(tctx, hp.x, hp.y, 8 + pw * 14, world.hue + 60, 0.4 * dose);
      blob(tctx, hp.x, hp.y, 3 + pw * 4, world.hue + 130, 0.6 * dose);

      /* Winding one up. Rings CONTRACT inward rather than expanding,
         because the shape has to say gathering, not emitting, and
         motes spiral in with them. The core swells with how much you
         have collected, so the amount is legible before you let go. */
      if (hp.charging) {
        var ck = chargeLevel(hp, t);
        var chue = (hp.hue || world.hue) + 30 + ck * 60;
        for (var ri2 = 0; ri2 < 3; ri2++) {
          var ph2 = (t * 0.85 + ri2 / 3) % 1;
          var rr2 = (1 - ph2) * (46 + ck * 150) + 10;
          wave(tctx, hp.x, hp.y, rr2, chue + ri2 * 42 + ph2 * 90,
               (0.05 + ck * 0.22) * ph2 * (0.4 + awake * 0.6));
        }
        for (var mo2 = 0; mo2 < 5; mo2++) {
          var ma = t * 2.1 + mo2 * (TAU / 5);
          var md = (1 - ((t * 0.7 + mo2 * 0.2) % 1)) * (34 + ck * 120) + 6;
          blob(tctx, hp.x + Math.cos(ma) * md, hp.y + Math.sin(ma) * md,
               3 + ck * 5, chue + 40, (0.16 + ck * 0.34));
        }
        // the edge of the little world: faint, but it explains the ring
        wave(tctx, hp.x, hp.y, 58 + ck * 44, chue + 20,
             (0.05 + ck * 0.10) * (0.4 + awake * 0.6));
        blob(tctx, hp.x, hp.y, 10 + ck * 34, chue, 0.10 + ck * 0.34);
        blob(tctx, hp.x, hp.y, 4 + ck * 12, chue + 70, 0.30 + ck * 0.55);
      }
    }

    // the sweep itself, so a shove is visible as well as felt
    for (var sh2 = 0; sh2 < shoves.length; sh2++) {
      var SH = shoves[sh2];
      var svl = Math.hypot(SH.vx, SH.vy) + 1;
      var sux = SH.vx / svl, suy = SH.vy / svl;
      var sstr = clamp(SH.spd / 900, 0, 1);
      for (var sb = 0; sb < 5; sb++) {
        var su = (sb / 4 - 0.5);
        blob(tctx, SH.x - sux * su * SH.r * 0.5 - suy * su * SH.r * 0.9,
                   SH.y - suy * su * SH.r * 0.5 + sux * su * SH.r * 0.9,
             SH.r * 0.5, world.hue + 40, 0.03 + sstr * 0.05);
      }
    }

    /* ---- composite ---- */
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    if (GL.ok) {
      ctx.drawImage(GL.cv, 0, 0, PW, PH);      // the liquid field, underneath
    } else {
      ctx.fillStyle = '#0b0b18';
      ctx.fillRect(0, 0, PW, PH);
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(trail, 0, 0, PW, PH);        // the living things, above

    /* ---- the solid things ------------------------------------------------
       ABOVE the trail, and below the bloom. Underneath the trail they were
       washed almost transparent: the trail is composited with lighter, so the
       whole accumulated glow of the room was added on top of the planet and
       the surface disappeared into it.

       Above the trail the surface reads, and the bloom pass that follows still
       lays every nearby glow back over it - so a bright thing passing in front
       shows as light across the planet's face, and the planet keeps its halo.
       Drawn a little short of full opacity, so there is still a hint of the
       room behind it, which is the middle ground worth having. */
    ctx.globalCompositeOperation = 'source-over';
    for (var si = 0; si < SOLIDS.length; si++) {
      var so = SOLIDS[si];
      ctx.globalAlpha = so.a;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(so.cv, so.x * DPR - so.r * DPR, so.y * DPR - so.r * DPR,
                    so.r * 2 * DPR, so.r * 2 * DPR);
    }
    ctx.globalAlpha = 1;
    SOLIDS.length = 0;

    gctx.setTransform(1, 0, 0, 1, 0, 0);
    gctx.globalCompositeOperation = 'source-over';
    gctx.globalAlpha = 1;
    gctx.drawImage(trail, 0, 0, glow.width, glow.height);
    ctx.globalAlpha = 0.42 + world.energy * 0.16;
    ctx.drawImage(glow, 0, 0, PW, PH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    drawBubbles(t);
    drawEmbers();
    drawStonesAndGifts(awake);
    drawWeb(awake);
    drawEnsemble(awake);
    drawFingers(PTR_LIST, awake);
    drawEcho(awake);
    drawWear(t);
    /* NIGHT: a veil over the finished frame, then the controls on top of it.
       Order matters both ways round. Under the veil the moon and the speaker
       would be dimmed along with everything else, and the way out of night mode
       has to stay visible; over it, a black wash is the one honest way to take
       a canvas down in brightness, since nothing on a web page can reach the
       backlight. */
    var nv = nightVeil();
    if (nv > 0.001) {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(0,0,0,' + nv.toFixed(3) + ')';
      ctx.fillRect(0, 0, PW, PH);
    }
    drawCtrls(t);
  }




  /* The charge, drawn as an arc closing round the planet. Without it a child
     swiping at one gets no answer at all until it suddenly goes: the old
     version at least shrank, so you could see you were getting somewhere. This
     is the same information, on the screen canvas above everything, so it stays
     crisp instead of smearing into the trail. */
  function drawWear(t) {
    var any = false;
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (!c.world || !c.wear || c.wear <= 0.02 || c.vit < 0.3) continue;
      any = true;
      var r = (worldR(c) + 9) * DPR;
      var k = clamp(c.wear, 0, 1);
      // it flickers harder the closer it gets, so the top is felt coming
      var jit = k > 0.7 ? (Math.random() - 0.5) * (k - 0.7) * 9 : 0;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.translate(c.x * DPR, c.y * DPR);
      ctx.rotate(-Math.PI / 2 + jit * 0.02);
      ctx.lineCap = 'round';
      ctx.lineWidth = (2 + k * 3.4) * DPR;
      ctx.strokeStyle = 'hsla(' + norm360(world.hue + c.hueOff + 40).toFixed(0) +
                        ',100%,' + (62 + k * 18).toFixed(0) + '%,' +
                        (0.30 + k * 0.55).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(0, 0, r + jit * DPR, 0, TAU * k);
      ctx.stroke();
      ctx.restore();
    }
    if (!any) return;
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }

  /* ---------- boot ---------- */
  bakeBubbles();
  initGL();
  palIdx = (Math.random() * PALS.length) | 0;
  palNext = now() + rnd(34, 80);
  // never open in the dark: the first thing you see is the painting
  bgFieldT = 1; bgField = 1;
  fieldHold = now() + rnd(40, 95);
  setPalette(palIdx, true);
  world.hue = pal.hues[0];
  root = pick([0, 2, 4, 5, 7, 9]);
  buildNotes();
  resize();
  // the spares stay dark; only the live population is lit at the start
  /* Lit to the SETTING, not to the full house. The per-frame target already
     scales with the setting, so a quiet room would settle correctly - but it
     opened with a full crowd and spent the first several seconds fading half of
     them out, which is the busiest thing the app ever does and it did it
     precisely to somebody who had asked for calm. */
  var b0n = Math.round(clamp((W * H) / 24000, 26, 74) * paceAmt());
  for (var b0 = 0; b0 < Math.min(creatures.length, b0n); b0++) creatures[b0].vit = 1;
  createAudio();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
