            if (c.vit < 0.5 || c.held || c.want || c.wantCool > 0) continue;
            var taste = WANT_TASTE[c.sp.i * 3 + WANT_KINDS.indexOf(wa2.kind)] || 0.3;
            var r2 = Math.random() * taste * (0.4 + c.answer);
            if (r2 > best) { best = r2; pick2 = c; }
          }
          if (pick2 && best > 0.30) {
            pick2.want = wa2;
            pick2.wantT = 0;
            // a small tell that it has made up its mind
            startReaction(pick2, 'peek', 0.35, world.hue, t, null);
          }
        }
      }
    }
  }

  function steerToWant(c, dt, t) {
    var wa = c.want;
    if (!wa) return;
    c.wantT += dt;
    var dx = wa.x - c.x, dy = wa.y - c.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    if (d < 46 + c.size) { beginFeed(c, wa, t); return; }
    // gives up if it takes too long, which keeps the screen from filling
    // with things doggedly crossing it
    if (c.wantT > 34) { c.want = null; c.wantCool = 30 + Math.random() * 40; return; }
    var pull = 105 * (0.5 + c.answer * 0.6);
    c.vx += (dx / d) * pull * dt;
    c.vy += (dy / d) * pull * dt;
    c.mood = Math.max(c.mood, 0.22);
  }

  /* ============================================================
     BEING AT A PLACE
     ------------------------------------------------------------
     This used to happen in a single frame: a creature touched a place, the
     place counted it, the creature was changed, done. Nothing to see. Which is
     why the places read as decoration - the one thing they exist to do had no
     duration and therefore no picture.

     Now arriving DOCKS. For a couple of seconds the creature is held just off
     the place, a thread of light runs between the two with light travelling
     along it the right way, the place works visibly harder, and the creature
     fills up. Then it takes whatever the place gives and leaves changed.

     The direction of travel along the thread is the whole tell: you can see
     which way the exchange is going, so it reads as feeding rather than as two
     things happening to glow near each other.
     ============================================================ */
  function beginFeed(c, wa, t) {
    if (c.feed) return;
    c.feed = wa;
    c.feedT = 0;
    c.want = null;
    wa.busy = (wa.busy || 0) + 1;
    wa.k = Math.min(1.35, wa.k + 0.12);
    startReaction(c, wa.kind === 'hollow' ? 'curl' : 'peek', 0.4, wa.hue, t, null);
  }

  function runFeed(c, dt, t) {
    var wa = c.feed;
    if (!wa || wa.k < 0.2) { if (wa) wa.busy = Math.max(0, (wa.busy || 1) - 1); c.feed = null; return; }
    c.feedT += dt;
    var FDUR = 2.3;
    // held just off it, easing in, with a slow turn about it
    var dx = wa.x - c.x, dy = wa.y - c.y;
    var d = Math.hypot(dx, dy) + 1;
    var want = 34 + c.size * 0.8;
    var er = (d - want) * 3.4;
    c.vx += (dx / d) * er * dt;
    c.vy += (dy / d) * er * dt;
    c.vx += (-dy / d) * 26 * dt;
    c.vy += (dx / d) * 26 * dt;
    c.vx *= Math.pow(0.9, dt * 60);
    c.vy *= Math.pow(0.9, dt * 60);
    // and it fills: brighter and a touch larger all the way through
    var u = clamp(c.feedT / FDUR, 0, 1);
    c.glowAdd = Math.max(c.glowAdd, 0.18 + u * 0.5);
    c.mood = Math.max(c.mood, 0.3 + u * 0.5);
    if (Math.random() < dt * 14) {
      emitSpark(wa.x, wa.y, (c.x - wa.x) * 0.9, (c.y - wa.y) * 0.9, wa.hue + rnd(-30, 30), 0.5);
    }
    if (c.feedT >= FDUR) {
      wa.busy = Math.max(0, (wa.busy || 1) - 1);
      c.feed = null;
      arriveAt(c, wa, t);
    }
  }

  /* The thread between a place and whatever is at it. Drawn from the place
     towards the creature with beads running that way, so which way the
     exchange is going is never in doubt. */
  function drawFeeds(t, awake) {
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      var wa = c.feed;
      if (!wa || c.vit < 0.2) continue;
      var u = clamp(c.feedT / 2.3, 0, 1);
      var br = (0.4 + awake * 0.6);
      var dx = c.x - wa.x, dy = c.y - wa.y;
      var seg = 9;
      for (var q = 0; q <= seg; q++) {
        var v = q / seg;
        // a gentle bow, so it is a thread and not a ruled line
        var bow = Math.sin(v * Math.PI) * 13 * Math.sin(t * 1.3 + i);
        var px = wa.x + dx * v - (dy / (Math.hypot(dx, dy) + 1)) * bow;
        var py = wa.y + dy * v + (dx / (Math.hypot(dx, dy) + 1)) * bow;
        blob(tctx, px, py, 3.4 + (1 - v) * 2.6, wa.hue + 30 + v * 40,
             0.05 * br * (0.5 + u * 0.6));
      }
      // and three beads travelling along it, the way the gift is going
      for (var b2 = 0; b2 < 3; b2++) {
        var ph = ((t * 0.85 + b2 / 3) % 1);
        var bx = wa.x + dx * ph, by = wa.y + dy * ph;
        blob(tctx, bx, by, 5.5 - ph * 2, wa.hue + 60 + ph * 50,
             0.13 * br * (1 - ph * 0.5) * (0.4 + u * 0.7));
      }
    }
  }

  function arriveAt(c, wa, t) {
    c.want = null;
    c.wantCool = 45 + Math.random() * 60;
    wa.fed++;
    earnBubbles(0.22, c.x, c.y);           // and so does getting one fed
    var hue = wa.hue;
    if (wa.kind === 'bloom') {
      /* fed: bigger, brighter, and it lets a ring go - but it may only cross
         into being a world if there is not one already */
      c.size = Math.min(c.world ? HEAVY_MAX : c.born0 * 1.9, c.size * rnd(1.12, 1.3));
      maybeWorld(c);
      startReaction(c, 'bloom', 1.0, hue, t, null);
      c.glowAdd = Math.max(c.glowAdd, 0.8);
      spawnPulse(c.x, c.y, { energy: 0.45, reach: 0.22, uni: 0.7,
                             kind: RIPPLES[4], layers: [c.L], show: 0.8, hue: hue });
      for (var i = 0; i < 16; i++) emitSpark(c.x, c.y, 0, 0, hue, 0.7);
      if (A.ok && A.started) {
        var b = clamp(Math.round((1 - c.y / Math.max(1, H)) * (NOTES.length - 1)), 0, NOTES.length - 3);
        mine(function () {
          bowl(noteI(b) * octAt(c.y), 0.032, panOf(c.x), 4);
          soon(0.26, function () { chime(noteI(b + 2) * octAt(c.y), 0.026, panOf(c.x), 0.9, 2.2); });
        });
      }
    } else if (wa.kind === 'hollow') {
      // sheltered: curls up, dims right down, and rests a while
      c.vx *= 0.06; c.vy *= 0.06;
      startReaction(c, 'doze', 1.0, hue, t, null);
      c.rdur = 5 + Math.random() * 4;
      c.cool = 6;
      var cc = c;
      soon(6 + Math.random() * 4, function (tt) {
        if (cc.vit < 0.3 || cc.held) return;
        startReaction(cc, 'bloom', 0.55, hue, tt, null);
        var a2 = Math.random() * TAU;
        cc.vx += Math.cos(a2) * 90; cc.vy += Math.sin(a2) * 90;
      });
      if (A.ok && A.started) mine(function () { breath(noteI(1), 0.026, panOf(c.x), 0.4, 4); });
    } else {
      /* gone through: it spirals in and is not there any more, and
         somewhere else one fades up. Nothing is lost - the population is
         the same - but something did happen to that one. */
      for (var g = 0; g < 22; g++) {
        var ga = Math.random() * TAU, gs = 60 + Math.random() * 200;
        emitSpark(c.x, c.y, Math.cos(ga) * gs, Math.sin(ga) * gs, hue + rnd(-40, 40), 0.8);
      }
      c.x = Math.random() * W; c.y = Math.random() * H;
      c.vx = 0; c.vy = 0; c.vit = 0; c.flare = 1;
      c.hueOff += rnd(-90, 90);
      if (A.ok && A.started) mine(function () { gust(0.03, panOf(wa.x), 1.1, false); });
    }
  }

  /* ============================================================
     THE PLACES
     ------------------------------------------------------------
     Rings of evenly spaced dots is what these were, and rings of evenly spaced
     dots is what a loading spinner is. They needed a technique rather than a
     tweak, so each place is now a PARAMETRIC CURVE traced out as a chain of
     small lights:

        bloom    a rose, r = A cos(k t) - the curve that draws petals
        hollow   a caustic, two rings whose spacing beats against itself
        gate     a Lissajous knot, which crosses itself and appears to fold

     Three things make this look alive rather than plotted. The curve is traced
     with a MOVING WINDOW, so light runs along it instead of the whole shape
     being lit at once. Its parameters drift slowly, so a rose opens and closes
     and a knot turns itself inside out over half a minute. And the spacing of
     the samples is uneven, so it reads as something flowing along a path
     rather than as beads on a wire.

     It costs about thirty blobs per place and nothing else, which is why it can
     afford to be this much prettier than what it replaced.
     ============================================================ */
  function placeCurve(wa, t, kind, i, k, br) {
    var bre = 0.5 + 0.5 * Math.sin(t * 0.8 + i * 1.7);
    var lift = (wa.held ? 1.32 : 1) * (1 + (wa.busy || 0) * 0.16);
    var A = (30 + bre * 12) * (0.45 + k * 0.85) * lift;
    var n = 68;
    var head = (t * 0.16 + i * 0.3) % 1;          // where the light is now
    var spin = t * 0.11 * wa.spin;

    for (var q = 0; q < n; q++) {
      var u = q / n;
      /* The WHOLE curve is drawn, faintly, and the travelling light rides on
         top of it. Only lighting the moving part - which is what the first
         version did - left a handful of scattered dots and no shape at all:
         you need the path present to read the figure, and the highlight moving
         to read it as flowing. */
      var lag = (u - head + 1) % 1;
      var lum = Math.pow(1 - lag, 2.2);
      var th = u * TAU;
      var px, py, rad = 2.6 + lum * 5.2;

      if (kind === 'bloom') {
        // a rose: the petal count drifts, so it opens and closes
        var kk = 2.5 + Math.sin(t * 0.05 + i) * 0.5;
        var r = A * (0.42 + 0.58 * Math.abs(Math.cos(kk * th)));
        px = wa.x + Math.cos(th + spin) * r;
        py = wa.y + Math.sin(th + spin) * r;
      } else if (kind === 'hollow') {
        /* Two radii beating against one another. Nothing is ever drawn at the
           middle - the emptiness is what a shelter is for. */
        var r2 = A * (1.06 + 0.15 * Math.sin(6 * th + t * 0.6 + i));
        px = wa.x + Math.cos(th - spin) * r2;
        py = wa.y + Math.sin(th - spin) * r2 * 0.94;
      } else {
        // a Lissajous knot, folding through itself as the ratio drifts
        var rat = 2 + Math.sin(t * 0.04 + i) * 0.22;
        px = wa.x + Math.sin(3 * th + spin) * A;
        py = wa.y + Math.sin(rat * th + spin * 0.6) * A * 0.82;
      }
      blob(tctx, px, py, rad, wa.hue + 20 + u * 70 + lum * 30,
           (0.026 + lum * 0.115) * br);
    }

    // a soft heart to it, except for the hollow, which must stay empty
    if (kind !== 'hollow') {
      blob(tctx, wa.x, wa.y, (9 + bre * 5) * k * lift, wa.hue + 60,
           (0.06 + (wa.busy ? 0.07 : 0)) * br);
    }
    // and it breathes a ring when something is at it
    if (wa.busy) {
      wave(tctx, wa.x, wa.y, A * (1.5 + bre * 0.25), wa.hue + 80, 0.075 * br);
    }
    if (wa.held) wave(tctx, wa.x, wa.y, A * 1.9 + bre * 10, wa.hue + 70, 0.06 * br);
  }

  function drawWants(t, awake) {
    for (var i = 0; i < WANTS.length; i++) {
      var wa = WANTS[i], k = wa.k;
      if (k < 0.01) continue;
      placeCurve(wa, t, wa.kind, i, k, (0.4 + awake * 0.6) * Math.min(1, k));
    }
  }

  /* ============================================================
     COMPANY
     ------------------------------------------------------------
     Now and then a few of them fall in together for a while: they
     gather loosely round a drifting spot, mill about, and then the
     thing breaks up and they go their own ways. It has no purpose and
     no payoff, which is exactly right - it is the sort of thing you
     only notice on the second or third look, and then you find you
     have been watching one particular group for a minute.

     Who joins is by species leaning, so the same kinds keep company.
     The forces are tiny; if it ever looks like they are being pulled
     into place rather than choosing to hang about, it is too strong.
     ============================================================ */
  var BANDS = [];
  var bandNext = 0;

  function formBand(t) {
    var seed = null, tries = 0;
    while (!seed && tries++ < 30) {
      var c = creatures[(Math.random() * creatures.length) | 0];
      if (c && c.vit > 0.5 && !c.held && !c.band && !c.want) seed = c;
    }
    if (!seed) return;
    var band = { x: seed.x, y: seed.y, vx: rnd(-9, 9), vy: rnd(-9, 9),
                 born: t, life: 40 + Math.random() * 70, k: 0, n: 0 };
    var joined = 0;
    for (var i = 0; i < creatures.length && joined < 5; i++) {
      var o = creatures[i];
      if (o.vit < 0.5 || o.held || o.band || o.want) continue;
      var dx = o.x - seed.x, dy = o.y - seed.y;
      if (dx * dx + dy * dy > 420 * 420) continue;
      // by leaning, so it is mostly kinds that get on
      var aff = AFF[seed.sp.i * 8 + o.sp.i];
      if (o !== seed && Math.random() > 0.3 + aff * 0.75) continue;
      o.band = band; joined++;
    }
    band.n = joined;
    if (joined >= 3) BANDS.push(band);
    else for (i = 0; i < creatures.length; i++) if (creatures[i].band === band) creatures[i].band = null;
  }

  function updateBands(dt, t) {
    if (t > bandNext) {
      bandNext = t + (30 + Math.random() * 50) * paceGap();
      if (BANDS.length < 1 && world.sleep < 0.4) formBand(t);
    }
    for (var i = BANDS.length - 1; i >= 0; i--) {
      var b = BANDS[i];
      var u = (t - b.born) / b.life;
      b.k = approach(b.k, u < 0.12 ? u / 0.12 : (u > 0.8 ? Math.max(0, (1 - u) / 0.2) : 1), 1.2, dt);
      // the spot itself wanders, so the group drifts rather than parking
      b.vx += rnd(-5, 5) * dt; b.vy += rnd(-5, 5) * dt;
      b.vx *= 0.996; b.vy *= 0.996;
      b.x += b.vx * dt; b.y += b.vy * dt;
      if (b.x < W * 0.1 || b.x > W * 0.9) b.vx = -b.vx;
      if (b.y < H * 0.1 || b.y > H * 0.9) b.vy = -b.vy;
      if (u >= 1) {
        for (var j = 0; j < creatures.length; j++) {
          if (creatures[j].band === b) {
            creatures[j].band = null;
            // and off they go, each with their own new idea
            var a = Math.random() * TAU;
            creatures[j].bias = a; creatures[j].biasTurn = rnd(-0.2, 0.2);
            creatures[j].vx += Math.cos(a) * 55; creatures[j].vy += Math.sin(a) * 55;
          }
        }
        BANDS.splice(i, 1);
      }
    }
  }

  function inBand(c, dt) {
    var b = c.band;
    if (!b) return;
    var dx = b.x - c.x, dy = b.y - c.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 1;
    // loose: it keeps its distance and mills about rather than clumping
    var want = 70 + (c.phase % 1) * 90;
    var f = (d - want) * 0.5 * b.k;
    c.vx += (dx / d) * f * dt;
    c.vy += (dy / d) * f * dt;
  }

  /* ---- gathering a ripple ---------------------------------
     Press on open space and nothing happens yet: you are winding it
     up. The longer you hold before letting go, the more energy the
     wave carries, the further it reaches, the more creatures it is
     allowed to touch, and the deeper the answering cascade runs. A
     flick is a private word to one or two of them; a long press is
     something the whole room feels.

     While you hold, the light under your finger swells and a tone
     climbs with it, which is the only instruction the mechanic
     needs. Moving off cancels it, because that is a stroke through
     the water, not a press. */
  var CHARGE_MAX = 2.6;
  /* Where a touch stops being a tap and becomes a press. Used by BOTH the
     grab gate and finishTap, so there is no band in which a press counts as
     each - the grab fires first, so any overlap silently ate the tap. */
  var PRESS_T = 0.26;

  function beginCharge(p, t) {
    p.charging = true;
    p.chargeT0 = t;
    p.chargeDist = 0;
    // remember the note of the spot being pressed
    p.noteIdx = noteIdxAt(p.x);
    p.oct = octAt(p.y);
    if (!A.ok || !A.started) return;
    try {
      var ac = A.ctx;
      var o = ac.createOscillator(); o.type = 'sine';
      var g = ac.createGain(); g.gain.value = 0.0001;
      var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
      o.connect(lp); lp.connect(g); g.connect(A.bus);
      o.start(ac.currentTime);
      g.gain.setTargetAtTime(0.020, ac.currentTime, 0.25);
      p.cv = { o: o, g: g, lp: lp };
    } catch (e) { p.cv = null; }
  }

  function chargeLevel(p, t) {
    return clamp((t - p.chargeT0) / CHARGE_MAX, 0, 1);
  }

  /* A wind-up now has its own gravity. Anything nearby - some of it, chosen
     once and at random, so it never looks mechanical - falls into a ring around
     your finger and is held there. It cannot come inside the ring, which is the
     point: what you are building can no longer be sat on, hidden, or knocked
     about by something that happened to drift across.

     It also turns the plainest gesture in the app into the best looking one.
     You press, and the room slowly gathers round what you are holding. */
  function chargeOrbit(p, dt, t) {
    var k = chargeLevel(p, t);
    var rmin = 58 + k * 44;                    // nothing gets closer than this
    var reach = rmin + 180 + k * 160;
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.vit < 0.25 || c.held || c.hush > 0) continue;
      var dx = c.x - p.x, dy = c.y - p.y;
      var d2 = dx * dx + dy * dy;
      if (d2 > reach * reach) { if (c.orbP === p) c.orbP = null; continue; }
      var d = Math.sqrt(d2) + 0.001;
      var ux = dx / d, uy = dy / d;

      /* THE KEEP-OUT IS UNCONDITIONAL. Which of them take up an orbit is
         decided at random, because a room where everything reacts the same
         way looks like a machine - but the promise that nothing sits on top
         of what you are building has to hold for every last one of them,
         including the ones that declined and including a world. Splitting
         these two was the fix: the first version let the ones that opted out
         of orbiting drift straight over the middle. */
      if (d < rmin) {
        var soft = (rmin - d) / rmin;
        c.vx += ux * soft * 900 * dt;
        c.vy += uy * soft * 900 * dt;
        keepOut(c, p, rmin);
      }

      if (c.world || c.orbSkip === p) continue;   // excluded, but not enlisted
      if (c.orbP !== p) {
        if (c.orbP) continue;                  // already round somebody else
        // decided once, on the way in, and then left alone
        if (Math.random() < 0.55) { c.orbP = p; c.orbSkip = null; }
        else { c.orbSkip = p; continue; }
      }
      // fall towards the ring, from either side of it
      var err = d - rmin;
      c.vx += ux * (-err * 3.2) * dt;
      c.vy += uy * (-err * 3.2) * dt;
      // and go round
      var tang = 160 + k * 150;
      c.vx += -uy * tang * dt;
      c.vy += ux * tang * dt;
      // damp the in-and-out so it settles into a ring instead of bouncing
      var rv = c.vx * ux + c.vy * uy;
      c.vx -= ux * rv * 2.6 * dt;
      c.vy -= uy * rv * 2.6 * dt;
      c.glowAdd = Math.max(c.glowAdd, 0.12 + k * 0.3);
    }
  }

  /* Put it back on the edge of the ring, and take away whatever speed was
     carrying it inwards. Called from two places, and it has to be: the version
     that only ran inside the pointer loop was undone a few lines later, because
     positions are integrated AFTER that loop - so anything moving quickly, a
     creature slung by a special move or falling towards a world, went straight
     back over the top before it was ever drawn. Measured 43 pixels inside a
     ring that was supposed to be inviolable. */
  function keepOut(c, p, rmin) {
    var dx = c.x - p.x, dy = c.y - p.y;
    var d = Math.sqrt(dx * dx + dy * dy) + 0.001;
    if (d >= rmin * 0.95) return;
    var ux = dx / d, uy = dy / d;
    c.x = p.x + ux * rmin * 0.95;
    c.y = p.y + uy * rmin * 0.95;
    var into = c.vx * ux + c.vy * uy;
    if (into < 0) { c.vx -= ux * into; c.vy -= uy * into; }
  }

  /* And the same, for every wind-up currently running, applied once the frame
     has finished moving everything. This is the pass that actually holds. */
  /* ---- and nothing sits INSIDE a planet, by any route ------------------
     The orbit path is properly outside the visible edge, but a body was only
     ever STEERED towards that path by a spring, never held on it - so a ripple,
     a hand, a special move, or the planet's own pull would shove one inward,
     and once inside there was nothing to put it back: the surface bounce is
     skipped for anything already in orbit. If it also happened to be too big to
     be swallowed it simply parked there, which is the last remaining form of a
     thing looking stuck to a planet rather than going round it.

     A floor on the distance, applied after the frame's movement, so no route in
     can beat it. It sits just inside the bounce line, which means the bounce is
     still what normally happens and this is only the guarantee. The inward part
     of the velocity is removed and the sideways part left alone, so an orbit
     that gets pushed keeps circling instead of stopping dead. */
  function keepOutOfWorlds(c) {
    if (c.world || c.held) return;
    for (var i = 0; i < creatures.length; i++) {
      var w = creatures[i];
      if (w === c || !w.world || w.vit < 0.25) continue;
      var dx = c.x - w.x, dy = c.y - w.y, d2 = dx * dx + dy * dy;
      var floor = worldR(w) + c.size * LSIZE[c.L] * 0.55;
      if (d2 >= floor * floor) continue;
      var d = Math.sqrt(d2);
      // dead centre: push it out along its own heading rather than nowhere
      var nx, ny;
      if (d < 0.5) {
        var a = Math.atan2(c.vy, c.vx) || 0;
        nx = Math.cos(a); ny = Math.sin(a);
      } else { nx = dx / d; ny = dy / d; }
      c.x = w.x + nx * floor;
      c.y = w.y + ny * floor;
      var into = c.vx * nx + c.vy * ny;
      if (into < 0) { c.vx -= nx * into; c.vy -= ny * into; }
    }
  }

  function keepOutOfCharges(c) {
    if (c.held || c.hush > 0) return;
    pointers.forEach(function (p) {
      if (!p.charging) return;
      keepOut(c, p, 58 + chargeLevel(p, now()) * 44);
    });
  }

  function freeOrbiters(p) {
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.orbP === p) c.orbP = null;
      if (c.orbSkip === p) c.orbSkip = null;
    }
  }

  function updateCharge(p, t) {
    if (!p.charging) return;
    var k = chargeLevel(p, t);
    if (p.cv && A.ok) {
      var ac = A.ctx, nt = ac.currentTime;
      /* Pitched from WHERE you are pressing, not from how long you
         have held. It used to be the latter alone, so every hold
         anywhere on the screen sang exactly the same rising figure.
         Now it starts on the note of that spot and climbs a few
         degrees of the scale as it fills, so you hear both what you
         are touching and how much you have gathered. */
      var base = noteI(p.noteIdx + Math.round(k * 4)) * p.oct;
      p.cv.o.frequency.setTargetAtTime(base, nt, 0.10);
      p.cv.lp.frequency.setTargetAtTime(340 + k * 2200 + p.oct * 300, nt, 0.12);
      p.cv.g.gain.setTargetAtTime(0.014 + k * 0.040, nt, 0.15);
    }
  }

  function stopChargeVoice(p, release) {
    if (!p.cv) return;
    var ac = A.ctx, nt = ac.currentTime, cv = p.cv;
    p.cv = null;
    try {
      cv.g.gain.cancelScheduledValues(nt);
      cv.g.gain.setValueAtTime(Math.max(0.0001, cv.g.gain.value), nt);
      cv.g.gain.setTargetAtTime(0.0001, nt, release ? 0.05 : 0.18);
      cv.o.stop(nt + 0.8);
      cv.o.onended = function () {
        try { cv.o.disconnect(); cv.lp.disconnect(); cv.g.disconnect(); } catch (e) {}
      };
    } catch (e) {}
  }

  function releaseCharge(p, t) {
    if (!p.charging) return;
    p.charging = false;
    if (!p.chargeCancelled) earnBubbles(0.3 + chargeLevel(p, t) * 0.5, p.x, p.y);
    freeOrbiters(p);
    stopChargeVoice(p, true);
    if (p.chargeCancelled) { p.chargeCancelled = false; return; }
    var k = chargeLevel(p, t);
    feedWarmth(0.004 + k * 0.013);
    var hue = p.hue || world.hue;
    /* A barely-charged release is really just a tap that happened to last long
       enough to start winding up. It used to be assumed that such a tap had
       already sounded its note - true when the note fired on contact, but the
       note moved to release, so those presses were coming out with no pitch at
       all. It sounds its place here instead, and the ripple stays quiet, so
       either way a brief touch makes exactly one sound. */
    if (k < 0.22) playTouchNote(p.x, p.y, 0.5);
    spawnPulse(p.x, p.y, {
      // quiet, because the note above is the whole of what you should hear
      voice: k < 0.22 ? false : undefined,
      energy: 0.22 + k * 1.25,
      reach: 0.05 + k * 0.85,
      budget: Math.round(2 + k * 30),
      speed: 640 - k * 350,          // the big ones roll rather than snap
      uni: clamp(0.25 + k * 0.6 + rnd(-0.15, 0.15), 0, 1),
      hue: hue, show: 0.7 + k
    });
    var n = 6 + (k * 26) | 0;
    for (var i = 0; i < n; i++) emitSpark(p.x, p.y, 0, 0, hue, 0.4 + k * 0.8);
  }

  /* ---- the canvas as an instrument -----------------------
     Every touch sounds a note straight away, before anything else
     happens: across is pitch, up is register and brightness. That
     makes the whole surface playable like a two dimensional
     keyboard, and it doubles as the attack of a charge if you hold.
     The instrument comes from whichever colour world is showing. */
  /* One place is one note. Across the screen picks the degree, and
     height picks the register in three plain bands, both by straight
     arithmetic with nothing random in them - so the same spot always
     answers with the same pitch for as long as a theme lasts, and the
     surface can be learned and played deliberately. */
  function noteIdxAt(x) {
    return clamp(Math.round((x / Math.max(1, W)) * (NOTES.length - 1)), 0, NOTES.length - 1);
  }
  function octAt(y) {
    var up = 1 - clamp(y / Math.max(1, H), 0, 1);
    return up > 0.66 ? 2 : (up < 0.33 ? 0.5 : 1);
  }
  /* Position is pitch, and it runs both ways.
     ------------------------------------------------------------
     noteIdxAt and octAt turn a place into a note. These turn a note back into
     a place, which is what lets the echo's ending be SEEN as well as heard: a
     rising run is light climbing the screen, because up is up. */
  function xForDeg(d) {
    return clamp((d / Math.max(1, NOTES.length - 1)) * W, 26, W - 26);
  }
  function yForOct(o) {
    return o >= 2 ? H * 0.18 : (o <= 0.5 ? H * 0.82 : H * 0.5);
  }

  function playTouchNote(x, y, vel) {
    if (!A.ok || !A.started) return;
    var up = 1 - clamp(y / Math.max(1, H), 0, 1);
    var idx = noteIdxAt(x);
    var f = noteI(idx) * octAt(y);
    var pan = panOf(x);
    var v = (0.030 + vel * 0.045) * (0.75 + up * 0.5);
    feedWarmth(0.003);
    /* A melody note is a DIFFERENT VOICE, in a different register, and neither
       costs a decibel.
       ------------------------------------------------------------
       The phrase used the palette's own instrument - chime for chime, pluck for
       pluck - and the same octave bands as an ordinary tap. So the tune was not
       merely as quiet as the room, it was indistinguishable in colour and pitch
       from it: the same instrument playing the same notes in the same range.
       That is not a mix problem, it is an orchestration one, and the answer is
       the one an orchestrator would give. You do not make the flute louder than
       the strings; you put it where the strings are not.

       Always a bell, always an octave up. The bell is used by nothing else in
       the app, and the octave puts it clear of the band the taps sit in. */
    if (notePrio) {
      mine(function () { chime(f * 2, v * 0.92, pan * 0.35, 1.25, 2.4); });
      return;
    }
    mine(function () {
      switch (PALS[palIdx].inst) {
        case 'drop':    drop(f, v * 1.15, pan); break;
        case 'pluck':   pluck(f, v * 1.25, pan); break;
        case 'marimba': marimba(f, v * 1.1, pan); break;
        case 'bowl':    bowl(f, v * 0.8, pan, 2.6 + up * 2.4); break;
        default:        chime(f, v, pan, 0.45 + up * 0.55, 1.9 + up * 1.2);
      }
    });
  }

  /* ============================================================
     THE SHAPE OF A STROKE
     ------------------------------------------------------------
     What a swipe does depends on what you drew. The path is
     recorded, and when you let go it is measured: how straight it
     is, how much it turned in total, how many times it changed its
     mind, whether it came back to where it started and how much
     ground it enclosed. Six answers fall out of those numbers, and
     each one disturbs the water in its own way.

        a closed loop      gathers whatever it encircled
        a long straight    cuts a current everything drifts along
        a tight scribble   churns the water and scatters them
        a spiral           leaves one deep whirlpool behind
        a zigzag           throws sparks and startles
        anything else      a soft wide breeze

     Nothing has to be drawn accurately - every unrecognised shape
     still does something pleasant.
     ============================================================ */
  var TRACE_MAX = 90;

  function traceReset(p) { p.tr = []; p.trLen = 0; p.solo = true; }

  function traceAdd(p) {
    var tr = p.tr;
    if (!tr) { traceReset(p); tr = p.tr; }
    var n = tr.length;
    if (n) {
      var dx = p.x - tr[n - 1].x, dy = p.y - tr[n - 1].y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < 12) return;                    // resampled, so shape not speed
      p.trLen += d;
    }
    tr.push({ x: p.x, y: p.y });
    // an old sample dropped has to take its length with it, or a long
    // stroke looks closed simply because trLen ran ahead of the trace
    if (tr.length > TRACE_MAX) {
      p.trLen -= Math.hypot(tr[1].x - tr[0].x, tr[1].y - tr[0].y);
      tr.shift();
    }
  }

  function classifyTrace(p) {
    var tr = p.tr || [];
    if (tr.length < 5 || p.trLen < 110) return null;
    var a = tr[0], b = tr[tr.length - 1];
    var net = Math.hypot(b.x - a.x, b.y - a.y);
    var straight = net / Math.max(1, p.trLen);

    /* Total signed turning says how much it wound; a reversal is a
       genuine change of hand, so the threshold has to be well clear
       of the wobble in an ordinary straight drag or every swipe would
       read as a zigzag. */
    var turning = 0, absTurn = 0, reversals = 0, lastSign = 0, prevAng = null;
    for (var i = 1; i < tr.length; i++) {
      var ang = Math.atan2(tr[i].y - tr[i - 1].y, tr[i].x - tr[i - 1].x);
      if (prevAng !== null) {
        var da = wrapAngle(ang - prevAng);
        turning += da; absTurn += Math.abs(da);
        var sg = da > 0.5 ? 1 : (da < -0.5 ? -1 : 0);
        if (sg && lastSign && sg !== lastSign) reversals++;
        if (sg) lastSign = sg;
      }
      prevAng = ang;
    }
    // enclosed ground, by the shoelace sum
    var area = 0;
    for (var k = 0; k < tr.length; k++) {
      var q = tr[(k + 1) % tr.length];
      area += tr[k].x * q.y - q.x * tr[k].y;
    }
    area = Math.abs(area) * 0.5;

    /* A loop and a spiral both wind a long way round, and total turning
       cannot tell them apart - two laps of a circle turn further than
       one turn of a spiral. What separates them is the radius: a loop
       holds its distance from the middle, a spiral winds in or out. */
    var mx = 0, my = 0;
    for (k = 0; k < tr.length; k++) { mx += tr[k].x; my += tr[k].y; }
    mx /= tr.length; my /= tr.length;
    var rMin = 1e9, rMax = 0;
    for (k = 0; k < tr.length; k++) {
      var rr = Math.hypot(tr[k].x - mx, tr[k].y - my);
      if (rr < rMin) rMin = rr;
      if (rr > rMax) rMax = rr;
    }
    var spread = (rMax - rMin) / (rMax + 1);

    var closed = net < Math.max(120, p.trLen * 0.30) && p.trLen > 260;
    var kind;
    var consist = Math.abs(turning) / Math.max(absTurn, 0.001);
    if (Math.abs(turning) > 4.5 && spread > 0.55 && p.trLen > 320 &&
        consist > 0.45) kind = 'spiral';
    else if (closed && Math.abs(turning) > 3.6 && area > 9000) kind = 'lasso';
    // a scribble reverses and gets nowhere; a zigzag reverses on its way
    else if (reversals >= 5 && net < 240 && p.trLen > 300) kind = 'scribble';
    else if (reversals >= 3 && net >= 240 && straight < 0.72) kind = 'zigzag';
    else if (straight > 0.78 && p.trLen > 210) kind = 'line';
    else kind = 'breeze';

    return { kind: kind, tr: tr, len: p.trLen, net: net, straight: straight,
             turning: turning, reversals: reversals, area: area, spread: spread,
             consist: consist,
             cx: mx, cy: my, a: a, b: b };
  }

  function insideTrace(tr, x, y) {
    var inside = false;
    for (var i = 0, j = tr.length - 1; i < tr.length; j = i++) {
      var xi = tr[i].x, yi = tr[i].y, xj = tr[j].x, yj = tr[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-9) + xi)) {
        inside = !inside;
      }
    }
    return inside;
  }

  /* Nothing here marks a "moment" - that draws expanding rings, which is
     the press's language. A swipe answers in its own: the band of light
     it laid down, the loop it traced, the swirl it left in the water. */

  /* ============================================================
     SPECIAL MOVES
     ------------------------------------------------------------
     Five things a hand can do that the room answers to properly, rather
     than with the same soft wake every swipe gets. They are found by
     swiping FAST - a slow drawn shape still gets the quiet answer, which
     matters, because a child who is not looking for tricks should never
     trip over one.

     Each has the same four parts, and it is the four together that make
     them feel like moves rather than effects:

        a trail    sparks laid along the path you actually drew
        an arrival something comes in from off the screen to do it
        a voice    its own figure on the scale, so you learn it by ear
        an answer  what it does to everything it reaches

     Each is keyed to a shape a hand makes naturally:

        a circle round things   gather   they are drawn in and let go
        a wound-up spiral       vortex   the room turns
        a sharp back-and-forth  bolt     something strikes along the line
        a fast dash across      comet    something crosses and is gone
        a fast flick up or down fountain it all lifts, or it all falls
     ============================================================ */
  var MOVE_SPEED = 560;            // arc length per second: a real swipe
  var MFX = [];

  function moveOf(g, p) {
    if (!g || !p || p.path < MOVE_SPEED) return null;
    if (g.kind === 'lasso' && g.area > 14000) return 'gather';
    if (g.kind === 'spiral') return 'vortex';
    if (g.kind === 'zigzag') return 'bolt';
    if (g.kind === 'line' && g.len > 300) {
      var dx = g.b.x - g.a.x, dy = g.b.y - g.a.y;
      if (Math.abs(dx) > Math.abs(dy) * 1.15) return 'comet';
      return dy < 0 ? 'fountain' : 'fall';
    }
    return null;
  }

  /* Sparks along the path the hand actually took, not along a tidied version
     of it - the point is that you can see your own gesture in it. */
  function traceSparks(tr, hue, n) {
    var step = Math.max(1, Math.floor(tr.length / n));
    for (var i = 0; i < tr.length; i += step) {
      var a = Math.random() * TAU, sp = 30 + Math.random() * 130;
      emitSpark(tr[i].x, tr[i].y, Math.cos(a) * sp, Math.sin(a) * sp,
                hue + rnd(-40, 40), 0.7 + Math.random() * 0.5);
    }
  }

  function moveVoice(kind, x, y) {
    if (!A.ok || !A.started) return;
    var b = clamp(Math.round((1 - y / Math.max(1, H)) * (NOTES.length - 1)),
                  2, NOTES.length - 8);
    var FIG = {
      gather:   [0, 2, 4, 7],
      vortex:   [7, 5, 2, 0],
      bolt:     [0, 7, 4],
      comet:    [0, 3, 5, 7, 9],
      fountain: [0, 4, 7, 11],
      fall:     [11, 7, 4, 0]
    };
    var fig = FIG[kind] || [0, 4, 7];
    var gap = kind === 'bolt' ? 0.075 : (kind === 'comet' ? 0.09 : 0.2);
    mine(function () {
      bowl(noteI(b + fig[0]) * 0.5, kind === 'bolt' ? 0.03 : 0.042, panOf(x), 7);
      for (var q = 1; q < fig.length; q++) {
        (function (q2) {
          soon(gap * q2, function () {
            chime(noteI(b + fig[q2]) * octAt(y), 0.028, panOf(x),
                  0.8 + q2 * 0.25, 2.6 + q2 * 0.7);
          });
        })(q);
      }
      if (kind === 'bolt') {
        soon(0.16, function () { breath(noteI(b) * 0.5, 0.03, -panOf(x), 0.4, 5); });
      }
      if (kind === 'vortex' || kind === 'fall') {
        soon(0.9, function () { breath(noteI(b) * 0.5, 0.026, 0, 0.6, 6); });
      }
    });
  }

  function fireMove(kind, g, t, p) {
    var hue = world.hue + 50;
    var cx = g.cx, cy = g.cy;
    var ax = g.a.x, ay = g.a.y, bx = g.b.x, by = g.b.y;
    var dx = bx - ax, dy = by - ay, dl = Math.hypot(dx, dy) + 1;
    var ux = dx / dl, uy = dy / dl;
    var sign = g.turning >= 0 ? 1 : -1;
    var i, c;

    traceSparks(g.tr, hue, kind === 'bolt' ? 26 : 18);
    moveVoice(kind, cx, cy);
    earnBubbles(0.42, cx, cy);             // a special move is worth a lot of pokes
    addStir(cx, cy, 0.10, 0.45);
    world.wake = 1;
    feedWarmth(0.02);

    /* The arrival, started off the edge of the screen so it genuinely comes
       from outside. Coming in from nowhere is what makes it an event rather
       than a filter over what was already there. */
    /* The arrival is scaled to the GESTURE, not to the screen. Scaling it to
       the screen was a mistake worth spelling out: a ring starting at two
       thirds of the diagonal is nearly a thousand pixels across, and an
       annulus that big at any usable alpha simply floods everything. Sized off
       the shape the hand drew, it stays an event happening in one place. */
    var r0 = kind === 'gather' ? clamp(Math.sqrt(Math.max(1, g.area) / Math.PI), 70, 300)
                               : clamp(dl * 0.5, 90, 320);
    MFX.push({ kind: kind, t: 0, life: kind === 'bolt' ? 0.62 : 1.7,
               x: cx, y: cy, ax: ax, ay: ay, bx: bx, by: by,
               ux: ux, uy: uy, len: dl, hue: hue, sign: sign, r0: r0,
               spin: rnd(-1, 1), arms: 5 + ((Math.random() * 4) | 0) });
    if (MFX.length > 3) MFX.shift();

    if (kind === 'gather') {
      // whatever was ringed is drawn in, turned, and let go outwards
      for (i = 0; i < creatures.length; i++) {
        c = creatures[i];
        if (c.vit < 0.3 || c.held || c.hush > 0) continue;
        if (!insideTrace(g.tr, c.x, c.y)) continue;
        var gx = cx - c.x, gy = cy - c.y, gd = Math.hypot(gx, gy) + 1;
        c.vx += (gx / gd) * 210 - (gy / gd) * 240 * sign;
        c.vy += (gy / gd) * 210 + (gx / gd) * 240 * sign;
        c.freeT = Math.max(c.freeT, 2.5);
        startReaction(c, pick(['flutter', 'sparkle', 'bloom']), 0.7, hue, t, null);
        c.glowAdd = Math.max(c.glowAdd, 0.5);
      }

    } else if (kind === 'vortex') {
      // the room turns about the middle of the spiral
      for (i = 0; i < creatures.length; i++) {
        c = creatures[i];
        if (c.vit < 0.3 || c.held || c.hush > 0) continue;
        var vx2 = c.x - cx, vy2 = c.y - cy, vd = Math.hypot(vx2, vy2);
        if (vd > 380 || vd < 1) continue;
        var fall = 1 - vd / 380;
        c.vx += (-vy2 / vd) * 320 * sign * fall - (vx2 / vd) * 110 * fall;
        c.vy += (vx2 / vd) * 320 * sign * fall - (vy2 / vd) * 110 * fall;
        c.spin += sign * 5 * fall;
        c.freeT = Math.max(c.freeT, 2);
        startReaction(c, pick(['tumble', 'spin', 'wobble']),
                      0.5 + fall * 0.5, hue, t, null);
      }

    } else if (kind === 'bolt') {
      /* Something strikes along the line. Everything close to it is startled
         and thrown clear SIDEWAYS, which is what makes it read as a strike
         rather than as another shove. */
      for (i = 0; i < creatures.length; i++) {
        c = creatures[i];
        if (c.vit < 0.3 || c.held || c.hush > 0) continue;
        var wx = c.x - ax, wy = c.y - ay;
        var alng = clamp(wx * ux + wy * uy, 0, dl);
        var perp = c.x - (ax + ux * alng), perpy = c.y - (ay + uy * alng);
        var pd = Math.hypot(perp, perpy);
        if (pd > 130) continue;
        var kk = 1 - pd / 130;
        var s2 = perp * -uy + perpy * ux >= 0 ? 1 : -1;
        c.vx += -uy * s2 * 380 * kk;
        c.vy += ux * s2 * 380 * kk;
        startReaction(c, pick(['shiver', 'hiccup', 'freeze']),
                      0.6 + kk * 0.4, hue, t, null);
        c.glowAdd = Math.max(c.glowAdd, 0.7 * kk);
        for (var q3 = 0; q3 < 4; q3++) {
          emitSpark(c.x, c.y, 0, 0, hue + rnd(-30, 60), 0.6);
        }
      }

    } else if (kind === 'comet') {
      // something crosses and is gone, and knocks things along with it
      for (i = 0; i < creatures.length; i++) {
        c = creatures[i];
        if (c.vit < 0.3 || c.held || c.hush > 0) continue;
        var cwx = c.x - ax, cwy = c.y - ay;
        var ca = cwx * ux + cwy * uy;
        var cpx = c.x - (ax + ux * ca), cpy = c.y - (ay + uy * ca);
        var cpd = Math.hypot(cpx, cpy);
        if (cpd > 150 || ca < -120 || ca > dl + 120) continue;
        var ck = 1 - cpd / 150;
        c.vx += ux * 430 * ck;
        c.vy += uy * 430 * ck;
        c.freeT = Math.max(c.freeT, 1.5);
        startReaction(c, pick(['tumble', 'rush', 'scamper']),
                      0.5 + ck * 0.5, hue, t, null);
      }

    } else {
      /* Everything lifts, or everything falls - the whole column the flick
         went through, so it reads as weather rather than as a push. */
      var up = kind === 'fountain' ? -1 : 1;
      for (i = 0; i < creatures.length; i++) {
        c = creatures[i];
        if (c.vit < 0.3 || c.held || c.hush > 0) continue;
        var lx2 = Math.abs(c.x - cx);
        if (lx2 > 260) continue;
        var lk = 1 - lx2 / 260;
        c.vy += up * 330 * lk;
        c.vx += rnd(-50, 50) * lk;
        c.freeT = Math.max(c.freeT, 2);
        startReaction(c, up < 0 ? pick(['bloom', 'sparkle', 'stretch'])
                                : pick(['doze', 'curl', 'deflate']),
                      0.45 + lk * 0.5, hue, t, null);
      }
    }
  }

  function updateMFX(dt) {
    for (var i = MFX.length - 1; i >= 0; i--) {
      MFX[i].t += dt;
      if (MFX[i].t > MFX[i].life) MFX.splice(i, 1);
    }
  }

  function drawMFX(t) {
    for (var i = 0; i < MFX.length; i++) {
      var e = MFX[i];
      var k = e.t / e.life;
      /* Rise, HOLD, then fall. The first version ramped down from ten percent
         onwards and then squared the whole thing, so the effect was already
         down to sixty percent brightness at the exact moment it was meant to
         be arriving - which is why the strike and the comet came out as faint
         smudges. Only the tail is squared now, so the going-away stays soft. */
      var fade = k < 0.08 ? k / 0.08
               : (k < 0.55 ? 1 : 1 - (k - 0.55) / 0.45);
      fade = clamp(fade, 0, 1);
      if (k > 0.55) fade *= fade;
      var ease = k * k * (3 - 2 * k);
      var q, a2, d2;

      if (e.kind === 'gather') {
        // a ring closing onto the loop you drew, from a little way outside it
        /* Kept deliberately low. A converging ring re-paints almost the same
           pixels every frame, so dose adds up here far faster than it does for
           an effect that travels - the alpha that looks right for the comet
           burns this one out. Same lesson as the creatures: in an accumulating
           buffer, what matters is dose per frame times how long it dwells. */
        var gr = e.r0 * (2.5 - ease * 1.5);
        wave(tctx, e.x, e.y, gr, e.hue + 40, 0.055 * fade);
        for (q = 0; q < 12; q++) {
          a2 = (q / 12) * TAU + e.spin * ease * 3.4;
          blob(tctx, e.x + Math.cos(a2) * gr, e.y + Math.sin(a2) * gr,
               8 + (1 - ease) * 10, e.hue + q * 9, 0.062 * fade);
        }
        // and it lands: a soft answer at the middle as the ring arrives
        if (ease > 0.55) {
          blob(tctx, e.x, e.y, e.r0 * 0.5, e.hue + 70,
               0.075 * fade * (ease - 0.55) / 0.45);
        }

      } else if (e.kind === 'vortex') {
        // arms winding in from off the screen and spinning up
        for (q = 0; q < e.arms; q++) {
          var base = (q / e.arms) * TAU + e.sign * ease * 5.5;
          for (var r = 0; r < 7; r++) {
            d2 = (1 - ease) * e.r0 * 2.4 * (1 - r * 0.11) + 24;
            var aa = base + r * 0.22 * e.sign;
            blob(tctx, e.x + Math.cos(aa) * d2, e.y + Math.sin(aa) * d2,
                 8 + (1 - ease) * 12, e.hue + q * 11 + r * 6,
                 (0.072 - r * 0.008) * fade);
          }
        }
        wave(tctx, e.x, e.y, 34 + ease * e.r0 * 1.6, e.hue + 60, 0.085 * fade);

      } else if (e.kind === 'bolt') {
        /* A jagged strike along the path, arriving from beyond one end and
           carrying on past the other. It is fast and short, but it never
           JUMPS: the alpha still rises and falls over the whole second, like
           everything else here. */
        var over = 240;
        var sx = e.ax - e.ux * over, sy = e.ay - e.uy * over;
        var tot = e.len + over * 2;
        var head = ease * tot;
        var seg = 30;
        for (q = 0; q < seg; q++) {
          var along = (q / seg) * tot;
          if (along > head) break;
          var trailK = 1 - (head - along) / (tot * 0.7);
          if (trailK <= 0) continue;
          // a fixed zigzag off the line, so it looks struck rather than drawn
          var jag = Math.sin(q * 2.3) * 26 + Math.sin(q * 5.1) * 11;
          var px2 = sx + e.ux * along - e.uy * jag;
          var py2 = sy + e.uy * along + e.ux * jag;
          // a wide soft glow, and a tight bright core inside it
          blob(tctx, px2, py2, 20 + trailK * 22, e.hue + 30 + q * 3,
               0.13 * trailK * fade);
          blob(tctx, px2, py2, 5 + trailK * 6, e.hue + 60 + q * 4,
               0.34 * trailK * fade);
        }

      } else if (e.kind === 'comet') {
        // a head that comes in from off screen, crosses, and leaves
        var over2 = 320;
        var cx2 = e.ax - e.ux * over2, cy2 = e.ay - e.uy * over2;
        var tot2 = e.len + over2 * 2;
        var hd = ease * tot2;
        var hx = cx2 + e.ux * hd, hy = cy2 + e.uy * hd;
        /* Head small and hot, tail widening and cooling behind it. It was the
           other way round - fattest at the head, thinnest at the tail - which
           is not a comet, it is a sausage, and that is exactly how it read. */
        for (q = 1; q < 18; q++) {
          var back = q * 20;
          var tk = 1 - q / 18;
          blob(tctx, hx - e.ux * back, hy - e.uy * back,
               6 + (1 - tk) * 26, e.hue + 20 + q * 5,
               0.115 * Math.pow(tk, 1.4) * fade);
        }
        blob(tctx, hx, hy, 15, e.hue + 70, 0.26 * fade);
        blob(tctx, hx, hy, 6, e.hue + 100, 0.42 * fade);
        wave(tctx, hx, hy, 34, e.hue + 50, 0.12 * fade);

      } else {
        /* Weather. Motes rising from below the bottom edge, or coming down
           from above the top - either way it starts outside. */
        var up2 = e.kind === 'fountain' ? -1 : 1;
        for (q = 0; q < 26; q++) {
          var lane = e.x + ((q % 13) / 12 - 0.5) * 460;
          var ph2 = (ease + q * 0.037) % 1;
          var y2 = up2 < 0 ? H + 80 - ph2 * (H + 200) : -80 + ph2 * (H + 200);
          blob(tctx, lane + Math.sin(ph2 * 7 + q) * 26, y2,
               7 + (1 - ph2) * 10, e.hue + q * 6,
               0.16 * fade * (1 - Math.abs(ph2 - 0.5) * 0.85));
        }
        wave(tctx, e.x, up2 < 0 ? H - ease * H * 0.7 : ease * H * 0.7,
             120 + ease * 160, e.hue + 50, 0.07 * fade);
      }
    }
  }

  function applyTrace(g, t, p) {
    if (!g) return;
    if (LEVEL < 3) return;        // drawn shapes are the top of the ladder
    /* A rub that just made a world also classifies as a scribble, and would
       otherwise collect a second answer on top of the one it already got. */
    var mv = moveOf(g, p);
    if (mv) { fireMove(mv, g, t, p); return; }
    feedWarmth(0.008);
    var tr = g.tr, hue = world.hue + 40;
    var cx = g.cx, cy = g.cy;
    var sign = g.turning >= 0 ? 1 : -1;
    var i2, c, dx, dy, d;

    switch (g.kind) {
      case 'lasso': {
        // whatever was encircled is gathered and briefly bound together
        var caught = [];
        for (i2 = 0; i2 < creatures.length; i2++) {
          c = creatures[i2];
          if (c.vit < 0.35 || c.held) continue;
          if (insideTrace(tr, c.x, c.y)) caught.push(c);
        }
        // the loop itself lights up, gently: every point of it is drawn
        // in the same frame, so a little alpha goes a very long way
        for (i2 = 0; i2 < tr.length; i2++) {
          blob(tctx, tr[i2].x, tr[i2].y, 30, hue + 40, 0.045);
          blob(tctx, tr[i2].x, tr[i2].y, 11, hue + 90, 0.085);
        }
        addStir(cx, cy, 0.30 * sign, 0.26);
        if (caught.length) {
          var lead = caught[0];
          for (i2 = 0; i2 < caught.length; i2++) {
            c = caught[i2];
            c.vx += (cx - c.x) * 1.9; c.vy += (cy - c.y) * 1.9;
            c.glowAdd = Math.max(c.glowAdd, 1);
            startReaction(c, i2 === 0 ? 'bloom' : 'huddle', 1.1, hue, t, null);
            if (i2) { c.with = lead; c.stance = 'orbit'; c.socT = 6 + Math.random() * 6;
                      c.orbA = Math.atan2(c.y - cy, c.x - cx); }
          }
          if (A.ok && A.started) {
            var lb = clamp(Math.round((1 - cy / Math.max(1, H)) * (NOTES.length - 1)),
                           0, NOTES.length - 1);
            bowl(noteI(lb), 0.05, panOf(cx), 6);
            chime(noteI(lb + 4) * 2, 0.045, panOf(cx), 1, 2);
          }
        } else if (A.ok && A.started) {
          breath(noteI(4), 0.03, panOf(cx), 0.5, 3);
        }
        break;
      }
      case 'line': {
        // a current cut along the stroke, and everything drifts with it
        var lx = g.b.x - g.a.x, ly = g.b.y - g.a.y;
        var ll = Math.hypot(lx, ly) || 1;
        var ux = lx / ll, uy = ly / ll;
        for (i2 = 0; i2 <= 5; i2++) {
          var u = i2 / 5;
          addStir(g.a.x + lx * u, g.a.y + ly * u, 0.13 * sign, 0.10);
        }
        for (i2 = 0; i2 < creatures.length; i2++) {
          c = creatures[i2];
          if (c.vit < 0.35 || c.held) continue;
          // distance from the line
          var rx = c.x - g.a.x, ry = c.y - g.a.y;
          var along = rx * ux + ry * uy;
          if (along < -80 || along > ll + 80) continue;
          var off = Math.abs(rx * -uy + ry * ux);
          if (off > 190) continue;
          var w = 1 - off / 190;
          c.vx += ux * 380 * w; c.vy += uy * 380 * w;
          if (Math.random() < 0.5) startReaction(c, pick(['stretch', 'rush', 'bob']), 0.8, hue, t, null);
        }
        if (A.ok && A.started) gust(0.05, panOf(cx), 1.6, true);
        break;
      }
      case 'scribble': {
        for (i2 = 0; i2 < 4; i2++) {
          var q = tr[(Math.random() * tr.length) | 0];
          addStir(q.x, q.y, (Math.random() < 0.5 ? -1 : 1) * 0.34, 0.10 + Math.random() * 0.10);
        }
        for (i2 = 0; i2 < creatures.length; i2++) {
          c = creatures[i2];
          if (c.vit < 0.35 || c.held) continue;
          dx = c.x - cx; dy = c.y - cy;
          d = Math.hypot(dx, dy);
          if (d > 300 || d < 1) continue;
          var sf = 1 - d / 300;
          c.vx += (dx / d) * 460 * sf; c.vy += (dy / d) * 460 * sf;
          startReaction(c, pick(['scamper', 'tumble', 'shed', 'spin']), 1.0, hue, t, null);
        }
        for (i2 = 0; i2 < 26; i2++) {
          var sa = Math.random() * TAU, ss = 200 + Math.random() * 500;
          emitSpark(cx, cy, Math.cos(sa) * ss, Math.sin(sa) * ss, hue + rnd(-70, 70), 1);
        }
        break;
      }
      case 'spiral': {
        // one deep whirlpool that lingers, and they orbit it
        addStir(g.b.x, g.b.y, 0.48 * sign, 0.34);
        for (i2 = 0; i2 < creatures.length; i2++) {
          c = creatures[i2];
          if (c.vit < 0.35 || c.held) continue;
          dx = c.x - g.b.x; dy = c.y - g.b.y;
          d = Math.hypot(dx, dy);
          if (d > 340 || d < 1) continue;
          var wf = 1 - d / 340;
          c.vx += (-dy / d) * 320 * wf * sign - (dx / d) * 70 * wf;
          c.vy += (dx / d) * 320 * wf * sign - (dy / d) * 70 * wf;
          c.spin += sign * 6 * wf;
          if (Math.random() < 0.6) startReaction(c, pick(['tumble', 'spin', 'sing']), 0.9, hue, t, null);
        }
        if (A.ok && A.started) {
          bowl(noteI(2), 0.05, panOf(g.b.x), 7);
          gust(0.04, panOf(g.b.x), 2.0, false);
        }
        break;
      }
      case 'zigzag': {
        for (i2 = 0; i2 < tr.length; i2 += 2) {
          for (var z = 0; z < 3; z++) {
            var za = Math.random() * TAU, zs = 180 + Math.random() * 420;
            emitSpark(tr[i2].x, tr[i2].y, Math.cos(za) * zs, Math.sin(za) * zs,
                      hue + 60 + rnd(-50, 50), 1);
          }
        }
        addStir(cx, cy, 0.20 * sign, 0.13);
        break;
      }
      default: {
        addStir(cx, cy, 0.14 * sign, 0.24);
        for (i2 = 0; i2 < creatures.length; i2++) {
          c = creatures[i2];
          if (c.vit < 0.35 || c.held) continue;
          dx = c.x - cx; dy = c.y - cy;
          d = Math.hypot(dx, dy);
          if (d > 320 || d < 1) continue;
          var bf = 1 - d / 320;
          c.vx += (p ? p.vx : 0) * 0.2 * bf; c.vy += (p ? p.vy : 0) * 0.2 * bf;
          if (Math.random() < 0.3) startReaction(c, pick(['bob', 'yawn', 'pulse']), 0.5, hue, t, null);
        }
      }
    }
  }

  /* ---- swiping leaves a stroke -----------------------------
     A drag lays down a tapering band of light, stirs a swirl into
     the liquid underneath, drags a wake through nearby creatures,
     and sounds a run up the scale as it crosses the notes. Fast
     strokes are thin and bright; slow ones are broad and soft, the
     way a loaded brush behaves. */
  function strokeStep(p, dt, t, awake) {
    var sp = p.path;
    if (sp < 60) { p.strokeOn = false; return; }
    if (!p.strokeOn) {
      p.strokeOn = true; p.spx = p.x; p.spy = p.y; p.mayCharge = false;
      p.gotFollower = false;
      traceReset(p);
    }

    var dx = p.x - p.spx, dy = p.y - p.spy;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 1) return;

    var fast = clamp(sp / 1100, 0, 1);
    /* A loaded brush: broad and soft when it dawdles, narrower and
       brighter when it flies. Not much narrower, though - the first
       version thinned to five pixels at speed, and since the bright
       pass is only a third of the width that left a one pixel core
       stamped every few pixels, which drew a dotted line rather than
       a streak of light. The marks have to overlap to be a stroke,
       so the spacing is taken from the width. */
    var wide = 15 + (1 - fast) * 26;
    var hue = world.hue + (p.x / Math.max(1, W)) * 110 - 40 + fast * 70;
    p.hue = hue;
    var lift = 0.5 + awake * 0.5;
    var step = Math.max(3, wide * 0.22);
    var n = clamp(Math.ceil(dist / step), 1, 24);
    for (var i = 1; i <= n; i++) {
      var u = i / n;
      var bx = p.spx + dx * u, by = p.spy + dy * u;
      blob(tctx, bx, by, wide * 1.7, hue - 20, (0.011 + fast * 0.015) * lift);
      blob(tctx, bx, by, wide * 0.80, hue + 30, (0.024 + fast * 0.038) * lift);
      blob(tctx, bx, by, wide * 0.32, hue + 90, (0.038 + fast * 0.070) * lift);
    }
    p.spx = p.x; p.spy = p.y;
    traceAdd(p);

    /* Stir the liquid: strength from speed, sign from which way the
       hand is curling. Fed every frame with the pointer as its owner,
       so the swirl follows the finger continuously instead of being
       re-seeded at random moments somewhere else. */
    var curlSign = (dx * (p.vy || 0) - dy * (p.vx || 0)) >= 0 ? 1 : -1;
    p.curl = approach(p.curl === undefined ? curlSign : p.curl, curlSign, 0.22, dt);
    addStir(p.x, p.y, (0.030 + fast * 0.075) * p.curl, 0.10 + fast * 0.09, p.id, 1.9);

    // a wake through anything nearby
    for (var ci = 0; ci < creatures.length; ci++) {
      var c = creatures[ci];
      if (c.vit < 0.35 || c.held) continue;
      var wx = c.x - p.x, wy = c.y - p.y;
      var wd2 = wx * wx + wy * wy;
      if (wd2 > 150 * 150 || wd2 < 1) continue;
      var wd = Math.sqrt(wd2), wf = 1 - wd / 150;
      c.vx += (p.vx * 0.10 + (wx / wd) * 16) * wf * wf * dt * 2.6;
      c.vy += (p.vy * 0.10 + (wy / wd) * 16) * wf * wf * dt * 2.6;
      c.mood = Math.max(c.mood, wf * 0.5);
      if (wd < 60 && c.cool <= 0 && Math.random() < dt * 1.4) {
        startReaction(c, pick(['bob', 'giggle', 'sparkle', 'stretch', 'spin']),
                      0.45 + fast * 0.4, hue, t, null);
      }
      /* And just occasionally one takes an interest and comes along for a
         while. One per stroke at most, and rare enough to be a small event
         rather than the thing that always happens - a swipe used to acquire
         a passenger nearly every time, because it was silently picking the
         creature UP. */
      if (!p.gotFollower && !c.chase && !c.spot && wd < 100 &&
          Math.random() < dt * 0.06 * (0.3 + c.answer)) {
        p.gotFollower = true;
        c.chase = { p: p, t: 2.5 + Math.random() * 3.5 };
        startReaction(c, 'peek', 0.4, hue, t, null);
      }
    }

  }

  /* the sound of the brush itself: air, brightening with speed */
  function strokeVoice(p, t) {
    if (!A.ok || !A.started) return;
    var want = p.down && p.path > 90;
    if (want && !p.sv) {
      try {
        var ac = A.ctx;
        var src = ac.createBufferSource();
        src.buffer = A.noiseBuf; src.loop = true;
        var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
        bp.frequency.value = 700;
        var g = ac.createGain(); g.gain.value = 0.0001;
        var pn = ac.createStereoPanner ? ac.createStereoPanner() : null;
        src.connect(bp); bp.connect(g);
        if (pn) { g.connect(pn); pn.connect(A.scene); } else { g.connect(A.scene); }
        src.start(ac.currentTime, Math.random() * 2);
        p.sv = { src: src, bp: bp, g: g, pn: pn };
      } catch (e) { p.sv = null; }
    }
    if (p.sv) {
      var nt = A.ctx.currentTime;
      var fast = clamp(p.path / 1100, 0, 1);
      p.sv.g.gain.setTargetAtTime(want ? 0.006 + fast * 0.026 : 0.0001, nt, 0.09);
      p.sv.bp.frequency.setTargetAtTime(360 + fast * 2600, nt, 0.10);
      if (p.sv.pn) p.sv.pn.pan.setTargetAtTime(panOf(p.x), nt, 0.10);
    }
  }

  function endStrokeVoice(p) {
    if (!p.sv) return;
    var sv = p.sv; p.sv = null;
    try {
      var nt = A.ctx.currentTime;
      sv.g.gain.cancelScheduledValues(nt);
      sv.g.gain.setValueAtTime(Math.max(0.0001, sv.g.gain.value), nt);
      sv.g.gain.setTargetAtTime(0.0001, nt, 0.10);
      sv.src.stop(nt + 0.7);
      sv.src.onended = function () {
        try { sv.src.disconnect(); sv.bp.disconnect(); sv.g.disconnect();
              if (sv.pn) sv.pn.disconnect(); } catch (e) {}
      };
    } catch (e) {}
  }

  function touchWorld(p, t) {
    // coming back after a while is greeted rather than ignored
    if (world.sleep > 0.30) {
      world.wake = 1;
      world.sleep = 0;
      world.idle = 0;
      markMoment(p.x, p.y, world.hue + 50, 'wake');
      for (var wi = 0; wi < creatures.length; wi++) {
        var wc = creatures[wi];
        if (wc.vit < 0.3) continue;
        wc.glowAdd = Math.max(wc.glowAdd, 0.7);
        if (Math.random() < 0.5) startReaction(wc, pick(['yawn', 'bob', 'stretch', 'pulse']),
                                              0.6, world.hue, t, null);
      }
      if (A.ok && A.started) {
        bowl(noteI(2), 0.05, -0.3, 7);
        breath(noteI(6), 0.042, 0.3, 0.7, 5.5);
      }
    }
    var c = creatureAt(p.x, p.y);
    world.poked++;
    var hue = world.hue + rnd(-40, 40);
    p.hue = hue;
    // remember what is under the finger: keep pressing and it gets
    // picked up rather than just prodded
    /* EVERY press starts clean. These two say "this particular touch has
       already been spent" and they were only ever cleared when a pointer was
       dropped - which is fine for a finger, because a finger lifting removes
       the entry entirely. A MOUSE does not: one entry lingers between clicks so
       it can go on being tracked. So popping a single bubble left popped set on
       that entry for good, and from then on every click anywhere was silently
       swallowed by the test for it in finishTap. Measured: five clicks in a row
       sounded, then one bubble, then nothing ever again.

       Per-press state has to be initialised per press. */
    p.popped = false;
    p.onBubble = false;

    /* Landing on a bubble claims the touch outright: no creature under it is
       taken, no wind-up begins, and finishTap will bow out. Otherwise every pop
       over a busy patch came with a creature's whole reaction on top of it. */
    /* The mute ring claims a press the same way a bubble does, and for the
       same reason: whatever is drifting underneath the corner is not what the
       hand came for. */
    var whichCtrl = ctrlAt(p.x, p.y);
    /* Touch anywhere else and the slider puts itself away.
       ------------------------------------------------------------
       The tick was the only way to dismiss it, which makes the tick feel like
       the thing that commits the value - and it is not, the value took effect as
       it was dragged and is written the moment the finger leaves the track. So
       anything else you touch closes it, and the touch still does whatever it
       would normally have done: this app has no modal state anywhere else and it
       should not learn one here. The tick stays, because a control that can only
       be dismissed by touching something unrelated is a puzzle. */
    if (paceUI.open && !whichCtrl) closePace();
    if (whichCtrl) {
      p.onCtrl = whichCtrl; p.onBubble = true;
      p.cand = null; p.downAt = t; p.onBody = false;
      if (whichCtrl === 'mute') mute.hold = 0.0001;
      else if (whichCtrl === 'night') night.hold = 0.0001;
      else if (whichCtrl === 'paceTrack') setPace(paceFromY(p.y));
      else if (whichCtrl === 'pace') {
        /* Open, and pressed again: that is the tick, and it takes effect at
           once rather than making you hold a second time. Holding is the guard
           against opening it by accident; once it is open you are plainly
           meaning to use it, and a second hold would just be a chore. */
        if (paceUI.open) { closePace(); p.onCtrl = null; }
        else paceUI.hold = 0.0001;
      }
      return;
    }
    p.onCtrl = null;
    if (bubbleAt(p.x, p.y) || anyNoteAt(p.x, p.y)) {
      p.onBubble = true;
      p.cand = null; p.downAt = t; p.onBody = false;
      return;
    }
    p.onBubble = false;
    p.cand = c; p.downAt = t;
    p.onBody = onBody(c, p.x, p.y);
    p.tapX = p.x; p.tapY = p.y;
    /* Nothing sounds and nothing happens yet. Pressing used to fire the
       note and prod whatever was underneath immediately, which meant
       setting out to carry a creature fired the prod first and the carry
       second - you got both and could aim neither - and a swipe sounded
       a note it had no business sounding. What this touch turns out to
       be is decided when it ends, by finishTap. A press in open space
       still answers at once, with the rising tone of its charge. */
    /* Permission to wind up is granted on the same test the frame loop uses
       to decide a grab, and for the same reason. It used to be granted only
       when the hit test found nothing at all - and that test reaches about
       twice the visible body, so a press forty pixels clear of anything was
       still "on" a creature and could never wind up. On a screen with fifty
       of them there was hardly a square inch of real open space left, which
       is why long presses so often did nothing. Landing in the halo is now
       undecided rather than taken, and undecided may become a wave. */
    if (c && onBody(c, p.x, p.y)) {
      for (var i = 0; i < 5; i++) emitSpark(c.x, c.y, 0, 0, hue, 0.35);
    } else {
      // open space, or near enough: this MIGHT become a wind-up, but not yet -
      // see the frame loop, which starts it once the press has settled what it is
      p.mayCharge = true;
      for (var j = 0; j < 5; j++) emitSpark(p.x, p.y, 0, 0, hue, 0.35);
    }
    world.lastPulse = t;
  }

  /* ============================================================
     DRAWING A CREATURE
     ============================================================ */
  /* ============================================================
     A PILE THAT GOES OFF
     ------------------------------------------------------------
     Herd enough of them into one place and they start drawing
     together on their own - the pull grows as the pile does, so it
     gets easier to finish than to start, which is what makes it
     worth doing. Hold it together and the whole heap goes up.

     Not everybody is consumed and the ones that are come back
     almost at once, so the world is never emptied by it.
     ============================================================ */
  var clump = { on: false, x: 0, y: 0, n: 0, t: 0, ready: 0 };
  // six, not five: five happens by chance in a random scatter
  var CLUMP_R = 130, CLUMP_MIN = 6, CLUMP_HOLD = 1.9;

  function updateClump(dt, t) {
    if (LEVEL < 3) { clump.on = false; clump.ready = 0; return; }
    /* Only ever while a hand is present and near it. At load the
       creatures are scattered at random, so some patch of screen
       always happens to hold five of them, and the pile would build
       and detonate on its own within seconds of opening the page.
       Herding them is the point; a pile nobody made is just noise. */
    if (!pointers.size) {
      clump.on = false; clump.n = 0;
      clump.ready = Math.max(0, clump.ready - dt * 1.6);
      return;
    }
    // densest neighbourhood in the world right now
    var bestN = 0, bx = 0, by = 0;
    for (var i = 0; i < creatures.length; i++) {
      var c = creatures[i];
      if (c.vit < 0.4 || c.held) continue;
      var n = 0, sx = 0, sy = 0;
      for (var j = 0; j < creatures.length; j++) {
        var o = creatures[j];
        // the one in your hand is not part of the pile it is forming, or
        // simply carrying something into a group would start one
        if (o.vit < 0.4 || o.held) continue;
        var dx = o.x - c.x, dy = o.y - c.y;
        if (dx * dx + dy * dy < CLUMP_R * CLUMP_R) { n++; sx += o.x; sy += o.y; }
      }
      if (n > bestN) { bestN = n; bx = sx / n; by = sy / n; }
    }

    // and the hand has to be at the pile, not merely somewhere on screen
    var handNear = false;
    pointers.forEach(function (pp) {
      if (Math.hypot(pp.x - bx, pp.y - by) < 320) handNear = true;
    });

    if (bestN >= CLUMP_MIN && handNear) {
      var moved = clump.on ? Math.hypot(bx - clump.x, by - clump.y) : 0;
      if (clump.on && moved < 150) {
        clump.t += dt;
      } else {
        clump.on = true; clump.t = 0;
      }
      clump.x = bx; clump.y = by; clump.n = bestN;
      clump.ready = clamp(clump.t / CLUMP_HOLD, 0, 1);
      // the heap pulls itself in harder the longer it holds
      var pull = 40 + clump.ready * 260;
      for (var k = 0; k < creatures.length; k++) {
        var m = creatures[k];
        if (m.vit < 0.4 || m.held) continue;
        var mx = clump.x - m.x, my = clump.y - m.y;
        var md = Math.sqrt(mx * mx + my * my);
        if (md > CLUMP_R * 1.9 || md < 1) continue;
        m.vx += (mx / md) * pull * dt;
        m.vy += (my / md) * pull * dt;
        /* Per creature and falling off with distance, so the outer members
           drop below their own decay rate and go dark again instead of being
           held at a matching brightness for the whole hold. */
        var mk = (1 - md / (CLUMP_R * 1.9));
        m.mood = Math.max(m.mood, clump.ready * mk * (0.25 + m.answer * 0.55));
        m.glowAdd = Math.max(m.glowAdd, clump.ready * mk * (0.08 + m.answer * 0.5));
      }
      if (clump.t >= CLUMP_HOLD) blowClump(t);
    } else {
      clump.on = false;
      clump.ready = Math.max(0, clump.ready - dt * 1.6);
      clump.n = 0;
    }
  }

  function blowClump(t) {
    var cx = clump.x, cy = clump.y;
    markMoment(cx, cy, world.hue + 60, 'clump');
    clump.on = false; clump.t = 0; clump.ready = 0;
    var hue = world.hue + 50;

    for (var i = 0; i < 90; i++) {
      var a = Math.random() * TAU, sp = 220 + Math.random() * 780;
      emitSpark(cx, cy, Math.cos(a) * sp, Math.sin(a) * sp, hue + rnd(-70, 70), 1.2);
    }
    spawnPulse(cx, cy, {
      energy: 1.5, reach: 0.9, budget: 26, uni: 0.9,
      kind: RIPPLES[1], layers: [0, 1, 2], speed: 420, show: 1.6
    });

    var consumed = 0;
    for (var k = 0; k < creatures.length; k++) {
      var m = creatures[k];
      if (m.vit < 0.3 || m.held) continue;
      var dx = m.x - cx, dy = m.y - cy;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > CLUMP_R * 1.7) continue;
      // it is meant to be bright - it is the thing you built - but not
      // identically bright on everybody at once
      var bk = 0.35 + m.answer * 0.85 * (1 - d / (CLUMP_R * 1.7));
      var nx = d < 1 ? Math.cos(Math.random() * TAU) : dx / d;
      var ny = d < 1 ? Math.sin(Math.random() * TAU) : dy / d;
      // most are flung clear; a few are used up and straight back
      if (Math.random() < 0.34 && consumed < 4) {
        consumed++;
        m.x = Math.random() * W; m.y = Math.random() * H;
        m.vit = 0; m.age = 0; m.span = rnd(90, 240);
        m.size = rnd(m.sp.sz[0], m.sp.sz[1]);
        m.hueOff = rnd(-175, 175); m.flare = 1;
      } else {
        m.vx = nx * (420 + Math.random() * 520);
        m.vy = ny * (420 + Math.random() * 520);
        m.spin += rnd(-8, 8);
        startReaction(m, pick(['bloom', 'giggle', 'sparkle', 'tumble']), bk, hue, t, null);
      }
    }
    world.pop = Math.min(6, world.pop + 2);
    if (A.ok && A.started) {
      bowl(noteI(2), 0.06, 0, 8);
      breath(noteI(6), 0.05, -0.3, 0.8, 6);
      chime(noteI(11), 0.05, 0.3, 1, 3);
      gust(0.05, 0, 1.6, false);
    }
  }

  function drawClump(t, awake) {
    if (clump.ready <= 0.02) return;
    var k = clump.ready;
    var hue = world.hue + 40 + k * 80;
    // it visibly gathers into one mass before it lets go
    for (var i = 0; i < 3; i++) {
      var ph = (t * (0.8 + k * 2.2) + i / 3) % 1;
      wave(tctx, clump.x, clump.y, (1 - ph) * (170 + k * 90) + 18, hue,
           (0.05 + k * 0.26) * ph * (0.4 + awake * 0.6));
    }
    blob(tctx, clump.x, clump.y, 22 + k * 90, hue, 0.05 + k * 0.30);
    blob(tctx, clump.x, clump.y, 6 + k * 30, hue + 70, 0.12 + k * 0.60);
  }

  function drawAnticipation(c, t, awake) {
    if (c.antic <= 0.02) return;
    var k = c.antic;
    /* A line drawn between the two of them, thickening and
       straightening as they close. It answers the only question that
       matters while you are steering: am I near enough yet. Once
       locked it stops wavering and goes bright. */
    if (c.pairWith && c.pairWith.vit > 0.3) {
      var h2 = c.pairWith;
      var lh = world.hue + 70 + k * 70;
      var seg = 9;
      var sag = c.locked ? 0 : (1 - k) * 26;
      for (var i = 0; i <= seg; i++) {
        var u = i / seg;
        var lx = lerp(h2.x, c.x, u);
        var ly = lerp(h2.y, c.y, u) + Math.sin(u * Math.PI) * sag * Math.sin(t * 3 + u * 4);
        blob(tctx, lx, ly, (c.locked ? 3.4 : 2.2) + k * 2.6, lh,
             (c.locked ? 0.30 : 0.10 + k * 0.16) * Math.sin(u * Math.PI) * (0.4 + awake * 0.6));
      }
    }
    var hue = world.hue + c.hueOff + 60 + k * 60;
    var sz = c.size * LAYERS[c.L].size;
    // a ring that TIGHTENS as you close the gap, so the signal reads as
    // "bring it here" rather than as something being given off
    for (var i = 0; i < 2; i++) {
      var ph = (t * (1.1 + k * 1.9) + i * 0.5) % 1;
      wave(tctx, c.x, c.y, (1 - ph) * (sz * 3.4 + 60 * k) + sz * 0.9, hue,
           (0.05 + k * 0.30) * ph * (0.4 + awake * 0.6));
    }
    blob(tctx, c.x, c.y, sz * (1.1 + k * 1.1), hue, (0.05 + k * 0.28));
    blob(tctx, c.x, c.y, sz * 0.42, hue + 60, 0.14 + k * 0.5);
    if (c.locked) {
      var beat = 0.6 + 0.4 * Math.sin(t * 9);
      wave(tctx, c.x, c.y, sz * 2.5 + 10, hue + 40, 0.28 * beat);
      blob(tctx, c.x, c.y, sz * 0.8, hue + 90, 0.34 * beat);
    }
  }

  function drawCreature(c, t, awake) {
    var L = LAYERS[c.L];
    var m = reactionLook(c, t);
    var sz = c.size * L.size * m.scale * (0.85 + c.mood * 0.3);
    var hue = world.hue + c.hueOff + c.mood * 40 + m.hue;
    var al = L.alpha * c.vit * (0.45 + awake * 0.55) * m.alpha * 1.45;
    // held back for a beat while a meeting has the stage
    if (momentK > 0.01) {
      var mdx = c.x - moment.x, mdy = c.y - moment.y;
      if (mdx * mdx + mdy * mdy > 22500) al *= 1 - momentK * 0.62;   // 150 squared
    }
    var gl = Math.max(-0.55, m.glow + c.glowAdd + bloom.k * 0.22);
    al *= 1 + bloom.k * 0.16;
    /* A large creature's core is a large patch of near-white, and several
       overlapping ones add up past white and lose all their colour. Bigger
       things are drawn thinner so that a crowd of them stays coloured. */
    /* Worlds are not exempt from this. They were, and they were the biggest
       things on the screen, so they went white first - which is the exact
       failure this line exists to prevent. They get a gentler curve, not a
       pass, because a world should still read as the heaviest thing here. */
    al *= 1 - clamp((c.size - 22) / 70, 0, 1) * (c.world ? 0.30 : 0.42);
    /* Under a world - or an ember - the ordinary body drops right back. In
       both cases the special drawing IS the creature now, and leaving the
       species core at full strength puts a bright disc back in the middle.

       For the ember this was not cosmetic. Measured at the pixel: its core
       came out 255,255,255. The ember's whole claim to being findable is that
       it is the red one, and the palette-coloured body underneath was adding
       enough green and blue to turn it white - so the one creature that was
       supposed to be unmistakable looked like all the others. */
    var wDim = c.world ? 0.10 : (c.ember ? 0.26 : 1);
    var jx = m.jit ? Math.sin(t * 41 + c.phase) * m.jit : 0;
    var jy = m.jit ? Math.cos(t * 37 + c.phase) * m.jit : 0;
    var x = c.x + jx, y = c.y + jy;
    var wob = 1 + Math.sin(c.phase * 2.1) * c.sp.wob * 0.3 * m.wob;
    // stretch along heading
    var v = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
    var ux = v > 1 ? c.vx / v : 1, uy = v > 1 ? c.vy / v : 0;
    var el = m.squash * sz * 2.2;

    // the trail every creature leaves
    var tn = c.tail.length;
    for (var i = 0; i < tn; i++) {
      var idx = (c.head - i + tn * 2) % tn;
      var tp = c.tail[idx], fade = 1 - i / tn;
      blob(tctx, tp.x, tp.y, sz * (0.28 + fade * 0.7), hue - i * 2,
           fade * fade * 0.22 * al * m.tail * wDim);
    }

    // an outline, when the answer calls for one
    if (m.ring > 0.002) wave(tctx, x, y, sz * m.ringR, hue + 40, m.ring * al);

    /* An elder is known by being large, slow and deep in colour - not
       by wearing a ring. The breathing halo I gave them drew a wave
       every frame whether or not anything had happened, so an
       untouched screen looked like several creatures were already
       reacting to something. Rings are reserved for things the player
       caused. */
    /* ---- a world, once it is heavy enough ---------------------
       It is still made of the same soft light as everything else - a hard
       edged sphere among all this would look pasted on - but it gets the
       three things that say planet: a body with weight to it, patches of
       colour that turn with it, and an atmosphere that catches the light
       round one limb. It fades in as the thing grows, so you watch a
       creature become a world rather than being handed one. */
    if (c.ember) drawEmber(c, x, y, sz, al, t);

    /* ---- a world -------------------------------------------------
       Painted on its own canvas (see PAINTING A WORLD) and stamped in with
       source-over so it genuinely covers what is behind it, then given its
       glow back in the buffer's own lighter mode. */
    if (c.world) {
      /* How much of the planet is drawn at all - the surface, the air, the
         halo, all of it. This USED to be "how far has it grown past birth",
         which made sense while a planet grew and born0 was the small size it
         started from.

         Then I pinned size to born0 so a planet would be one size, and this
         became clamp(-0.25 * born0 / 14, 0, 1), which is zero. Every part of
         the body was being drawn at zero opacity and what was left on screen
         was the ordinary creature glow underneath with nothing on top of it: a
         featureless shining ball. Measured nothing about it, because I checked
         the geometry and never checked that the thing was actually drawn.

         Age, not size. It fades in over a second as it forms, which is what
         the fade was for. */
      var pk = clamp(c.age / 0.9, 0, 1);
      var pr = worldR(c);
      var lit2 = t * 0.05 + c.phase;
      var lx2 = Math.cos(lit2), ly2 = Math.sin(lit2);
      if (!c.land) makeLand(c, c.ptype === 3 ? 11 : (c.ptype === 1 ? 2 : 4),
                          c.ptype === 3 ? 0.55 : 1.5);
      if (!c.cloud) {
        c.cloud = [];
        for (var ci3 = 0; ci3 < 5; ci3++) {
          c.cloud.push({ lon: Math.random() * TAU, lat: (Math.random() - 0.5) * 1.7,
                         size: 0.34 + Math.random() * 0.3, hue: 0,
                         wob: Math.random() * TAU, k: 1 });
        }
      }

      // the air, outside the body, in the buffer's own mode
